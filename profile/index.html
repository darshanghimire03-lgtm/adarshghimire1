<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Profile · Durbar</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0c1f4a;
    --blue: #1f3a8a;
    --role-blue: #1f4aa8;
    --muted: #98a2b8;
    --tint: #eaf1fd;
    --tint-line: #d3dff5;
    --card: #f3f7ff;
    --like: #e53935;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: #ffffff;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #111827;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: calc(16px + env(safe-area-inset-top)) 16px 12px 16px;
  }

  .back-btn,
  .menu-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
  }

  .back-btn svg {
    width: 26px;
    height: 26px;
    stroke: #5b6376;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .menu-btn svg {
    width: 28px;
    height: 28px;
    stroke: var(--navy);
    fill: none;
    stroke-width: 2.6;
    stroke-linecap: round;
  }

  .top-title {
    flex: 1;
    min-width: 0;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .menu-wrap {
    position: relative;
  }

  .menu {
    display: none;
    position: absolute;
    right: 0;
    top: 46px;
    min-width: 170px;
    background: #ffffff;
    border: 1.5px solid var(--tint-line);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(12, 31, 74, 0.14);
    padding: 6px;
    z-index: 40;
  }

  .menu.open {
    display: block;
  }

  .menu button {
    width: 100%;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy);
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    cursor: pointer;
  }

  .menu button:active {
    background: var(--tint);
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 12px 20px 0 20px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1.5px solid var(--tint-line);
    background: #dfe8f8;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .name {
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.01em;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .role-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    min-height: 22px;
  }

  .role {
    font-size: 1.05rem;
    color: var(--role-blue);
    font-weight: 500;
  }

  .badge {
    width: 20px;
    height: 20px;
    fill: #7b8190;
    flex-shrink: 0;
  }

  .badge.blue {
    fill: #1d9bf0;
  }

  .btn-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .change-btn {
    height: 38px;
    padding: 0 18px;
    border: none;
    border-radius: 14px;
    background: var(--navy);
    color: #ffffff;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .change-btn:disabled {
    opacity: 0.65;
    cursor: default;
  }

  .change-btn svg {
    width: 20px;
    height: 20px;
    fill: #ffffff;
  }

  .share-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1.5px solid var(--tint-line);
    background: var(--tint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .share-btn svg {
    width: 22px;
    height: 22px;
    stroke: var(--navy);
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tabs {
    display: flex;
    gap: 10px;
    padding: 22px 20px 0 20px;
  }

  .tab {
    border: none;
    height: 34px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--tint);
    color: var(--navy);
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active {
    background: var(--blue);
    color: #ffffff;
  }

  .content {
    padding: 22px 20px 0 20px;
  }

  .state {
    text-align: center;
    color: var(--muted);
    font-size: 1.05rem;
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .retry-btn {
    border: none;
    background: var(--tint);
    color: var(--role-blue);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.98rem;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .post {
    background: var(--tint);
    border-radius: 26px;
    padding: 16px 18px 12px 18px;
  }

  .post-date {
    font-size: 0.88rem;
    color: #6b7a99;
    font-weight: 500;
  }

  .post-text {
    margin-top: 10px;
    font-size: 1.05rem;
    line-height: 1.55;
    color: #1a1f2b;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .post-text a {
    color: var(--role-blue);
  }

  .post-image {
    display: block;
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    border-radius: 16px;
    margin-top: 12px;
    background: #d9e3f6;
  }

  .post-foot {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1.5px solid #cfd9ec;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: #1c2333;
    font-size: 1rem;
  }

  .post-foot svg {
    width: 26px;
    height: 26px;
    stroke: #8a94a8;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .post-foot svg.liked {
    fill: var(--like);
    stroke: var(--like);
  }

  .short-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .short-tile {
    position: relative;
    display: block;
    aspect-ratio: 9 / 16;
    border-radius: 16px;
    overflow: hidden;
    background: #d9e3f6;
    text-decoration: none;
  }

  .short-tile img,
  .short-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .short-meta {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 8px 8px 8px;
    background: linear-gradient(to top, rgba(12, 31, 74, 0.8), rgba(12, 31, 74, 0));
    color: #ffffff;
    font-size: 0.78rem;
    font-weight: 600;
  }

  .short-meta .t {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .short-meta .v {
    margin-top: 2px;
    font-weight: 500;
    opacity: 0.85;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 500;
    max-width: 90%;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header class="top-bar">
  <a class="back-btn" href="../index.html" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="top-title" id="topTitle">Profile</h1>
  <div class="menu-wrap">
    <button class="menu-btn" type="button" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="menu" id="menu">
      <button type="button" id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<section class="profile">
  <img class="avatar" id="avatar" src="../favicon.png" alt="Profile photo">
  <div class="info">
    <h2 class="name" id="name"></h2>
    <div class="role-row" id="roleRow">
      <span class="role" id="role"></span>
      <svg class="badge" id="badge" viewBox="0 0 24 24" style="display:none"><path d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/></svg>
    </div>
    <div class="btn-row">
      <button class="change-btn" type="button" id="changeBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13.2" r="3.4"/><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill-rule="evenodd"/></svg>
        <span id="changeLabel">Change profile</span>
      </button>
      <button class="share-btn" type="button" id="shareBtn" aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.8 7.7L12 3.5l4.2 4.2M5 11.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5"/></svg>
      </button>
    </div>
  </div>
</section>

<input type="file" id="fileInput" accept="image/*" hidden>

<div class="tabs">
  <button class="tab active" type="button" data-tab="posts">Posts</button>
  <button class="tab" type="button" data-tab="shorts">Shorts</button>
</div>

<div class="content" id="content"></div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  (function () {
    var SVG_NS = "http://www.w3.org/2000/svg";
    var HEART_PATH = "M12 20.5l-1.2-1.08C6 15.2 3 12.5 3 9a4.6 4.6 0 0 1 4.7-4.7c1.6 0 3.1.8 4.3 2.2 1.2-1.4 2.7-2.2 4.3-2.2A4.6 4.6 0 0 1 21 9c0 3.5-3 6.2-7.8 10.42L12 20.5z";
    var SHORT_OWNER_FIELDS = ["uploaderUid", "uploadedBy", "authorUid", "uid", "userId", "ownerUid", "createdBy"];
    var LOAD_TIMEOUT_MS = 12000;

    var avatarEl = document.getElementById("avatar");
    var nameEl = document.getElementById("name");
    var topTitleEl = document.getElementById("topTitle");
    var roleEl = document.getElementById("role");
    var badgeEl = document.getElementById("badge");
    var contentEl = document.getElementById("content");
    var toastEl = document.getElementById("toast");
    var menuEl = document.getElementById("menu");
    var changeBtn = document.getElementById("changeBtn");
    var changeLabel = document.getElementById("changeLabel");
    var fileInput = document.getElementById("fileInput");
    var tabs = document.querySelectorAll(".tab");

    var currentUser = null;
    var displayName = "";
    var activeTab = "posts";
    var cache = { posts: null, shorts: null };

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () {
        toastEl.classList.remove("show");
      }, 3000);
    }

    function formatDate(ms) {
      if (!ms || typeof ms !== "number") return "";
      var d = new Date(ms);
      return d.toLocaleDateString("en-US", { month: "long" }) + " " + String(d.getDate()).padStart(2, "0") + ", " + d.getFullYear();
    }

    function formatViews(n) {
      n = n || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function capitalize(s) {
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
    }

    function linkify(container, text) {
      var pattern = /(https?:\/\/[^\s]+)/g;
      var last = 0;
      var match;
      while ((match = pattern.exec(text)) !== null) {
        if (match.index > last) {
          container.appendChild(document.createTextNode(text.slice(last, match.index)));
        }
        var a = document.createElement("a");
        a.href = match[1];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = match[1];
        container.appendChild(a);
        last = match.index + match[1].length;
      }
      if (last < text.length) {
        container.appendChild(document.createTextNode(text.slice(last)));
      }
    }

    function likeCount(post) {
      var l = post.likes;
      if (l && typeof l === "object") return { count: Object.keys(l).length, liked: !!currentUser && l[currentUser.uid] !== undefined && l[currentUser.uid] !== false };
      if (typeof l === "number") return { count: l, liked: false };
      if (typeof post.likeCount === "number") return { count: post.likeCount, liked: false };
      return { count: 0, liked: false };
    }

    function videoThumb(videoUrl) {
      if (!videoUrl || videoUrl.indexOf("res.cloudinary.com") === -1 || videoUrl.indexOf("/video/upload/") === -1) return "";
      return videoUrl
        .replace("/video/upload/", "/video/upload/so_0,w_400,h_700,c_fill,q_auto,f_jpg/")
        .replace(/\.[a-zA-Z0-9]{2,4}(\?.*)?$/, ".jpg");
    }

    function showState(message, withRetry, onRetry) {
      contentEl.textContent = "";
      var box = el("div", "state");
      box.appendChild(el("div", "", message));
      if (withRetry) {
        var btn = el("button", "retry-btn", "Retry");
        btn.type = "button";
        btn.addEventListener("click", onRetry);
        box.appendChild(btn);
      }
      contentEl.appendChild(box);
    }

    function buildPost(post) {
      var card = el("article", "post");
      var date = formatDate(post.createdAt);
      if (date) card.appendChild(el("div", "post-date", date));

      if (post.text) {
        var body = el("div", "post-text");
        linkify(body, post.text);
        card.appendChild(body);
      }

      if (post.imageUrl) {
        var img = document.createElement("img");
        img.className = "post-image";
        img.loading = "lazy";
        img.alt = "";
        img.src = post.imageUrl;
        img.onerror = function () {
          img.style.display = "none";
        };
        card.appendChild(img);
      }

      var info = likeCount(post);
      var foot = el("div", "post-foot");
      var heart = document.createElementNS(SVG_NS, "svg");
      heart.setAttribute("viewBox", "0 0 24 24");
      if (info.liked) heart.setAttribute("class", "liked");
      var p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", HEART_PATH);
      heart.appendChild(p);
      foot.appendChild(heart);
      foot.appendChild(el("span", "", String(info.count)));
      card.appendChild(foot);
      return card;
    }

    function renderPosts(posts) {
      if (!posts.length) {
        showState("No posts yet", false);
        return;
      }
      contentEl.textContent = "";
      var list = el("div", "post-list");
      posts.forEach(function (post) {
        list.appendChild(buildPost(post));
      });
      contentEl.appendChild(list);
    }

    function renderShorts(shorts) {
      if (!shorts.length) {
        showState("No shorts yet", false);
        return;
      }
      contentEl.textContent = "";
      var grid = el("div", "short-grid");
      shorts.forEach(function (s) {
        var a = el("a", "short-tile");
        a.href = "../shorts/?id=" + encodeURIComponent(s.shortId);

        var thumb = videoThumb(s.videoUrl);
        if (thumb) {
          var img = document.createElement("img");
          img.loading = "lazy";
          img.alt = "";
          img.src = thumb;
          a.appendChild(img);
        } else if (s.videoUrl) {
          var video = document.createElement("video");
          video.src = s.videoUrl;
          video.preload = "metadata";
          video.muted = true;
          video.playsInline = true;
          a.appendChild(video);
        }

        var meta = el("div", "short-meta");
        meta.appendChild(el("div", "t", s.title || "Untitled"));
        meta.appendChild(el("div", "v", formatViews(s.views) + " views"));
        a.appendChild(meta);
        grid.appendChild(a);
      });
      contentEl.appendChild(grid);
    }

    function withTimeout(promise) {
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          reject(new Error("timeout"));
        }, LOAD_TIMEOUT_MS);
        promise.then(function (v) {
          clearTimeout(timer);
          resolve(v);
        }, function (e) {
          clearTimeout(timer);
          reject(e);
        });
      });
    }

    function fetchPosts(uid) {
      return db.ref("posts").orderByChild("authorUid").equalTo(uid).once("value").then(function (snap) {
        var list = [];
        snap.forEach(function (child) {
          var v = child.val();
          if (v && typeof v === "object") {
            var post = {};
            for (var k in v) post[k] = v[k];
            post.id = child.key;
            list.push(post);
          }
        });
        list.sort(function (a, b) {
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
        return list;
      });
    }

    function fetchShorts(uid) {
      return db.ref("shorts").once("value").then(function (snap) {
        var list = [];
        snap.forEach(function (child) {
          var v = child.val();
          if (!v || typeof v !== "object") return;
          var mine = SHORT_OWNER_FIELDS.some(function (f) {
            return v[f] === uid;
          });
          if (mine) {
            var s = {};
            for (var k in v) s[k] = v[k];
            s.shortId = child.key;
            list.push(s);
          }
        });
        list.sort(function (a, b) {
          return (b.uploadedDate || 0) - (a.uploadedDate || 0);
        });
        return list;
      });
    }

    function loadTab(tab) {
      if (!currentUser) return;
      var uid = currentUser.uid;

      if (cache[tab]) {
        tab === "posts" ? renderPosts(cache[tab]) : renderShorts(cache[tab]);
        return;
      }

      showState("Loading...", false);

      var request = tab === "posts" ? fetchPosts(uid) : fetchShorts(uid);
      withTimeout(request).then(function (list) {
        cache[tab] = list;
        if (activeTab !== tab) return;
        tab === "posts" ? renderPosts(list) : renderShorts(list);
      }).catch(function () {
        if (activeTab !== tab) return;
        showState("Couldn't load " + tab + ".", true, function () {
          loadTab(tab);
        });
      });
    }

    function applyProfile(name, role, photo) {
      displayName = name || "Profile";
      nameEl.textContent = displayName;
      topTitleEl.textContent = displayName;
      document.title = displayName + " · Durbar";

      var roleText = capitalize((role || "").toLowerCase());
      roleEl.textContent = roleText;
      if (roleText) {
        badgeEl.style.display = "";
        badgeEl.setAttribute("class", "badge" + (roleText.toLowerCase() === "moderator" ? "" : " blue"));
      } else {
        badgeEl.style.display = "none";
      }

      if (photo) avatarEl.src = photo;
    }

    function start(user) {
      currentUser = user;
      var fallbackName = user.displayName || (user.email ? user.email.split("@")[0] : "");
      applyProfile(fallbackName, "", user.photoURL || "");

      db.ref("users").child(user.uid).once("value").then(function (snap) {
        var u = snap.val() || {};
        applyProfile(
          typeof u.fullName === "string" && u.fullName.trim() ? u.fullName.trim() : fallbackName,
          typeof u.role === "string" ? u.role : "",
          typeof u.profileImageUrl === "string" && u.profileImageUrl ? u.profileImageUrl : (user.photoURL || "")
        );
      }).catch(function () {});

      loadTab(activeTab);
    }

    function resizeImage(file, maxSide) {
      var source = window.createImageBitmap
        ? createImageBitmap(file, { imageOrientation: "from-image" })
        : Promise.reject(new Error("unsupported"));

      return source.then(function (bmp) {
        var scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
        var w = Math.round(bmp.width * scale);
        var h = Math.round(bmp.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) {
            resolve(blob || file);
          }, "image/jpeg", 0.88);
        });
      }).catch(function () {
        return file;
      });
    }

    function uploadToCloudinary(blob) {
      var form = new FormData();
      form.append("file", blob);
      form.append("upload_preset", CLOUDINARY.uploadPreset);
      return fetch("https://api.cloudinary.com/v1_1/" + encodeURIComponent(CLOUDINARY.cloudName) + "/image/upload", {
        method: "POST",
        body: form
      }).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || !data.secure_url) {
            throw new Error((data && data.error && data.error.message) || "Upload failed");
          }
          return data.secure_url;
        });
      });
    }

    changeBtn.addEventListener("click", function () {
      if (!currentUser) return;
      if (!CLOUDINARY.cloudName || !CLOUDINARY.uploadPreset) {
        showToast("Set CLOUDINARY cloudName and uploadPreset in firebase-config.js");
        return;
      }
      fileInput.click();
    });

    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file || !currentUser) return;

      changeBtn.disabled = true;
      changeLabel.textContent = "Uploading...";

      resizeImage(file, 640).then(uploadToCloudinary).then(function (url) {
        return db.ref("users").child(currentUser.uid).update({ profileImageUrl: url }).then(function () {
          avatarEl.src = url;
          showToast("Profile photo updated");
        });
      }).catch(function (err) {
        showToast("Couldn't update photo: " + (err && err.message ? err.message : "try again"));
      }).then(function () {
        changeBtn.disabled = false;
        changeLabel.textContent = "Change profile";
      });
    });

    document.getElementById("shareBtn").addEventListener("click", function () {
      var url = location.origin + "/";
      if (navigator.share) {
        navigator.share({ title: displayName + " on Durbar", url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          showToast("Link copied");
        }).catch(function () {});
      }
    });

    document.getElementById("menuBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      menuEl.classList.toggle("open");
    });

    document.addEventListener("click", function () {
      menuEl.classList.remove("open");
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
      logout();
    });

    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        tabs.forEach(function (t) {
          t.classList.remove("active");
        });
        tab.classList.add("active");
        activeTab = tab.getAttribute("data-tab");
        loadTab(activeTab);
      });
    });

    auth.onAuthStateChanged(function (user) {
      if (user && !currentUser) start(user);
    });
  })();
</script>

</body>
</html>
