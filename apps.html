<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<title>Our Apps - Doroi Software & Development</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html, body{
height:100%;
}

body{
min-height:100vh;
background:#020617;
color:white;
position:relative;
overflow-x:hidden;
}

.header{
width:100%;
position:sticky;
top:0;
left:0;
z-index:50;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 24px;
background:rgba(2,6,23,.75);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
width:100%;
max-width:1200px;
margin:0 auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
color:white;
}

.header-logo{
width:36px;
height:36px;
border-radius:8px;
object-fit:cover;
}

.header-title{
font-size:18px;
font-weight:700;
letter-spacing:.5px;
}

.header-sub{
font-size:10px;
letter-spacing:1px;
color:#94a3b8;
font-weight:600;
text-transform:uppercase;
}

.header-title span{
color:#3b82f6;
}

.header-right{
display:flex;
align-items:center;
gap:14px;
}

.header-user{
display:none;
align-items:center;
gap:10px;
padding:6px 14px 6px 6px;
border-radius:50px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
text-decoration:none;
color:white;
transition:.25s;
cursor:pointer;
}

.header-user.show{
display:flex;
}

.header-user:hover{
background:rgba(255,255,255,.12);
border-color:rgba(59,130,246,.4);
}

.header-user-avatar{
width:32px;
height:32px;
border-radius:50%;
object-fit:cover;
background:linear-gradient(135deg,#2563eb,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:700;
color:white;
flex-shrink:0;
}

.header-user-name{
font-size:13.5px;
font-weight:600;
max-width:120px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.back-btn{
width:44px;
height:44px;
border-radius:50%;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:17px;
color:white;
transition:.25s;
flex-shrink:0;
text-decoration:none;
}

.back-btn:hover{
background:#2563eb;
}

.gate-wrap{
min-height:calc(100vh - 66px);
display:none;
align-items:center;
justify-content:center;
padding:24px;
}

.gate-wrap.show{
display:flex;
}

.gate-spinner{
font-size:30px;
color:#3b82f6;
}

.apps-hero{
position:relative;
width:100%;
padding:70px 24px 50px;
text-align:center;
overflow:hidden;
background:radial-gradient(ellipse at top,#0b2f6b 0%,#0f172a 45%,#020617 100%);
display:none;
}

.apps-hero.show{
display:block;
}

.apps-hero::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#2563eb;
filter:blur(160px);
top:-120px;
left:-100px;
opacity:.4;
pointer-events:none;
}

.apps-hero-inner{
position:relative;
z-index:2;
max-width:900px;
margin:0 auto;
}

.apps-hero-badge{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 18px;
border-radius:50px;
background:rgba(59,130,246,.12);
border:1px solid rgba(59,130,246,.3);
color:#93c5fd;
font-size:13px;
font-weight:600;
margin-bottom:22px;
}

.apps-hero-badge i{
font-size:8px;
color:#3b82f6;
}

.apps-hero h1{
font-size:40px;
font-weight:700;
margin-bottom:14px;
}

.apps-hero h1 span{
color:#3b82f6;
}

.apps-hero p{
font-size:15.5px;
color:#94a3b8;
line-height:1.7;
max-width:560px;
margin:0 auto;
}

.apps-section{
width:100%;
padding:20px 24px 90px;
display:none;
}

.apps-section.show{
display:block;
}

.apps-inner{
max-width:1200px;
margin:0 auto;
}

.apps-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
}

.app-card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:30px 26px;
transition:.3s;
display:flex;
flex-direction:column;
gap:14px;
}

.app-card:hover{
background:rgba(255,255,255,.07);
border-color:rgba(59,130,246,.4);
transform:translateY(-6px);
box-shadow:0 16px 40px rgba(0,0,0,.35);
}

.app-icon{
width:58px;
height:58px;
border-radius:16px;
background:linear-gradient(135deg,#2563eb,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:white;
box-shadow:0 8px 20px rgba(37,99,235,.35);
}

.app-card h3{
font-size:18px;
font-weight:700;
}

.app-card p{
font-size:13.5px;
color:#94a3b8;
line-height:1.65;
flex-grow:1;
}

.app-status{
display:inline-flex;
align-items:center;
gap:6px;
width:fit-content;
padding:5px 14px;
border-radius:50px;
font-size:11px;
font-weight:700;
letter-spacing:.5px;
text-transform:uppercase;
}

.app-status.live{
background:rgba(34,197,94,.15);
color:#4ade80;
}

.app-status.soon{
background:rgba(59,130,246,.15);
color:#93c5fd;
}

.app-open-btn{
margin-top:6px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
padding:11px 20px;
border-radius:10px;
background:#2563eb;
color:white;
border:none;
font-weight:600;
font-size:13.5px;
cursor:pointer;
font-family:inherit;
text-decoration:none;
transition:.25s;
}

.app-open-btn:hover{
background:#1d4ed8;
}

.app-open-btn.disabled{
background:rgba(255,255,255,.06);
color:#64748b;
cursor:not-allowed;
pointer-events:none;
}

@media (max-width:900px){
.apps-grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:600px){
.header{padding:12px 16px;}
.header-title{font-size:16px;}
.header-user-name{max-width:80px;}
.apps-hero{padding:50px 18px 40px;}
.apps-hero h1{font-size:28px;}
.apps-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="header-left">
      <img src="logo.png" class="header-logo" alt="Doroi Logo" onerror="this.style.display='none'">
      <div>
        <div class="header-title"><span>Doroi</span></div>
        <div class="header-sub">Software & Development</div>
      </div>
    </a>

    <div class="header-right">
      <a href="account.html" class="header-user" id="headerUser">
        <div class="header-user-avatar" id="headerUserAvatar">?</div>
        <span class="header-user-name" id="headerUserName">Account</span>
      </a>
      <a href="index.html" class="back-btn" aria-label="Back to home">
        <i class="fas fa-arrow-left"></i>
      </a>
    </div>
  </div>
</header>

<div class="gate-wrap" id="gateWrap">
  <i class="fas fa-spinner fa-spin gate-spinner"></i>
</div>

<section class="apps-hero" id="appsHero">
  <div class="apps-hero-inner">
    <div class="apps-hero-badge"><i class="fas fa-circle"></i> For Signed In Users</div>
    <h1><span>Our</span> Apps</h1>
    <p>A growing collection of apps built by Doroi. New releases and updates will appear here first.</p>
  </div>
</section>

<section class="apps-section" id="appsSection">
  <div class="apps-inner">
    <div class="apps-grid" id="appsGrid"></div>
  </div>
</section>

<script type="module" src="apps.js"></script>
</body>
</html>
