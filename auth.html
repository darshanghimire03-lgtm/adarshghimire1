<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<title>Sign In / Sign Up - Doroi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html, body{
height:100%;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a,#0b2f6b);
color:white;
position:relative;
overflow-x:hidden;
padding:24px;
}

body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#2563eb;
filter:blur(160px);
top:-120px;
left:-100px;
opacity:.4;
pointer-events:none;
z-index:0;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#3b82f6;
filter:blur(150px);
bottom:-140px;
right:-120px;
opacity:.35;
pointer-events:none;
z-index:0;
}

.back-home{
position:fixed;
top:22px;
left:22px;
display:inline-flex;
align-items:center;
gap:8px;
color:#cbd5e1;
text-decoration:none;
font-size:14px;
font-weight:500;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);
padding:9px 16px;
border-radius:50px;
transition:.25s;
z-index:5;
}

.back-home:hover{
background:rgba(255,255,255,.12);
color:white;
}

.auth-wrap{
position:relative;
z-index:2;
width:100%;
max-width:440px;
}

.auth-card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
padding:40px 34px;
}

.auth-logo{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:26px;
}

.auth-logo img{
width:38px;
height:38px;
border-radius:9px;
object-fit:cover;
}

.auth-logo-text{
font-size:20px;
font-weight:700;
}

.auth-logo-text span{
color:#3b82f6;
}

.auth-tabs{
display:flex;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:5px;
margin-bottom:28px;
}

.auth-tab{
flex:1;
text-align:center;
padding:11px 0;
border-radius:10px;
font-size:14px;
font-weight:600;
color:#94a3b8;
cursor:pointer;
transition:.25s;
background:none;
border:none;
font-family:inherit;
}

.auth-tab.active{
background:#2563eb;
color:white;
box-shadow:0 6px 16px rgba(37,99,235,.4);
}

.auth-form{
display:none;
flex-direction:column;
gap:16px;
}

.auth-form.active{
display:flex;
}

.form-group{
display:flex;
flex-direction:column;
gap:7px;
text-align:left;
}

.form-group label{
font-size:12.5px;
font-weight:600;
color:#cbd5e1;
letter-spacing:.3px;
}

.input-wrap{
position:relative;
display:flex;
align-items:center;
}

.input-wrap i{
position:absolute;
left:16px;
color:#64748b;
font-size:14px;
}

.input-wrap input{
width:100%;
padding:13px 16px 13px 42px;
border-radius:12px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.12);
color:white;
font-size:14.5px;
font-family:inherit;
outline:none;
transition:.25s;
}

.input-wrap input::placeholder{
color:#64748b;
}

.input-wrap input:focus{
border-color:#3b82f6;
background:rgba(255,255,255,.08);
box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

.toggle-pass{
position:absolute;
right:16px;
color:#64748b;
cursor:pointer;
font-size:14px;
background:none;
border:none;
padding:0;
}

.toggle-pass:hover{
color:#cbd5e1;
}

.submit-btn{
margin-top:6px;
padding:14px;
border-radius:12px;
background:#2563eb;
color:white;
border:none;
font-weight:600;
font-size:15px;
cursor:pointer;
font-family:inherit;
transition:.25s;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.submit-btn:hover{
background:#1d4ed8;
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(37,99,235,.4);
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.alert-box{
padding:12px 14px;
border-radius:12px;
font-size:13px;
font-weight:500;
line-height:1.5;
display:none;
align-items:flex-start;
gap:10px;
}

.alert-box.show{
display:flex;
}

.alert-box.error{
background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.3);
color:#fca5a5;
}

.alert-box.success{
background:rgba(34,197,94,.12);
border:1px solid rgba(34,197,94,.3);
color:#86efac;
}

.alert-box i{
margin-top:2px;
flex-shrink:0;
}

.switch-text{
text-align:center;
font-size:13.5px;
color:#94a3b8;
margin-top:22px;
}

.switch-text a{
color:#3b82f6;
font-weight:600;
text-decoration:none;
cursor:pointer;
}

.switch-text a:hover{
text-decoration:underline;
}

@media (max-width:480px){
.auth-card{padding:32px 24px;border-radius:20px;}
.auth-logo-text{font-size:18px;}
}
</style>
</head>

<body>

<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="logo.png" onerror="this.style.display='none'" alt="Doroi Logo">
      <div class="auth-logo-text"><span>Doroi</span> Account</div>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="loginTab">Sign In</button>
      <button type="button" class="auth-tab" id="signupTab">Sign Up</button>
    </div>

    <div class="alert-box" id="alertBox" style="margin-bottom:16px;">
      <i class="fas fa-circle-exclamation"></i>
      <span id="alertText"></span>
    </div>

    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
          <button type="button" class="toggle-pass" data-target="loginPassword"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="loginSubmitBtn">
        <i class="fas fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="signupName" placeholder="Your full name" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="toggle-pass" data-target="signupPassword"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="signupSubmitBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="switch-text" id="switchText">
      Don't have an account? <a id="goSignup">Sign up for free</a>
    </div>

  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
