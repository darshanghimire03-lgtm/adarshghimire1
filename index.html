<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile · @darshang404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #000; display: flex; justify-content: center; min-height: 100vh;
        }
        .app-container {
            width: 100%; max-width: 480px; background: #fff; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.03);
        }

        /* header social icons */
        .header-social {
            display: flex; justify-content: center; gap: 12px; padding: 14px 16px 10px;
            min-height: 68px; opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
        }
        .header-social.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .social-icon {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 20px; color: #fff; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; border: none;
            flex-shrink: 0; box-shadow: 0 6px 12px -5px rgba(0,0,0,0.25);
        }
        .social-icon:hover { transform: scale(1.12) translateY(-2px); box-shadow: 0 10px 18px -6px rgba(0,0,0,0.3); }
        .social-icon:active { transform: scale(0.95); }
        .social-icon.facebook { background: #1877f2; }
        .social-icon.tiktok { background: #000; }
        .social-icon.instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .social-icon.whatsapp { background: #25D366; }
        .social-icon.twitter { background: #000; }
        .social-icon.telegram { background: #0088cc; }

        /* profile info */
        .profile-info-section { padding: 8px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; }
        .profile-text { flex: 1; padding-top: 4px; }
        .profile-name { font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -0.4px; }
        .profile-username-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .profile-username { font-size: 15px; color: #000; }
        .verified-badge { color: #1d9bf0; font-size: 15px; }
        .profile-avatar-large {
            width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
            flex-shrink: 0; border: 1px solid #e1e8ed; background: #f0f0f0;
        }

        /* action buttons */
        .action-buttons { display: flex; gap: 10px; padding: 16px 16px 0; }
        .action-btn {
            flex: 1; padding: 12px 0; border-radius: 30px; font-size: 15px; font-weight: 600;
            text-align: center; cursor: pointer; font-family: 'Inter', sans-serif;
            transition: all 0.15s ease; border: 1.5px solid #dbdbdb; background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .action-btn.follow-btn-main { background: #0b1a2b; color: #fff; border-color: #0b1a2b; font-weight: 700; }
        .action-btn.follow-btn-main:active { background: #1e3349; }
        .action-btn.follow-btn-main.followed { background: #fff; color: #0b1a2b; border-color: #dbdbdb; }
        .action-btn.message { color: #000; border-color: #dbdbdb; }
        .action-btn:active { background-color: #f2f2f2; }

        /* tabs */
        .tabs-container {
            display: flex; justify-content: space-around; padding: 18px 8px 0;
            border-bottom: 1px solid #eaeaea; margin-top: 4px;
        }
        .tab-item {
            font-size: 15px; font-weight: 500; color: #687684; padding-bottom: 12px;
            cursor: pointer; position: relative; letter-spacing: -0.2px; background: none;
            border: none; font-family: 'Inter', sans-serif; flex: 1; transition: color 0.2s;
        }
        .tab-item:hover { color: #333; }
        .tab-item.active { color: #000; font-weight: 600; }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%;
            height: 2px; background: #000; border-radius: 1px;
        }
        .tab-panel { display: none; animation: fadeInPanel 0.25s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeInPanel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* post card */
        .post-card { padding: 14px 16px 20px; display: flex; flex-direction: column; border-bottom: 1px solid #f0f0f0; margin-top: 4px; }
        .post-header { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid #e1e8ed; background: #f0f0f0; }
        .post-user-info { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .post-username { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-verified { color: #1d9bf0; font-size: 14px; flex-shrink: 0; }
        .post-time { font-size: 15px; color: #687684; flex-shrink: 0; }
        .post-more { color: #687684; font-size: 18px; cursor: pointer; padding: 0 4px; background: none; border: none; }
        .post-caption { margin-top: 12px; font-size: 16px; line-height: 1.4; }
        .post-caption .emoji { font-size: 18px; }
        .post-media { margin-top: 12px; border-radius: 16px; overflow: hidden; background: #f0f0f0; width: 100%; aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center; }
        .post-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* apps/websites list */
        .list-container { padding: 8px 16px 20px; }
        .list-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 12px;
            border-radius: 16px; transition: background 0.15s; cursor: pointer;
            text-decoration: none; color: inherit; border-bottom: 1px solid #f5f5f5;
        }
        .list-item:hover { background: #f8fafc; }
        .list-icon {
            width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 22px; color: #fff; flex-shrink: 0;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.15);
        }
        .list-icon.app-color { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .list-icon.web-color { background: linear-gradient(135deg, #0ea5e9, #06b6d4); }
        .list-content { flex: 1; min-width: 0; }
        .list-title { font-size: 15px; font-weight: 600; color: #0b1a2b; margin-bottom: 2px; }
        .list-desc { font-size: 13px; color: #687684; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-arrow { color: #94a3b8; font-size: 14px; flex-shrink: 0; }

        /* toast */
        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #0b1a2b; color: #fff; padding: 12px 22px; border-radius: 30px;
            font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s; z-index: 2000;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.3); max-width: 85%; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast i { margin-right: 8px; color: #4ade80; }

        /* loading skeleton */
        .loading-skeleton { padding: 20px; text-align: center; color: #687684; font-size: 14px; }

        @media (max-width: 400px) {
            .profile-name { font-size: 21px; }
            .profile-avatar-large { width: 68px; height: 68px; }
            .action-btn { font-size: 14px; padding: 10px 0; }
            .tab-item { font-size: 14px; }
            .social-icon { width: 40px; height: 40px; font-size: 18px; }
        }
        @media (max-width: 360px) {
            .header-social { gap: 8px; }
            .social-icon { width: 36px; height: 36px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header social icons -->
    <div class="header-social" id="headerSocial"></div>

    <!-- Profile info -->
    <section class="profile-info-section">
        <div class="profile-text">
            <h1 class="profile-name" id="profileName">Loading…</h1>
            <div class="profile-username-row">
                <span class="profile-username" id="profileUsername">@…</span>
                <span class="verified-badge" id="verifiedBadge"><i class="fa-solid fa-circle-check"></i></span>
            </div>
        </div>
        <img class="profile-avatar-large" id="profileAvatar" src="profile.png" alt="Profile"
             onerror="this.src='https://ui-avatars.com/api/?name=User&size=120&background=0b1a2b&color=fff&bold=true'">
    </section>

    <!-- Action buttons -->
    <div class="action-buttons">
        <button class="action-btn follow-btn-main" id="followBtn">
            <i class="fas fa-user-plus"></i> Follow
        </button>
        <button class="action-btn message" id="messageBtn">
            <i class="fab fa-whatsapp"></i> Message
        </button>
    </div>

    <!-- Tabs -->
    <div class="tabs-container" id="tabsContainer">
        <button class="tab-item active" data-tab="posts">Posts</button>
        <button class="tab-item" data-tab="apps">Apps</button>
        <button class="tab-item" data-tab="websites">Websites</button>
    </div>

    <!-- Posts panel -->
    <div class="tab-panel active" id="panel-posts">
        <div id="postsContainer"></div>
    </div>

    <!-- Apps panel -->
    <div class="tab-panel" id="panel-apps">
        <div class="list-container" id="appsContainer"></div>
    </div>

    <!-- Websites panel -->
    <div class="tab-panel" id="panel-websites">
        <div class="list-container" id="websitesContainer"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i><span id="toastText">Done</span>
</div>

<script type="module">
    import { PROFILE_REF, onValue } from './firebase-config.js';

    // ---------- DOM ----------
    const headerSocial    = document.getElementById('headerSocial');
    const profileName     = document.getElementById('profileName');
    const profileUsername = document.getElementById('profileUsername');
    const profileAvatar   = document.getElementById('profileAvatar');
    const followBtn       = document.getElementById('followBtn');
    const messageBtn      = document.getElementById('messageBtn');
    const toast           = document.getElementById('toast');
    const toastText       = document.getElementById('toastText');
    const postsContainer  = document.getElementById('postsContainer');
    const appsContainer   = document.getElementById('appsContainer');
    const websitesContainer = document.getElementById('websitesContainer');

    let profileData = null;

    // ---------- Toast ----------
    let toastTimer = null;
    function showToast(msg, ok = true) {
        toastText.textContent = msg;
        const icon = toast.querySelector('i');
        icon.className = ok ? 'fas fa-check-circle' : 'fas fa-info-circle';
        icon.style.color = ok ? '#4ade80' : '#fbbf24';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ---------- Render profile ----------
    function renderProfile(data) {
        if (!data) return;
        profileData = data;

        profileName.textContent = data.name || 'Unnamed';
        profileUsername.textContent = '@' + (data.username || 'unknown');

        // Avatar — use data.avatar if set, otherwise profile.png
        if (data.avatar && data.avatar.trim() !== '') {
            profileAvatar.src = data.avatar;
        } else {
            profileAvatar.src = 'profile.png';
        }
        profileAvatar.onerror = function() {
            this.src = 'https://ui-avatars.com/api/?name=' + 
                encodeURIComponent(data.name || 'User') + 
                '&size=120&background=0b1a2b&color=fff&bold=true';
        };

        buildSocialIcons(data.links || {});
        renderPosts(data.posts || []);
        renderList(appsContainer, data.apps || [], 'app-color', 'fa-mobile-alt');
        renderList(websitesContainer, data.websites || [], 'web-color', 'fa-globe');
    }

    // ---------- Social icons ----------
    const PLATFORMS = [
        { key: 'facebook',  label: 'Facebook',   icon: 'fa-facebook-f' },
        { key: 'tiktok',    label: 'TikTok',     icon: 'fa-tiktok' },
        { key: 'instagram', label: 'Instagram',  icon: 'fa-instagram' },
        { key: 'whatsapp',  label: 'WhatsApp',   icon: 'fa-whatsapp' },
        { key: 'twitter',   label: 'Twitter (X)',icon: 'fa-x-twitter' },
        { key: 'telegram',  label: 'Telegram',   icon: 'fa-telegram' }
    ];

    function buildSocialIcons(links) {
        headerSocial.innerHTML = '';
        PLATFORMS.forEach(p => {
            const url = links[p.key];
            if (!url) return;
            const a = document.createElement('a');
            a.className = `social-icon ${p.key}`;
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.setAttribute('aria-label', p.label);
            a.innerHTML = `<i class="fab ${p.icon}"></i>`;
            a.addEventListener('click', (e) => {
                e.preventDefault();
                showToast(`Opening ${p.label}…`);
                setTimeout(() => window.open(url, '_blank', 'noopener,noreferrer'), 250);
            });
            headerSocial.appendChild(a);
        });
    }

    // ---------- Posts (supports arrays AND objects from Realtime DB) ----------
    function toArray(input) {
        if (!input) return [];
        if (Array.isArray(input)) return input;
        // Realtime DB converts arrays to objects with numeric keys
        return Object.keys(input).sort((a,b) => Number(a) - Number(b)).map(k => input[k]);
    }

    function renderPosts(posts) {
        const list = toArray(posts);
        if (!list.length) {
            postsContainer.innerHTML = '<div class="loading-skeleton">No posts yet.</div>';
            return;
        }
        postsContainer.innerHTML = list.map(post => `
            <article class="post-card">
                <div class="post-header">
                    <img class="post-avatar" src="${post.avatar || profileAvatar.src}" 
                         onerror="this.src='https://ui-avatars.com/api/?name=User&size=80&background=0b1a2b&color=fff&bold=true'">
                    <div class="post-user-info">
                        <span class="post-username">${escapeHTML(post.username || 'user')}</span>
                        <span class="post-verified"><i class="fa-solid fa-circle-check"></i></span>
                        <span class="post-time">${escapeHTML(post.time || 'now')}</span>
                    </div>
                    <button class="post-more"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
                ${post.caption ? `<div class="post-caption">${escapeHTML(post.caption)}</div>` : ''}
                ${post.image ? `
                    <div class="post-media">
                        <img src="${post.image}" alt="Post image"
                             onerror="this.parentElement.innerHTML='<div style=\\'padding:20px;color:#5a6b7a;\\'>📸 Image preview</div>'">
                    </div>
                ` : ''}
            </article>
        `).join('');
    }

    // ---------- Apps / Websites list ----------
    function renderList(container, items, colorClass, fallbackIcon) {
        const list = toArray(items);
        if (!list.length) {
            container.innerHTML = '<div class="loading-skeleton">Nothing here yet.</div>';
            return;
        }
        container.innerHTML = list.map(item => `
            <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="list-item">
                <div class="list-icon ${colorClass}">
                    <i class="fas ${item.icon || fallbackIcon}"></i>
                </div>
                <div class="list-content">
                    <div class="list-title">${escapeHTML(item.title || 'Untitled')}</div>
                    <div class="list-desc">${escapeHTML(item.description || '')}</div>
                </div>
                <div class="list-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>
        `).join('');
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[m]));
    }

    // ---------- Follow button ----------
    let isFollowing = false;
    followBtn.addEventListener('click', () => {
        if (!isFollowing) {
            isFollowing = true;
            followBtn.classList.add('followed');
            followBtn.innerHTML = '<i class="fas fa-check"></i> Following';
            headerSocial.classList.add('visible');
            showToast('Followed! Choose a platform.');
        } else {
            isFollowing = false;
            followBtn.classList.remove('followed');
            followBtn.innerHTML = '<i class="fas fa-user-plus"></i> Follow';
            headerSocial.classList.remove('visible');
            showToast('Unfollowed.', false);
        }
    });

    // ---------- Message button (WhatsApp) ----------
    messageBtn.addEventListener('click', () => {
        const wa = profileData?.links?.whatsapp;
        if (wa) {
            showToast('Opening WhatsApp…');
            setTimeout(() => window.open(wa, '_blank', 'noopener,noreferrer'), 250);
        } else {
            showToast('WhatsApp not set.', false);
        }
    });

    // ---------- Tabs ----------
    document.querySelectorAll('.tab-item').forEach(btn => {
        btn.addEventListener('click', function() {
            const tab = this.dataset.tab;
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('panel-' + tab)?.classList.add('active');
        });
    });

    // ---------- Realtime Database listener ----------
    onValue(PROFILE_REF, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            renderProfile(data);
            console.log('✅ Profile loaded from Realtime DB:', data);
        } else {
            profileName.textContent = 'Profile not set';
            profileUsername.textContent = '—';
            showToast('Open admin.html to set up the profile.', false);
        }
    }, (err) => {
        console.error('Realtime DB error:', err);
        showToast('Failed to load profile.', false);
    });
</script>

</body>
</html>
