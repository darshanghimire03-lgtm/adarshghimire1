<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<title>Doroi - Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html, body{
height:100%;
}

body{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a,#0b2f6b);
color:white;
position:relative;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:350px;
height:350px;
background:#2563eb;
filter:blur(150px);
top:-100px;
left:-100px;
opacity:.35;
pointer-events:none;
z-index:0;
}

body::after{
content:"";
position:fixed;
width:350px;
height:350px;
background:#3b82f6;
filter:blur(140px);
bottom:-120px;
right:-120px;
opacity:.35;
pointer-events:none;
z-index:0;
}

/* ===== HEADER ===== */
.header{
width:100%;
position:sticky;
top:0;
left:0;
z-index:50;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 20px;
background:rgba(2,6,23,.55);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.header-left{
display:flex;
align-items:center;
gap:10px;
}

.header-logo{
width:36px;
height:36px;
border-radius:8px;
object-fit:cover;
}

.header-title{
font-size:18px;
font-weight:700;
letter-spacing:.5px;
}

.header-title span{
color:#3b82f6;
}

.menu-btn{
width:44px;
height:44px;
border-radius:50%;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:19px;
color:white;
transition:.25s;
}

.menu-btn:hover{
background:#2563eb;
}

/* ===== DRAWER ===== */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
backdrop-filter:blur(2px);
opacity:0;
visibility:hidden;
transition:.3s ease;
z-index:90;
}

.overlay.active{
opacity:1;
visibility:visible;
}

.drawer{
position:fixed;
top:0;
right:0;
height:100%;
width:300px;
max-width:85vw;
background:linear-gradient(160deg,#0b1220,#0f172a 60%,#0b2f6b);
border-left:1px solid rgba(255,255,255,.1);
box-shadow:-10px 0 40px rgba(0,0,0,.5);
transform:translateX(100%);
transition:transform .35s cubic-bezier(.22,1,.36,1);
z-index:100;
display:flex;
flex-direction:column;
padding:24px 22px;
}

.drawer.active{
transform:translateX(0);
}

.drawer-close{
align-self:flex-end;
width:38px;
height:38px;
border-radius:50%;
background:rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:18px;
margin-bottom:20px;
transition:.25s;
}

.drawer-close:hover{
background:#ef4444;
}

.profile-box{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
padding:10px 0 25px;
border-bottom:1px solid rgba(255,255,255,.1);
margin-bottom:25px;
}

.profile-photo{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid #2563eb;
box-shadow:0 8px 25px rgba(37,99,235,.5);
margin-bottom:14px;
background:#1e293b;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:700;
color:#3b82f6;
}

.profile-name{
font-size:19px;
font-weight:700;
margin-bottom:4px;
}

.profile-role{
font-size:13px;
color:#93c5fd;
font-weight:600;
margin-bottom:2px;
}

.profile-sub{
font-size:12px;
color:#94a3b8;
}

.drawer-links{
display:flex;
flex-direction:column;
gap:6px;
}

.drawer-links a{
display:flex;
align-items:center;
gap:12px;
padding:12px 14px;
border-radius:12px;
color:#e2e8f0;
text-decoration:none;
font-size:14px;
font-weight:500;
transition:.25s;
}

.drawer-links a i{
width:20px;
text-align:center;
color:#3b82f6;
}

.drawer-links a:hover{
background:rgba(255,255,255,.08);
}

.drawer-footer{
margin-top:auto;
font-size:11px;
color:#64748b;
text-align:center;
padding-top:20px;
}

/* ===== MAIN CONTENT ===== */
.main{
flex:1;
width:100%;
display:flex;
justify-content:center;
align-items:center;
position:relative;
z-index:2;
padding:30px 16px;
}

.container{
position:relative;
z-index:2;
width:100%;
max-width:500px;
text-align:center;
padding:40px 30px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
width:130px;
max-width:40vw;
margin-bottom:20px;
}

h1{
font-size:42px;
font-weight:700;
margin-bottom:8px;
}

h1 span{
color:#3b82f6;
}

p{
font-size:17px;
color:#cbd5e1;
line-height:1.7;
margin-bottom:30px;
}

.coming{
display:inline-block;
padding:12px 28px;
border-radius:50px;
background:#2563eb;
font-weight:600;
letter-spacing:1px;
box-shadow:0 10px 30px rgba(37,99,235,.4);
margin-bottom:35px;
}

.socials{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.socials a{
width:55px;
height:55px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(255,255,255,.08);
color:white;
font-size:22px;
transition:.3s;
text-decoration:none;
}

.socials a:hover{
background:#2563eb;
transform:translateY(-6px);
box-shadow:0 10px 25px rgba(37,99,235,.5);
}

.footer{
margin-top:30px;
font-size:13px;
color:#94a3b8;
}

/* ===== RESPONSIVE ===== */
@media (max-width:600px){
.header{padding:12px 16px;}
.header-title{font-size:16px;}
.container{padding:32px 20px;border-radius:20px;}
h1{font-size:32px;}
p{font-size:15px;}
.socials a{width:48px;height:48px;font-size:19px;}
}

@media (max-width:380px){
h1{font-size:26px;}
.logo{width:100px;}
.coming{padding:10px 20px;font-size:14px;}
.socials{gap:14px;}
.socials a{width:44px;height:44px;font-size:17px;}
}

@media (min-width:1200px){
.container{max-width:560px;padding:50px 40px;}
h1{font-size:48px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <img src="logo.png" class="header-logo" alt="Doroi Logo" onerror="this.style.display='none'">
    <div class="header-title"><span>Doroi</span></div>
  </div>
  <div class="menu-btn" id="menuBtn" aria-label="Open menu">
    <i class="fas fa-bars"></i>
  </div>
</header>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- DRAWER -->
<aside class="drawer" id="drawer">
  <div class="drawer-close" id="closeBtn"><i class="fas fa-times"></i></div>

  <div class="profile-box">
    <div class="profile-photo" id="profilePhotoWrap">DG</div>
    <div class="profile-name">Darshan Ghimire</div>
    <div class="profile-role">Founder of Doroi</div>
    <div class="profile-sub">Android App Developer</div>
  </div>

  <nav class="drawer-links">
    <a href="https://www.facebook.com/share/1JPTPDnqpo/" target="_blank"><i class="fab fa-facebook-f"></i> Facebook</a>
    <a href="https://www.tiktok.com/@doroi.ltd" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    <a href="https://wa.me/9779806393423" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  </nav>

  <div class="drawer-footer">© 2026 Doroi Software & Development</div>
</aside>

<!-- MAIN -->
<main class="main">
<div class="container">

<img src="logo.png" class="logo" alt="Doroi Logo" onerror="this.style.display='none'">

<h1><span>Doroi</span></h1>

<p>
We are building something amazing.<br>
Our website will launch soon.
</p>

<div class="coming">
🚀 COMING SOON
</div>

<div class="socials">

<a href="https://www.facebook.com/share/1JPTPDnqpo/" target="_blank">
<i class="fab fa-facebook-f"></i>
</a>

<a href="https://www.tiktok.com/@doroi.ltd" target="_blank">
<i class="fab fa-tiktok"></i>
</a>

<a href="https://wa.me/9779806393423" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

</div>

<div class="footer">
© 2026 Doroi Software & Development. All Rights Reserved.
</div>

</div>
</main>

<script>
const menuBtn = document.getElementById('menuBtn');
const closeBtn = document.getElementById('closeBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');

function openDrawer(){
  drawer.classList.add('active');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDrawer(){
  drawer.classList.remove('active');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

menuBtn.addEventListener('click', openDrawer);
closeBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
</script>

</body>
</html>
