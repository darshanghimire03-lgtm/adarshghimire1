<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPLcode</title>
<meta name="google-site-verification" content="JZtyb078dbEx1xQOkxxzVD-k_gqM2mh-_Dn59hmJMJM" />
<meta name="theme-color" content="#0C0F0D">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/hero.css">
<link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div data-include="header" data-max="1100px"></div>

<main>
  <div data-include="hero"></div>

  <nav class="filters" id="filters" aria-label="Filter matches">
    <button class="chip active" type="button" data-filter="all">All <small id="c-all">0</small></button>
    <button class="chip" type="button" data-filter="live">Live <small id="c-live">0</small></button>
    <button class="chip" type="button" data-filter="today">Today <small id="c-today">0</small></button>
    <button class="chip" type="button" data-filter="upcoming">Upcoming <small id="c-upcoming">0</small></button>
  </nav>

  <div id="homeMain">
    <div class="skeleton-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</main>

<div data-include="footer"></div>
<div class="toast" id="toast"></div>
<div data-include="auth-sheet"></div>

<script type="module" src="/js/index.js"></script>
</body>
</html>
