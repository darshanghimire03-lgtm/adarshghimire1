<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png">
<title>Doroi- Software's </title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 380px;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #faeeda;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    color: #5f5e5a;
    line-height: 1.6;
    margin: 0 0 24px;
    font-size: 15px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #e2e0d8;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    color: #5f5e5a;
    margin-bottom: 24px;
  }
  button {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover {
    background: #333;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>We'll be right back</h1>
    <p>This site is currently down for scheduled maintenance. We're working to improve things and expect to be back online shortly.</p>
    <div class="badge">⏱ Expected back: shortly</div>
    <div>
      <button onclick="window.location.reload()">Check again</button>
    </div>
  </div>
</body>
</html>
