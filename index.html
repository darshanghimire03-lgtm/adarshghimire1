<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPLcode</title>
<meta name="google-site-verification" content="JZtyb078dbEx1xQOkxxzVD-k_gqM2mh-_Dn59hmJMJM" />
<meta name="theme-color" content="#0C0F0D">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/hero.css">
<style>
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  background-image:
    radial-gradient(800px 380px at 50% -120px, rgba(163, 230, 53, 0.16), transparent),
    radial-gradient(500px 300px at 100% 40%, rgba(163, 230, 53, 0.05), transparent);
  background-repeat: no-repeat;
}
.ic { width: 16px; height: 16px; }
.live-pill {
  display: none;
  align-items: center;
  gap: 7px;
  background: var(--primary-soft);
  border: 1px solid rgba(163, 230, 53, 0.35);
  color: var(--primary);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  padding: 7px 12px;
  border-radius: 999px;
}
.live-pill.on { display: inline-flex; }
main {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 clamp(14px, 4vw, 28px) 40px;
}
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  margin-bottom: 6px;
  scrollbar-width: none;
  justify-content: center;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.2s ease, color 0.2s ease;
}
.chip:active { transform: scale(0.95); }
.chip:hover { border-color: rgba(163, 230, 53, 0.45); color: var(--text); }
.chip.active { background: var(--primary); color: #0C0F0D; border-color: var(--primary); }
.chip small {
  font-size: 0.7rem;
  font-weight: 800;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  padding: 1px 7px;
}
.chip.active small { background: rgba(12, 15, 13, 0.18); }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 18px 0 14px;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.section-title::before {
  content: "";
  width: 4px;
  height: 16px;
  border-radius: 4px;
  background: var(--primary);
}
.count {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 999px;
}
.list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.match {
  display: block;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 16px 16px 14px;
  color: var(--text);
  text-decoration: none;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.match::after {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(163, 230, 53, 0.12), transparent 70%);
  pointer-events: none;
}
.match:hover { transform: translateY(-3px); border-color: rgba(163, 230, 53, 0.4); }
.match:active { transform: scale(0.98); }
.match.live {
  border-color: rgba(163, 230, 53, 0.65);
  box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.15), 0 10px 40px -12px rgba(163, 230, 53, 0.4);
}
.match.ended { opacity: 0.55; }
.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 18px;
}
.time-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
}
.time-chip .ic { color: var(--primary); }
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.team-logo {
  width: 68px;
  height: 68px;
  border-radius: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: 1.5rem;
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name {
  font-size: 0.92rem;
  font-weight: 800;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.team.winner .team-logo { border-color: var(--primary); box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.25); }
.win-tag {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #0C0F0D;
  background: var(--primary);
  padding: 3px 8px;
  border-radius: 999px;
}
.vs {
  font-weight: 800;
  font-size: 0.75rem;
  color: var(--muted);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.foot {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--muted);
}
.foot-left { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.share-mini {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease;
}
.share-mini:hover, .share-mini:active { border-color: var(--primary); color: var(--primary); }
.go {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid rgba(163, 230, 53, 0.35);
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 800;
  white-space: nowrap;
}
.match.live .go { background: var(--primary); color: #0C0F0D; border-color: var(--primary); }
.badge {
  font-size: 0.68rem;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 999px;
  letter-spacing: 0.07em;
  white-space: nowrap;
}
.badge.live { background: var(--primary); color: #0C0F0D; animation: pulse 1.4s ease-in-out infinite; }
.badge.notstarted { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.badge.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.tomorrow { background: var(--primary-soft); color: var(--primary); border: 1px solid rgba(163, 230, 53, 0.35); }
.badge.days { background: var(--bg); color: var(--primary); border: 1px solid var(--line); }
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  padding: 30px 16px;
  margin-bottom: 28px;
  border: 1px dashed var(--line);
  border-radius: 22px;
}
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 16px;
}
.skeleton {
  height: 200px;
  border-radius: 26px;
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.3s linear infinite;
}
@media (max-width: 480px) {
  .filters { justify-content: flex-start; }
  .team-logo { width: 60px; height: 60px; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .badge.live, .skeleton { animation: none; }
  .match, .chip { transition: none; }
  .match:hover { transform: none; }
}
</style>
</head>
<body>
<div data-include="header" data-max="1100px"></div>

<main>
  <div data-include="hero"></div>

  <nav class="filters" id="filters" aria-label="Filter matches">
    <button class="chip active" type="button" data-filter="all">All <small id="c-all">0</small></button>
    <button class="chip" type="button" data-filter="live">Live <small id="c-live">0</small></button>
    <button class="chip" type="button" data-filter="today">Today <small id="c-today">0</small></button>
    <button class="chip" type="button" data-filter="upcoming">Upcoming <small id="c-upcoming">0</small></button>
  </nav>

  <div id="homeMain">
    <div class="skeleton-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</main>

<div data-include="footer"></div>
<div class="toast" id="toast"></div>
<div data-include="auth-sheet"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { mountLayout, loadPartial, fillTemplate } from "/js/layout.js";
import { initAuth } from "/js/auth.js";

const [, cardTpl] = await Promise.all([mountLayout(), loadPartial("battlecard")]);
initAuth();

document.getElementById("headerExtra").innerHTML = '<div class="live-pill" id="livePill"><span class="dot"></span><span id="liveCount">LIVE</span></div>';

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const homeMain = document.getElementById("homeMain");
const livePill = document.getElementById("livePill");
const liveCount = document.getElementById("liveCount");
const toastEl = document.getElementById("toast");
const filtersEl = document.getElementById("filters");

const ICON = {
  share: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  arrow: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

let teamsData = {};
let matchesData = {};
let matchesLoaded = false;
let failed = false;
let filter = "all";
let lastSignature = "";
let toastTimer = null;

if (location.pathname.endsWith("/index.html") || location.pathname.endsWith("/index")) {
  history.replaceState(null, "", "/" + location.search + location.hash);
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err2) {
      ok = false;
    }
    ta.remove();
    return ok;
  }
}

function teamName(id) {
  const t = teamsData[id];
  return t && t.name ? t.name : "TBD";
}

async function shareMatch(id) {
  const m = matchesData[id];
  if (!m) return;
  const url = location.origin + "/match/" + encodeURIComponent(id);
  const title = teamName(m.team1) + " vs " + teamName(m.team2);
  const text = title + " - Watch live on NPLcode";
  if (navigator.share) {
    try {
      await navigator.share({ title, text, url });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const ok = await copyText(url);
  showToast(ok ? "Match link copied" : url);
}

homeMain.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-share]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  shareMatch(btn.getAttribute("data-share"));
});

homeMain.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const btn = e.target.closest("[data-share]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  shareMatch(btn.getAttribute("data-share"));
});

filtersEl.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-filter]");
  if (!chip) return;
  filter = chip.getAttribute("data-filter");
  filtersEl.querySelectorAll(".chip").forEach((c) => {
    c.classList.toggle("active", c.getAttribute("data-filter") === filter);
  });
  renderHome();
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function dayNumber(ms) {
  const d = new Date(ms);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatDate(ms) {
  return new Date(ms).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}

function duration(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? h + "h " + m + "m" : h + "h";
}

function getInfo(m, now) {
  const start = m.startTime;
  const dayDiff = dayNumber(start) - dayNumber(now);
  let state;
  if (now < start) state = "notstarted";
  else if (m.ended !== true && now < start + LIVE_MS) state = "live";
  else state = "ended";

  let visible = true;
  let group = "today";
  if (dayDiff > 0) group = "upcoming";
  if (dayDiff < 0) {
    if (state === "live") group = "today";
    else visible = false;
  }
  return { state, dayDiff, visible, group };
}

function winnerOf(m) {
  return m.winner && (m.winner === m.team1 || m.winner === m.team2) ? m.winner : null;
}

function whenText(m, info, now) {
  if (info.state === "live") return "Started " + duration(now - m.startTime) + " ago";
  if (info.state === "ended") {
    const w = winnerOf(m);
    return w ? "Winner: " + teamName(w) : "Match ended";
  }
  if (info.group === "today") return "Starts in " + duration(m.startTime - now);
  return formatDate(m.startTime);
}

function teamHtml(id, isWinner) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  const tag = isWinner ? '<div class="win-tag">WINNER</div>' : "";
  return `<div class="team ${isWinner ? "winner" : ""}"><div class="team-logo">${logo}</div><div class="team-name">${name}</div>${tag}</div>`;
}

function tagHtml(info) {
  if (info.group === "today") {
    if (info.state === "live") return '<span class="badge live">LIVE NOW</span>';
    if (info.state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
    return '<span class="badge notstarted">NOT STARTED</span>';
  }
  if (info.dayDiff === 1) return '<span class="badge tomorrow">TOMORROW</span>';
  return `<span class="badge days">${info.dayDiff} DAYS LEFT</span>`;
}

function cardHtml(id, m, info, now) {
  const classes = ["match"];
  if (info.state === "live") classes.push("live");
  if (info.group === "today" && info.state === "ended") classes.push("ended");
  const goText = info.state === "live" ? ICON.play + "Watch now" : "Details" + ICON.arrow;
  const w = info.state === "ended" ? winnerOf(m) : null;
  const timeLabel = info.group === "upcoming" ? formatDate(m.startTime) + " · " + formatTime(m.startTime) : formatTime(m.startTime);
  return fillTemplate(cardTpl, {
    classes: classes.join(" "),
    hrefId: encodeURIComponent(id),
    idAttr: esc(id),
    clock: ICON.clock,
    time: esc(timeLabel),
    tag: tagHtml(info),
    team1: teamHtml(m.team1, w === m.team1),
    team2: teamHtml(m.team2, w === m.team2),
    when: esc(whenText(m, info, now)),
    share: ICON.share,
    go: goText
  });
}

function todayOrder(info) {
  if (info.state === "live") return 0;
  if (info.state === "notstarted") return 1;
  return 2;
}

function sectionHtml(title, items, emptyText, now) {
  const head = `<div class="section-head"><div class="section-title">${title}</div><div class="count">${items.length}</div></div>`;
  const body = items.length
    ? `<div class="list">${items.map((x) => cardHtml(x.id, x.m, x.info, now)).join("")}</div>`
    : `<div class="empty">${emptyText}</div>`;
  return head + body;
}

function setCount(id, n) {
  const el = document.getElementById(id);
  if (el) el.textContent = n;
}

function renderHome() {
  if (failed) {
    homeMain.innerHTML = '<div class="empty">Could not load matches. Please check your connection and try again.</div>';
    return;
  }
  if (!matchesLoaded) return;

  const now = Date.now();
  const items = Object.entries(matchesData)
    .filter(([, m]) => m && typeof m.startTime === "number")
    .map(([id, m]) => ({ id, m, info: getInfo(m, now) }))
    .filter((x) => x.info.visible);

  const today = items
    .filter((x) => x.info.group === "today")
    .sort((a, b) => todayOrder(a.info) - todayOrder(b.info) || a.m.startTime - b.m.startTime);
  const upcoming = items
    .filter((x) => x.info.group === "upcoming")
    .sort((a, b) => a.m.startTime - b.m.startTime);
  const live = items
    .filter((x) => x.info.state === "live")
    .sort((a, b) => a.m.startTime - b.m.startTime);

  livePill.classList.toggle("on", live.length > 0);
  liveCount.textContent = live.length + " LIVE";

  setCount("c-all", items.length);
  setCount("c-live", live.length);
  setCount("c-today", today.length);
  setCount("c-upcoming", upcoming.length);

  if (filter === "live") {
    homeMain.innerHTML = sectionHtml("Live now", live, "No live matches right now", now);
  } else if (filter === "today") {
    homeMain.innerHTML = sectionHtml("Today's matches", today, "No matches today", now);
  } else if (filter === "upcoming") {
    homeMain.innerHTML = sectionHtml("Upcoming matches", upcoming, "No upcoming matches", now);
  } else {
    homeMain.innerHTML =
      sectionHtml("Today's matches", today, "No matches today", now) +
      sectionHtml("Upcoming matches", upcoming, "No upcoming matches", now);
  }
}

function onError() {
  failed = true;
  renderHome();
}

onValue(ref(db, "teams"), (snap) => {
  teamsData = snap.val() || {};
  renderHome();
}, onError);

onValue(ref(db, "matches"), (snap) => {
  matchesData = snap.val() || {};
  matchesLoaded = true;
  failed = false;
  renderHome();
}, onError);

setInterval(() => {
  if (!matchesLoaded) return;
  const now = Date.now();
  const sig = dayNumber(now) + "#" + Object.entries(matchesData)
    .filter(([, m]) => m && typeof m.startTime === "number")
    .map(([id, m]) => {
      const i = getInfo(m, now);
      return id + i.state + i.dayDiff + (i.visible ? "v" : "h") + whenText(m, i, now);
    })
    .join("|");
  if (sig !== lastSignature) {
    lastSignature = sig;
    renderHome();
  }
}, 1000);
</script>
</body>
</html>
