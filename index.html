<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Durbar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --card: #eaf1fd; --navy: #0c1f4a; --blue: #1f4aa8; --muted: #6b7a99; --line: #cfd9ec; --like: #e53935; --tint: #e6eefc; --tint-line: #d3dff5; --subject-card: #f3f7ff; --subject-icon: #e8f0fd; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #111827; max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.active { display: block; }
  .top-bar { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 16px 14px 16px; min-height: 86px; }
  .top-bar .normal-row { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .top-bar .search-row { display: none; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .top-bar.searching .normal-row { display: none; }
  .top-bar.searching .search-row { display: flex; }
  .profile-link { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-decoration: none; color: inherit; }
  .me-avatar { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--tint-line); background: #fff; object-fit: cover; flex-shrink: 0; }
  .greeting { flex: 1; min-width: 0; font-size: 1.55rem; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { border: none; background: transparent; color: var(--navy); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 16px; flex-shrink: 0; }
  .icon-btn.tinted { width: 54px; height: 54px; background: var(--tint); border: 1.5px solid var(--tint-line); }
  .icon-btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .search-input-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; background: var(--tint); border: 1.5px solid var(--tint-line); border-radius: 999px; }
  .search-input-wrap svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; flex-shrink: 0; }
  .search-input-wrap input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 1.05rem; color: var(--navy); }
  .search-input-wrap input::placeholder { color: var(--muted); }
  .feed { padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; }
  .post { background: var(--card); border-radius: 28px; padding: 18px 18px 14px 18px; }
  .post-head { display: flex; align-items: center; gap: 12px; }
  .linked { cursor: pointer; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: #c9d6f0; color: var(--navy); font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who { flex: 1; min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 6px; }
  .name { font-size: 1.12rem; font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { width: 20px; height: 20px; flex-shrink: 0; fill: #1d9bf0; }
  .badge.grey { fill: #7b8190; }
  .meta { font-size: 0.9rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .role { color: var(--blue); font-weight: 500; }
  .menu-btn { border: none; background: transparent; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #1c2333; cursor: pointer; flex-shrink: 0; }
  .menu-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .post-text { margin-top: 18px; font-size: 1.1rem; line-height: 1.55; color: #1a1f2b; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .post-text.clamped { max-height: calc(1.55em * 11); overflow: hidden; }
  .post-text a { color: var(--blue); }
  .see-more { display: none; border: none; background: transparent; color: var(--blue); font-family: inherit; font-size: 1.05rem; font-weight: 700; padding: 8px 0 0 0; cursor: pointer; }
  .see-more.visible { display: block; }
  .post-image { display: block; width: 100%; max-height: 420px; object-fit: cover; border-radius: 18px; margin-top: 14px; background: #d9e3f6; }
  .divider { height: 1.5px; background: var(--line); margin: 16px 0 6px 0; }
  .actions { display: flex; align-items: center; gap: 6px; }
  .action { border: none; background: transparent; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-family: inherit; font-size: 1.05rem; font-weight: 700; color: #1c2333; }
  .action svg { width: 30px; height: 30px; stroke: #1c2333; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .action.like { cursor: default; }
  .action.like svg { stroke: #8a94a8; }
  .action.like.on svg { fill: var(--like); stroke: var(--like); }
  .state { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 0.98rem; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .retry-btn { border: none; background: var(--tint); color: var(--blue); font-family: inherit; font-weight: 700; font-size: 0.98rem; padding: 10px 22px; border-radius: 999px; cursor: pointer; }
  .skeleton { height: 220px; border-radius: 28px; background: linear-gradient(100deg, #eaf1fd 30%, #f4f8ff 50%, #eaf1fd 70%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .page-head { padding: calc(36px + env(safe-area-inset-top)) 20px 18px 20px; }
  .page-title { font-size: 2rem; font-weight: 700; color: var(--navy); letter-spacing: -0.02em; line-height: 1.1; }
  .page-sub { margin-top: 6px; font-size: 1rem; color: #98a2b8; }
  .subject-list { list-style: none; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .subject-card { display: flex; align-items: center; gap: 16px; background: var(--subject-card); border-radius: 30px; padding: 16px; text-decoration: none; color: inherit; transition: transform 0.15s ease, background 0.15s ease; }
  .subject-card:active { transform: scale(0.985); background: #eaf1fd; }
  .subject-icon { width: 52px; height: 52px; border-radius: 16px; background: var(--subject-icon); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .subject-icon svg { width: 26px; height: 26px; stroke: #1a2a7a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .subject-info { flex: 1; min-width: 0; }
  .subject-name { font-size: 1.1rem; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subject-count { margin-top: 3px; font-size: 0.95rem; color: #8a96b0; }
  .subject-chevron { width: 20px; height: 20px; margin-right: 4px; stroke: #6b7a99; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .bottom-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; z-index: 30; background: #fdfdff; box-shadow: 0 -1px 0 rgba(12, 31, 74, 0.06), 0 -6px 18px rgba(12, 31, 74, 0.05); display: flex; justify-content: space-around; padding: 10px 4px calc(10px + env(safe-area-inset-bottom)) 4px; }
  .nav-item { flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; font-size: 0.95rem; font-weight: 500; color: #8a94a8; cursor: pointer; padding: 6px 0; text-decoration: none; }
  .nav-item svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active { color: var(--blue); font-weight: 700; }
  .nav-item.active svg.fill-on-active { fill: currentColor; }
  html.shorts-mode, html.shorts-mode body { overflow: hidden; height: 100%; background: #000; }
  #view-shorts.active { display: block; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; bottom: var(--nav-h, 80px); background: #000; z-index: 10; }
  .shorts-feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .shorts-feed::-webkit-scrollbar { display: none; }
  .shorts-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; color: rgba(255, 255, 255, 0.6); font-size: 0.98rem; }
  .shorts-spinner { width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #4a8ab5; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .short-item { position: relative; height: 100%; overflow: hidden; background: #000; color: #fff; scroll-snap-align: start; scroll-snap-stop: always; }
  .short-video, .short-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .short-placeholder { display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #1a1a2e, #16213e); color: rgba(255, 255, 255, 0.12); }
  .short-placeholder svg { width: 64px; height: 64px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .short-progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255, 255, 255, 0.15); z-index: 20; }
  .short-progress .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1e4b7a, #4a8ab5); border-radius: 0 2px 2px 0; }
  .short-number { position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 16px; z-index: 15; display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 16px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.08); font-size: 12px; color: rgba(255, 255, 255, 0.8); }
  .short-number svg { width: 12px; height: 12px; fill: #f59e0b; }
  .short-overlay { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; padding: 40px 20px 30px 20px; background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%); pointer-events: none; }
  .short-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
  .short-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 13px; color: rgba(255, 255, 255, 0.7); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
  .short-meta .subject-tag { padding: 2px 10px; border-radius: 12px; background: rgba(46, 115, 242, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); color: #8ab4f8; font-size: 11px; font-weight: 600; }
  .short-views { display: flex; align-items: center; gap: 4px; }
  .short-views svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .short-actions { position: absolute; right: 16px; bottom: 120px; z-index: 15; display: flex; flex-direction: column; gap: 18px; }
  .short-actions .action-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: none; color: rgba(255, 255, 255, 0.85); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 500; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
  .short-actions .action-btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bottom-sheet-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.6); }
  .bottom-sheet-overlay.active { display: flex; }
  .bottom-sheet { width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)) 20px; border-radius: 20px 20px 0 0; background: #1a1a2e; color: #fff; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 40px; height: 4px; margin: 0 auto 16px auto; border-radius: 2px; background: rgba(255, 255, 255, 0.2); }
  .sheet-title { margin-bottom: 6px; text-align: center; font-size: 1.1rem; font-weight: 700; }
  .sheet-subtitle { margin-bottom: 18px; text-align: center; font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .share-options { display: flex; flex-direction: column; gap: 8px; }
  .share-option { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: none; border-radius: 14px; background: rgba(255, 255, 255, 0.05); color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 500; text-align: left; cursor: pointer; }
  .share-option:active { background: rgba(255, 255, 255, 0.1); }
  .option-icon { width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
  .option-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .option-icon.copy { background: rgba(46, 115, 242, 0.2); color: #4a8ab5; }
  .option-icon.download { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
  .option-icon.whatsapp { background: rgba(37, 211, 102, 0.2); color: #25d366; }
  .option-icon.native { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
  .option-label { flex: 1; display: block; }
  .option-desc { display: block; margin-top: 2px; font-size: 0.75rem; font-weight: 400; color: rgba(255, 255, 255, 0.4); }
  .sheet-close-btn { width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 14px; background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.7); font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h, 80px) + 24px); transform: translateX(-50%); z-index: 200; display: none; max-width: 90%; padding: 12px 24px; border-radius: 12px; background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.05); color: #fff; font-size: 0.9rem; text-align: center; }
  .toast.show { display: block; }
  @media (min-width: 521px) { body { box-shadow: 0 0 0 1px #eef2fa; } }
</style>
</head>
<body>

<section class="view active" id="view-home">
  <header class="top-bar" id="topBar">
    <div class="normal-row">
      <a class="profile-link" href="profile/index.html" aria-label="Open profile">
        <img class="me-avatar" id="meAvatar" src="favicon.png" alt="Profile">
        <div class="greeting" id="greeting">Hi!</div>
      </a>
      <button class="icon-btn tinted" type="button" aria-label="Create post">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" type="button" id="searchOpen" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </button>
    </div>
    <div class="search-row">
      <label class="search-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input type="search" id="searchInput" placeholder="Search posts" autocomplete="off">
      </label>
      <button class="icon-btn" type="button" id="searchClose" aria-label="Close search">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <main class="feed" id="feed">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>
</section>

<section class="view" id="view-subject">
  <div class="page-head">
    <h1 class="page-title">Subjects</h1>
    <p class="page-sub">All subjects</p>
  </div>
  <ul class="subject-list" id="subjectList"></ul>
</section>

<section class="view" id="view-shorts">
  <div class="shorts-feed" id="shortsFeed">
    <div class="shorts-state">
      <div class="shorts-spinner"></div>
      <span>Loading shorts…</span>
    </div>
  </div>
</section>

<nav class="bottom-nav">
  <button class="nav-item active" type="button" data-view="home">
    <svg class="fill-on-active" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5V11z"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" type="button" data-view="shorts">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3.5"/><path d="M10 9.2v5.6l4.6-2.8L10 9.2z"/><path d="M8 4l2 3.2M13 4l2 3.2"/></svg>
    <span>Shorts</span>
  </button>
  <button class="nav-item" type="button" data-view="subject">
    <svg class="fill-on-active" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M5 16.5h14M9 20.5v-1.5M15 20.5v-1.5"/></svg>
    <span>Subject</span>
  </button>
</nav>

<div class="bottom-sheet-overlay" id="sheetOverlay">
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Share Short</div>
    <div class="sheet-subtitle" id="sheetSubtitle"></div>

    <div class="share-options" id="shareOptions">
      <button class="share-option" type="button" data-share="copy">
        <span class="option-icon copy">
          <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
        </span>
        <span class="option-label">Copy Link<span class="option-desc">Copy shareable link</span></span>
      </button>

      <button class="share-option" type="button" data-share="download">
        <span class="option-icon download">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>
        </span>
        <span class="option-label">Download Video<span class="option-desc">Save to your device</span></span>
      </button>

      <button class="share-option" type="button" data-share="whatsapp">
        <span class="option-icon whatsapp">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8L4 20zM9 9.5c.3 2 2.5 4.2 4.5 4.5l1.2-1.2-1.8-1-.8.7c-.8-.4-1.5-1.1-1.9-1.9l.7-.8-1-1.8L9 9.5z"/></svg>
        </span>
        <span class="option-label">WhatsApp<span class="option-desc">Share via WhatsApp</span></span>
      </button>

      <button class="share-option" type="button" data-share="native">
        <span class="option-icon native">
          <svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.8 7.7L12 3.5l4.2 4.2M5 11.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5"/></svg>
        </span>
        <span class="option-label">Share<span class="option-desc">Share using other apps</span></span>
      </button>
    </div>

    <button class="sheet-close-btn" type="button" id="sheetClose">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="JavaScript/home.js"></script>
<script src="JavaScript/shorts.js"></script>
<script src="JavaScript/subject.js"></script>
<script>
  (function () {
    var tabs = window.Tabs;
    var views = {
      home: document.getElementById("view-home"),
      subject: document.getElementById("view-subject"),
      shorts: document.getElementById("view-shorts")
    };
    var tabButtons = document.querySelectorAll(".nav-item[data-view]");
    var started = false;

    function select(target) {
      tabButtons.forEach(function (n) {
        n.classList.toggle("active", n.getAttribute("data-view") === target);
      });
      Object.keys(views).forEach(function (key) {
        views[key].classList.toggle("active", key === target);
      });
      document.documentElement.classList.toggle("shorts-mode", target === "shorts");
      if (tabs[target] && tabs[target].show) tabs[target].show();
      window.scrollTo(0, 0);
    }

    tabButtons.forEach(function (item) {
      item.addEventListener("click", function () {
        select(item.getAttribute("data-view"));
      });
    });

    auth.onAuthStateChanged(function (user) {
      if (!user || started) return;
      started = true;
      tabs.home.start(user);
      tabs.subject.start();
      tabs.shorts.start();
      if (location.hash === "#shorts" || new URLSearchParams(location.search).get("short")) {
        select("shorts");
      } else if (location.hash === "#subject") {
        select("subject");
      }
