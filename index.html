<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPLcode</title>
<meta name="theme-color" content="#101211">
<style>
:root {
  --bg: #101211;
  --surface: #1B211E;
  --primary: #A3E635;
  --text: #F5F5F5;
  --muted: #9AA39E;
  --line: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(16, 18, 17, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid rgba(163, 230, 53, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: var(--primary);
}
header h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
header h1 span { color: var(--primary); }
main {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px;
}
.section-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 8px 0 12px;
}
.section-title:first-child { margin-top: 0; }
.list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.match {
  display: block;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 16px;
  cursor: pointer;
  color: var(--text);
  text-decoration: none;
  transition: transform 0.15s ease;
}
.match:active { transform: scale(0.985); }
.match.live { border-color: var(--primary); }
.match.ended { opacity: 0.6; }
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.team-logo {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: 1.3rem;
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name { font-size: 0.9rem; font-weight: 700; word-break: break-word; }
.vs { font-weight: 800; color: var(--muted); }
.tag-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.time { font-size: 0.85rem; color: var(--muted); }
.badge {
  font-size: 0.75rem;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 999px;
  letter-spacing: 0.06em;
}
.badge.live {
  background: var(--primary);
  color: #101211;
  animation: pulse 1.4s ease-in-out infinite;
}
.badge.notstarted {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
}
.badge.ended {
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--line);
}
.badge.tomorrow {
  background: rgba(163, 230, 53, 0.14);
  color: var(--primary);
  border: 1px solid rgba(163, 230, 53, 0.35);
}
.badge.days {
  background: var(--bg);
  color: var(--primary);
  border: 1px solid var(--line);
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.empty { text-align: center; color: var(--muted); padding: 20px 16px; margin-bottom: 24px; }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <h1>NPL<span>code</span></h1>
</header>
<main id="homeMain"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const homeMain = document.getElementById("homeMain");

let teamsData = {};
let matchesData = {};
let lastSignature = "";

if (location.pathname.endsWith("/index.html") || location.pathname.endsWith("/index")) {
  history.replaceState(null, "", "/");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function dayNumber(ms) {
  const d = new Date(ms);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function getInfo(m, now) {
  const start = m.startTime;
  const dayDiff = dayNumber(start) - dayNumber(now);
  let state;
  if (now < start) state = "notstarted";
  else if (now < start + LIVE_MS) state = "live";
  else state = "ended";

  let visible = true;
  let group = "today";
  if (dayDiff > 0) group = "upcoming";
  if (dayDiff < 0) {
    if (state === "live") group = "today";
    else visible = false;
  }
  return { state, dayDiff, visible, group };
}

function teamHtml(id) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  return `<div class="team"><div class="team-logo">${logo}</div><div class="team-name">${name}</div></div>`;
}

function tagHtml(info) {
  if (info.group === "today") {
    if (info.state === "live") return '<span class="badge live">LIVE NOW</span>';
    if (info.state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
    return '<span class="badge notstarted">NOT STARTED</span>';
  }
  if (info.dayDiff === 1) return '<span class="badge tomorrow">TOMORROW</span>';
  return `<span class="badge days">${info.dayDiff} DAYS LEFT</span>`;
}

function cardHtml(id, m, info) {
  const classes = ["match"];
  if (info.group === "today" && info.state === "live") classes.push("live");
  if (info.group === "today" && info.state === "ended") classes.push("ended");
  return `
    <a class="${classes.join(" ")}" href="/match/${encodeURIComponent(id)}">
      <div class="teams">
        ${teamHtml(m.team1)}
        <div class="vs">VS</div>
        ${teamHtml(m.team2)}
      </div>
      <div class="tag-row">
        <span class="time">${formatTime(m.startTime)}</span>
        ${tagHtml(info)}
      </div>
    </a>
  `;
}

function todayOrder(info) {
  if (info.state === "live") return 0;
  if (info.state === "notstarted") return 1;
  return 2;
}

function renderHome() {
  const now = Date.now();
  const items = Object.entries(matchesData)
    .map(([id, m]) => ({ id, m, info: getInfo(m, now) }))
    .filter((x) => x.info.visible);

  const today = items
    .filter((x) => x.info.group === "today")
    .sort((a, b) => todayOrder(a.info) - todayOrder(b.info) || a.m.startTime - b.m.startTime);
  const upcoming = items
    .filter((x) => x.info.group === "upcoming")
    .sort((a, b) => a.m.startTime - b.m.startTime);

  let html = '<div class="section-title">Today\'s matches</div>';
  html += today.length
    ? `<div class="list">${today.map((x) => cardHtml(x.id, x.m, x.info)).join("")}</div>`
    : '<div class="empty">No matches today</div>';

  html += '<div class="section-title">Other matches</div>';
  html += upcoming.length
    ? `<div class="list">${upcoming.map((x) => cardHtml(x.id, x.m, x.info)).join("")}</div>`
    : '<div class="empty">No upcoming matches</div>';

  homeMain.innerHTML = html;
}

onValue(ref(db, "teams"), (snap) => {
  teamsData = snap.val() || {};
  renderHome();
});

onValue(ref(db, "matches"), (snap) => {
  matchesData = snap.val() || {};
  renderHome();
});

setInterval(() => {
  const now = Date.now();
  const sig = dayNumber(now) + "#" + Object.entries(matchesData)
    .map(([id, m]) => {
      const i = getInfo(m, now);
      return id + i.state + i.dayDiff + (i.visible ? "v" : "h");
    })
    .join("|");
  if (sig !== lastSignature) {
    lastSignature = sig;
    renderHome();
  }
}, 1000);

renderHome();
</script>
</body>
</html>
