<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPLcode</title>
<meta name="theme-color" content="#0C0F0D">
<style>
:root {
  --bg: #0C0F0D;
  --surface: #151A17;
  --surface-2: #1C231F;
  --primary: #A3E635;
  --primary-soft: rgba(163, 230, 53, 0.12);
  --text: #F4F6F4;
  --muted: #8C9790;
  --line: rgba(255, 255, 255, 0.07);
  --red: #FF5A5F;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  background-image: radial-gradient(600px 300px at 50% -80px, rgba(163, 230, 53, 0.10), transparent);
  background-repeat: no-repeat;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 15, 13, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
}
.bar {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: linear-gradient(145deg, #1F2A22, #131814);
  border: 1px solid rgba(163, 230, 53, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--primary);
}
.brand { flex: 1; }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.brand h1 span { color: var(--primary); }
.brand p { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.live-pill {
  display: none;
  align-items: center;
  gap: 7px;
  background: var(--primary-soft);
  border: 1px solid rgba(163, 230, 53, 0.35);
  color: var(--primary);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  padding: 7px 12px;
  border-radius: 999px;
}
.live-pill.on { display: inline-flex; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse 1.4s ease-in-out infinite;
}
main {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 22px 20px 40px;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 0 12px;
}
.section-title {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.count {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 999px;
}
.list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
.match {
  display: block;
  position: relative;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 16px 16px 14px;
  color: var(--text);
  text-decoration: none;
  transition: transform 0.15s ease, border-color 0.2s ease;
}
.match:active { transform: scale(0.98); }
.match.live {
  border-color: rgba(163, 230, 53, 0.65);
  box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.15), 0 10px 40px -12px rgba(163, 230, 53, 0.35);
}
.match.ended { opacity: 0.55; }
.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.time-chip { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.team-logo {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: 1.4rem;
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name {
  font-size: 0.9rem;
  font-weight: 700;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.team.winner .team-logo { border-color: var(--primary); box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.25); }
.win-tag {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #0C0F0D;
  background: var(--primary);
  padding: 3px 8px;
  border-radius: 999px;
}
.vs {
  font-weight: 800;
  font-size: 0.75rem;
  color: var(--muted);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
}
.foot {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--muted);
}
.foot .go { color: var(--primary); font-weight: 800; white-space: nowrap; }
.foot-right { display: flex; align-items: center; gap: 12px; }
.share-mini {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
}
.share-mini:active { border-color: var(--primary); color: var(--primary); }
.share-mini svg { width: 13px; height: 13px; }
.badge {
  font-size: 0.68rem;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 999px;
  letter-spacing: 0.07em;
  white-space: nowrap;
}
.badge.live { background: var(--primary); color: #0C0F0D; animation: pulse 1.4s ease-in-out infinite; }
.badge.notstarted { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.badge.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.tomorrow { background: var(--primary-soft); color: var(--primary); border: 1px solid rgba(163, 230, 53, 0.35); }
.badge.days { background: var(--bg); color: var(--primary); border: 1px solid var(--line); }
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  padding: 26px 16px;
  margin-bottom: 28px;
  border: 1px dashed var(--line);
  border-radius: 20px;
}
.skeleton {
  height: 176px;
  border-radius: 24px;
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.3s linear infinite;
  margin-bottom: 14px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--primary);
  color: #0C0F0D;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 11px 20px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) {
  .badge.live, .dot, .skeleton { animation: none; }
  .match, .toast { transition: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">N</div>
    <div class="brand">
      <h1>NPL<span>code</span></h1>
      <p>Live matches &amp; watch links</p>
    </div>
    <div class="live-pill" id="livePill"><span class="dot"></span><span id="liveCount">LIVE</span></div>
  </div>
</header>
<main id="homeMain">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const homeMain = document.getElementById("homeMain");
const livePill = document.getElementById("livePill");
const liveCount = document.getElementById("liveCount");
const toastEl = document.getElementById("toast");

const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>';

let teamsData = {};
let matchesData = {};
let matchesLoaded = false;
let failed = false;
let lastSignature = "";
let toastTimer = null;

if (location.pathname.endsWith("/index.html") || location.pathname.endsWith("/index")) {
  history.replaceState(null, "", "/" + location.search + location.hash);
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err2) {
      ok = false;
    }
    ta.remove();
    return ok;
  }
}

function teamName(id) {
  const t = teamsData[id];
  return t && t.name ? t.name : "TBD";
}

async function shareMatch(id) {
  const m = matchesData[id];
  if (!m) return;
  const url = location.origin + "/match/" + encodeURIComponent(id);
  const title = teamName(m.team1) + " vs " + teamName(m.team2);
  const text = title + " - Watch live on NPLcode";
  if (navigator.share) {
    try {
      await navigator.share({ title, text, url });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const ok = await copyText(url);
  showToast(ok ? "Match link copied" : url);
}

homeMain.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-share]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  shareMatch(btn.getAttribute("data-share"));
});

homeMain.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const btn = e.target.closest("[data-share]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  shareMatch(btn.getAttribute("data-share"));
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function dayNumber(ms) {
  const d = new Date(ms);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatDate(ms) {
  return new Date(ms).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}

function duration(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? h + "h " + m + "m" : h + "h";
}

function getInfo(m, now) {
  const start = m.startTime;
  const dayDiff = dayNumber(start) - dayNumber(now);
  let state;
  if (now < start) state = "notstarted";
  else if (m.ended !== true && now < start + LIVE_MS) state = "live";
  else state = "ended";

  let visible = true;
  let group = "today";
  if (dayDiff > 0) group = "upcoming";
  if (dayDiff < 0) {
    if (state === "live") group = "today";
    else visible = false;
  }
  return { state, dayDiff, visible, group };
}

function winnerOf(m) {
  return m.winner && (m.winner === m.team1 || m.winner === m.team2) ? m.winner : null;
}

function whenText(m, info, now) {
  if (info.state === "live") return "Started " + duration(now - m.startTime) + " ago";
  if (info.state === "ended") {
    const w = winnerOf(m);
    return w ? "Winner: " + teamName(w) : "Match ended";
  }
  if (info.group === "today") return "Starts in " + duration(m.startTime - now);
  return formatDate(m.startTime);
}

function teamHtml(id, isWinner) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  const tag = isWinner ? '<div class="win-tag">WINNER</div>' : "";
  return `<div class="team ${isWinner ? "winner" : ""}"><div class="team-logo">${logo}</div><div class="team-name">${name}</div>${tag}</div>`;
}

function tagHtml(info) {
  if (info.group === "today") {
    if (info.state === "live") return '<span class="badge live">LIVE NOW</span>';
    if (info.state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
    return '<span class="badge notstarted">NOT STARTED</span>';
  }
  if (info.dayDiff === 1) return '<span class="badge tomorrow">TOMORROW</span>';
  return `<span class="badge days">${info.dayDiff} DAYS LEFT</span>`;
}

function cardHtml(id, m, info, now) {
  const classes = ["match"];
  if (info.state === "live") classes.push("live");
  if (info.group === "today" && info.state === "ended") classes.push("ended");
  const goText = info.state === "live" ? "Watch now &rsaquo;" : "Details &rsaquo;";
  const w = info.state === "ended" ? winnerOf(m) : null;
  return `
    <a class="${classes.join(" ")}" href="/match/${encodeURIComponent(id)}">
      <div class="meta">
        <span class="time-chip">${esc(formatTime(m.startTime))}</span>
        ${tagHtml(info)}
      </div>
      <div class="teams">
        ${teamHtml(m.team1, w === m.team1)}
        <div class="vs">VS</div>
        ${teamHtml(m.team2, w === m.team2)}
      </div>
      <div class="foot">
        <span>${esc(whenText(m, info, now))}</span>
        <span class="foot-right">
          <span class="share-mini" role="button" tabindex="0" data-share="${esc(id)}" aria-label="Share match">${SHARE_ICON}Share</span>
          <span class="go">${goText}</span>
        </span>
      </div>
    </a>
  `;
}

function todayOrder(info) {
  if (info.state === "live") return 0;
  if (info.state === "notstarted") return 1;
  return 2;
}

function sectionHtml(title, items, emptyText, now) {
  const head = `<div class="section-head"><div class="section-title">${title}</div><div class="count">${items.length}</div></div>`;
  const body = items.length
    ? `<div class="list">${items.map((x) => cardHtml(x.id, x.m, x.info, now)).join("")}</div>`
    : `<div class="empty">${emptyText}</div>`;
  return head + body;
}

function renderHome() {
  if (failed) {
    homeMain.innerHTML = '<div class="empty">Could not load matches. Please check your connection and try again.</div>';
    return;
  }
  if (!matchesLoaded) return;

  const now = Date.now();
  const items = Object.entries(matchesData)
    .filter(([, m]) => m && typeof m.startTime === "number")
    .map(([id, m]) => ({ id, m, info: getInfo(m, now) }))
    .filter((x) => x.info.visible);

  const today = items
    .filter((x) => x.info.group === "today")
    .sort((a, b) => todayOrder(a.info) - todayOrder(b.info) || a.m.startTime - b.m.startTime);
  const upcoming = items
    .filter((x) => x.info.group === "upcoming")
    .sort((a, b) => a.m.startTime - b.m.startTime);

  const liveNow = items.filter((x) => x.info.state === "live").length;
  livePill.classList.toggle("on", liveNow > 0);
  liveCount.textContent = liveNow + " LIVE";

  homeMain.innerHTML =
    sectionHtml("Today's matches", today, "No matches today", now) +
    sectionHtml("Upcoming matches", upcoming, "No upcoming matches", now);
}

function onError() {
  failed = true;
  renderHome();
}

onValue(ref(db, "teams"), (snap) => {
  teamsData = snap.val() || {};
  renderHome();
}, onError);

onValue(ref(db, "matches"), (snap) => {
  matchesData = snap.val() || {};
  matchesLoaded = true;
  failed = false;
  renderHome();
}, onError);

setInterval(() => {
  if (!matchesLoaded) return;
  const now = Date.now();
  const sig = dayNumber(now) + "#" + Object.entries(matchesData)
    .filter(([, m]) => m && typeof m.startTime === "number")
    .map(([id, m]) => {
      const i = getInfo(m, now);
      return id + i.state + i.dayDiff + (i.visible ? "v" : "h") + whenText(m, i, now);
    })
    .join("|");
  if (sig !== lastSignature) {
    lastSignature = sig;
    renderHome();
  }
}, 1000);
</script>
</body>
</html>
