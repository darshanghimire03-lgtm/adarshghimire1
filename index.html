<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramuscode</title>
<meta name="theme-color" content="#101211">
<style>
:root {
  --bg: #101211;
  --surface: #1B211E;
  --primary: #A3E635;
  --text: #F5F5F5;
  --muted: #9AA39E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 30%, rgba(163, 230, 53, 0.12), transparent 60%);
}
.badge {
  width: 88px;
  height: 88px;
  border-radius: 24px;
  background: var(--surface);
  border: 1px solid rgba(163, 230, 53, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 28px;
}
h1 {
  font-size: clamp(2.6rem, 9vw, 5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
}
h1 span { color: var(--primary); }
p {
  margin-top: 16px;
  max-width: 460px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.6;
}
.actions {
  margin-top: 32px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  padding: 14px 26px;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #101211; }
.btn-ghost {
  background: var(--surface);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
footer {
  padding: 20px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}
</style>
</head>
<body>
<main>
  <div class="badge">R</div>
  <h1>Ramus<span>code</span></h1>
  <p>Your projects and GitHub repos, together in one place.</p>
  <div class="actions">
    <a class="btn btn-primary" href="#">Get the app</a>
    <a class="btn btn-ghost" href="https://github.com" target="_blank" rel="noopener">GitHub</a>
  </div>
</main>
<footer>&copy; 2026 Ramuscode</footer>
</body>
</html>
