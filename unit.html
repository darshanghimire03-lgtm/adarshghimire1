<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Durbar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0c1f4a;
    --muted: #8a96b0;
    --tint: #e6eefc;
    --tint-line: #d3dff5;
    --card: #f3f7ff;
    --icon-box: #e8f0fd;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: #ffffff;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #111827;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: calc(16px + env(safe-area-inset-top)) 16px 14px 16px;
  }

  .round-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--tint);
    border: none;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
  }

  .round-btn svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .round-btn svg.dots {
    fill: currentColor;
    stroke: none;
  }

  .page-title {
    flex: 1;
    min-width: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .unit-list {
    list-style: none;
    padding: 6px 20px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .unit-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border-radius: 30px;
    padding: 16px 16px 16px 16px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .unit-card:active {
    transform: scale(0.985);
    background: #eaf1fd;
  }

  .unit-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--icon-box);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .unit-icon svg {
    width: 26px;
    height: 26px;
    stroke: #1a2a7a;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .unit-info {
    flex: 1;
    min-width: 0;
  }

  .unit-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .unit-count {
    margin-top: 3px;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .chevron {
    width: 20px;
    height: 20px;
    stroke: #6b7a99;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    margin-right: 4px;
  }

  .skeleton {
    height: 84px;
    border-radius: 30px;
    background: linear-gradient(100deg, #f3f7ff 30%, #fafcff 50%, #f3f7ff 70%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite linear;
  }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  .empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 70px 24px;
  }

  .empty h2 {
    font-size: 1.2rem;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .empty p {
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<header class="top-bar">
  <a class="round-btn" id="backLink" href="index.html#subject" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="page-title" id="subjectName">Subject</h1>
  <button class="round-btn" type="button" aria-label="More">
    <svg class="dots" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2"/>
      <circle cx="12" cy="12" r="2"/>
      <circle cx="12" cy="19" r="2"/>
    </svg>
  </button>
</header>

<div class="empty" id="comingSoon">
  <h2>No units yet</h2>
  <p>This subject is still empty. Check back later for new content.</p>
</div>

<ul class="unit-list" id="unitList">
  <li class="skeleton"></li>
  <li class="skeleton"></li>
  <li class="skeleton"></li>
</ul>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  (function () {
    var SVG_NS = "http://www.w3.org/2000/svg";
    var BOOK_PATH = "M4 5.5A1.5 1.5 0 0 1 5.5 4H9v15H5.5A1.5 1.5 0 0 1 4 17.5v-12zM9 4h6v15H9zM15 4h3.5A1.5 1.5 0 0 1 20 5.5v12a1.5 1.5 0 0 1-1.5 1.5H15zM9.8 19v1.8M14.2 19v1.8";
    var CHEVRON_PATH = "M9 5l7 7-7 7";

    var listEl = document.getElementById("unitList");
    var comingSoonEl = document.getElementById("comingSoon");
    var subjectNameEl = document.getElementById("subjectName");

    var subjectName = qs("subjectName") ? decodeURIComponent(qs("subjectName")) : "Subject";
    var subjectKeyFromLink = qs("subjectKey");
    var subjectKey = subjectKeyFromLink || sanitizeKey(subjectName);

    subjectNameEl.textContent = subjectName;
    document.title = "Durbar \u00B7 " + subjectName;

    function svgIcon(d, className) {
      var s = document.createElementNS(SVG_NS, "svg");
      s.setAttribute("viewBox", "0 0 24 24");
      if (className) s.setAttribute("class", className);
      var p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", d);
      s.appendChild(p);
      return s;
    }

    function clearSkeletons() {
      var skeletons = listEl.querySelectorAll(".skeleton");
      skeletons.forEach(function (s) {
        s.remove();
      });
    }

    function updateEmptyState(hasUnits) {
      listEl.style.display = hasUnits ? "" : "none";
      comingSoonEl.style.display = hasUnits ? "none" : "block";
    }

    function buildUnit(unit) {
      var notes = unit.notes || {};
      var noteCount = Object.keys(notes).length;
      var subtitle = noteCount === 1 ? "1 note" : (noteCount + " notes");

      var li = document.createElement("li");

      var a = document.createElement("a");
      a.className = "unit-card";
      a.href = "notes.html?unitId=" + encodeURIComponent(unit.id) +
               "&unitName=" + encodeURIComponent(unit.name) +
               "&subjectName=" + encodeURIComponent(subjectName) +
               "&subjectKey=" + encodeURIComponent(subjectKey);

      var icon = document.createElement("span");
      icon.className = "unit-icon";
      icon.appendChild(svgIcon(BOOK_PATH));

      var info = document.createElement("span");
      info.className = "unit-info";
      info.style.display = "block";

      var name = document.createElement("div");
      name.className = "unit-name";
      name.textContent = unit.name;

      var count = document.createElement("div");
      count.className = "unit-count";
      count.textContent = subtitle;

      info.appendChild(name);
      info.appendChild(count);

      a.appendChild(icon);
      a.appendChild(info);
      a.appendChild(svgIcon(CHEVRON_PATH, "chevron"));
      li.appendChild(a);
      return li;
    }

    unitsRef(subjectKey).once("value")
      .then(function (snapshot) {
        var units = [];
        snapshot.forEach(function (child) {
          units.push(child.val());
        });

        clearSkeletons();

        if (units.length === 0) {
          updateEmptyState(false);
          return;
        }

        listEl.innerHTML = "";
        units.forEach(function (unit) {
          listEl.appendChild(buildUnit(unit));
        });
        updateEmptyState(true);
      })
      .catch(function (err) {
        console.error("loadUnits cancelled: " + err.message);
        clearSkeletons();
        updateEmptyState(false);
      });
  })();
</script>

</body>
</html>
