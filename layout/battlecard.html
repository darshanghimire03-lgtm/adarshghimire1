<a class="{{classes}}" href="/match/{{hrefId}}">
  <div class="meta">
    <span class="time-chip">{{clock}}{{time}}</span>
    {{tag}}
  </div>
  <div class="teams">
    {{team1}}
    <div class="vs">VS</div>
    {{team2}}
  </div>
  <div class="foot">
    <span class="foot-left">{{when}}</span>
    <span class="foot-right">
      <span class="share-mini" role="button" tabindex="0" data-share="{{idAttr}}" aria-label="Share match">{{share}}</span>
      <span class="go">{{go}}</span>
    </span>
  </div>
</a>
