<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Durbar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0c1f4a;
    --muted: #8a96b0;
    --tint: #e6eefc;
    --card: #f3f7ff;
    --line: #dfe6f3;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: #ffffff;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #111827;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: calc(16px + env(safe-area-inset-top)) 16px 14px 16px;
  }

  .round-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--tint);
    border: none;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
  }

  .round-btn svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .page-title {
    flex: 1;
    min-width: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .notes-list {
    padding: 6px 16px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .note-card {
    background: var(--card);
    border-radius: 28px;
    padding: 20px 20px 20px 20px;
  }

  .note-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.3;
    word-break: break-word;
  }

  .note-divider {
    height: 1.5px;
    background: var(--line);
    margin: 16px 0 16px 0;
  }

  .note-description {
    font-size: 0.98rem;
    line-height: 1.55;
    color: #3a4560;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 14px;
  }

  .media-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .media-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .media-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .file-row {
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }

  .file-row:active {
    opacity: 0.7;
  }

  .file-icon {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, #ff7a6b, #e53935);
  }

  .file-icon.word {
    background: linear-gradient(135deg, #5b8def, #2a56c6);
  }

  .file-icon.file {
    background: linear-gradient(135deg, #8d9bb5, #5d6b88);
  }

  .file-icon svg {
    width: 26px;
    height: 26px;
    fill: #ffffff;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.3;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .file-meta {
    margin-top: 4px;
    font-size: 0.92rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .file-meta .dot {
    font-size: 0.7rem;
  }

  .photo-collage {
    display: grid;
    gap: 4px;
    border-radius: 18px;
    overflow: hidden;
    background: #e3ebf8;
    cursor: pointer;
    position: relative;
  }

  .photo-collage .collage-item {
    position: relative;
    overflow: hidden;
    background: #d5e0f3;
    min-height: 110px;
  }

  .photo-collage .collage-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-collage.layout-1 {
    grid-template-columns: 1fr;
  }

  .photo-collage.layout-1 .collage-item {
    min-height: 200px;
  }

  .photo-collage.layout-2 {
    grid-template-columns: 1fr 1fr;
  }

  .photo-collage.layout-2 .collage-item {
    min-height: 150px;
  }

  .photo-collage.layout-3 {
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .photo-collage.layout-3 .collage-item:first-child {
    grid-row: 1 / 3;
    min-height: 200px;
  }

  .photo-collage.layout-3 .collage-item:not(:first-child) {
    min-height: 98px;
  }

  .photo-collage.layout-4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .photo-collage.layout-4 .collage-item {
    min-height: 110px;
  }

  .photo-collage.layout-5 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
  }

  .photo-collage.layout-5 .collage-item:first-child {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
    min-height: 140px;
  }

  .photo-collage.layout-5 .collage-item:not(:first-child) {
    min-height: 86px;
  }

  .photo-count-overlay {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(12, 31, 74, 0.72);
    color: #ffffff;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }

  .view-all-overlay {
    position: absolute;
    inset: 0;
    background: rgba(12, 31, 74, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .yt-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .yt-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border-radius: 18px;
    padding: 8px;
    text-decoration: none;
    color: inherit;
  }

  .yt-card:active {
    opacity: 0.7;
  }

  .yt-thumb {
    width: 96px;
    height: 58px;
    border-radius: 12px;
    background: #d5e0f3;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }

  .yt-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .yt-badge {
    align-self: flex-start;
    background: var(--navy);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.62rem;
    padding: 2px 10px;
    border-radius: 30px;
    letter-spacing: 0.04em;
  }

  .yt-text {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .skeleton {
    height: 150px;
    border-radius: 28px;
    background: linear-gradient(100deg, #f3f7ff 30%, #fafcff 50%, #f3f7ff 70%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite linear;
  }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  .empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 70px 24px;
  }

  .empty h2 {
    font-size: 1.2rem;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .empty p {
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<header class="top-bar">
  <a class="round-btn" id="backLink" href="index.html#subject" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="page-title" id="unitName">Unit</h1>
</header>

<div class="empty" id="comingSoon">
  <h2>No notes yet</h2>
  <p>This unit is still empty. Check back later for new content.</p>
</div>

<div class="notes-list" id="notesList">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  (function () {
    "use strict";

    var SVG_NS = "http://www.w3.org/2000/svg";
    var FILE_PATH = "M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z";

    function extensionOf(name) {
      var dot = name.lastIndexOf(".");
      if (dot === -1 || dot === name.length - 1) return "";
      return name.substring(dot + 1).toLowerCase();
    }

    function getFileType(name) {
      var ext = extensionOf(name);
      if (ext === "pdf") return "pdf";
      if (ext === "doc" || ext === "docx") return "word";
      return "file";
    }

    function cleanTitle(name) {
      var ext = extensionOf(name);
      if (!ext) return name;
      if (name.endsWith("." + ext)) return name.slice(0, -(ext.length + 1));
      var upper = ext.toUpperCase();
      if (name.endsWith("." + upper)) return name.slice(0, -(upper.length + 1));
      return name;
    }

    function formatFileSize(bytes) {
      if (bytes <= 0) return "0 B";
      var units = ["B", "KB", "MB", "GB"];
      var size = bytes;
      var unitIndex = 0;
      while (size >= 1024 && unitIndex < units.length - 1) {
        size /= 1024;
        unitIndex++;
      }
      return unitIndex === 0 ? Math.trunc(size) + " " + units[unitIndex]
                             : size.toFixed(1) + " " + units[unitIndex];
    }

    function getFileLabel(name) {
      var ext = extensionOf(name);
      if (ext === "pdf") return "PDF";
      if (ext === "doc" || ext === "docx") return "DOC";
      return "FILE";
    }

    var YT_ID_PATTERN = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;

    function extractVideoId(url) {
      var m = YT_ID_PATTERN.exec(url || "");
      return m ? m[1] : null;
    }

    function youtubeThumbUrl(videoId) {
      return "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function fileIconSvg() {
      var s = document.createElementNS(SVG_NS, "svg");
      s.setAttribute("viewBox", "0 0 24 24");
      var p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", FILE_PATH);
      s.appendChild(p);
      return s;
    }

    var listEl = document.getElementById("notesList");
    var comingSoonEl = document.getElementById("comingSoon");
    var unitNameEl = document.getElementById("unitName");
    var backLink = document.getElementById("backLink");

    var unitId = qs("unitId") || "";
    var unitName = qs("unitName") ? decodeURIComponent(qs("unitName")) : "Unit";
    var subjectName = qs("subjectName") ? decodeURIComponent(qs("subjectName")) : "";
    var subjectKey = qs("subjectKey") || sanitizeKey(subjectName.toLowerCase().replaceAll(" ", "_"));

    unitNameEl.textContent = unitName;
    document.title = "Durbar \u00B7 " + unitName;

    backLink.href = "unit.html?subjectName=" + encodeURIComponent(subjectName) +
                    "&subjectKey=" + encodeURIComponent(subjectKey);

    function renderPhotoCollage(container, photos, noteId, position) {
      if (!photos || photos.length === 0) return;

      var count = photos.length;
      var layoutClass = "layout-1";
      if (count === 2) layoutClass = "layout-2";
      else if (count === 3) layoutClass = "layout-3";
      else if (count === 4) layoutClass = "layout-4";
      else if (count >= 5) layoutClass = "layout-5";

      var collage = el("div", "photo-collage " + layoutClass);

      var photoUrls = photos.map(function (p) {
        return encodeURIComponent(p.url);
      }).join("||");
      var photoPageUrl = "photo.html?photos=" + photoUrls +
                         "&note=" + encodeURIComponent(noteId || "") +
                         "&position=" + position;

      collage.addEventListener("click", function () {
        window.location.href = photoPageUrl;
      });

      var displayCount = Math.min(count, 5);
      var remaining = count - 5;

      for (var i = 0; i < displayCount; i++) {
        var item = el("div", "collage-item");
        var img = document.createElement("img");
        img.src = photos[i].url;
        img.alt = "Photo " + (i + 1);
        img.loading = "lazy";
        item.appendChild(img);

        if (i === 4 && remaining > 0) {
          item.appendChild(el("div", "view-all-overlay", "+" + remaining + " more"));
        }

        collage.appendChild(item);
      }

      collage.appendChild(el("div", "photo-count-overlay", count + (count === 1 ? " photo" : " photos")));
      container.appendChild(collage);
    }

    function renderPdfs(container, pdfs) {
      if (!pdfs || pdfs.length === 0) return;
      var list = el("div", "file-list");

      pdfs.forEach(function (pdf) {
        var rawName = pdf.name || "document.pdf";
        var type = getFileType(rawName);
        var sizeText = pdf.sizeBytes > 0 ? formatFileSize(pdf.sizeBytes) : null;
        var label = getFileLabel(rawName);

        var row = el("div", "file-row");
        row.addEventListener("click", function (e) {
          e.stopPropagation();
          var viewerUrl = "pdf.html?url=" + encodeURIComponent(pdf.url) +
                          "&name=" + encodeURIComponent(rawName) +
                          "&size=" + encodeURIComponent(sizeText || "\u2014") +
                          "&return=" + encodeURIComponent(window.location.pathname + window.location.search);
          window.location.href = viewerUrl;
        });

        var icon = el("div", "file-icon " + type);
        icon.appendChild(fileIconSvg());

        var info = el("div", "file-info");
        info.appendChild(el("div", "file-name", cleanTitle(rawName)));

        var meta = el("div", "file-meta");
        if (sizeText) {
          meta.appendChild(el("span", "", sizeText));
          meta.appendChild(el("span", "dot", "\u2022"));
        }
        meta.appendChild(el("span", "", label));
        info.appendChild(meta);

        row.appendChild(icon);
        row.appendChild(info);
        list.appendChild(row);
      });

      container.appendChild(list);
    }

    function renderYoutubeLinks(container, links) {
      if (!links || links.length === 0) return;
      var list = el("div", "yt-list");

      links.forEach(function (yt) {
        var videoId = yt.videoId || extractVideoId(yt.url) || "";
        var badge = yt.videoNumber > 0 ? ("VIDEO " + yt.videoNumber) : "VIDEO";

        var a = el("a", "yt-card");
        a.href = videoId ? ("https://www.youtube.com/watch?v=" + videoId) : yt.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        if (videoId) {
          var img = el("img", "yt-thumb");
          img.src = youtubeThumbUrl(videoId);
          img.alt = "youtube thumbnail";
          img.loading = "lazy";
          a.appendChild(img);
        }

        var info = el("div", "yt-info");
        info.appendChild(el("span", "yt-badge", badge));
        info.appendChild(el("span", "yt-text", "Watch video"));
        a.appendChild(info);

        list.appendChild(a);
      });

      container.appendChild(list);
    }

    function mediaGroup(labelText) {
      var group = el("div", "media-group");
      if (labelText) group.appendChild(el("span", "media-label", labelText));
      return group;
    }

    function renderNote(note, position) {
      var card = el("div", "note-card");

      card.appendChild(el("div", "note-title", (position + 1) + ". " + (note.title || "Untitled")));
      card.appendChild(el("div", "note-divider"));

      if (note.description && note.description.trim() !== "") {
        card.appendChild(el("div", "note-description", note.description));
      }

      var mediaSection = el("div", "media-section");

      if (note.photos && note.photos.length > 0) {
        var photoGroup = mediaGroup("Photos");
        renderPhotoCollage(photoGroup, note.photos, note.id, position);
        mediaSection.appendChild(photoGroup);
      }

      if (note.youtubeLinks && note.youtubeLinks.length > 0) {
        var videoGroup = mediaGroup("Videos");
        renderYoutubeLinks(videoGroup, note.youtubeLinks);
        mediaSection.appendChild(videoGroup);
      }

      if (note.pdfs && note.pdfs.length > 0) {
        var pdfGroup = mediaGroup("");
        renderPdfs(pdfGroup, note.pdfs);
        mediaSection.appendChild(pdfGroup);
      }

      if (mediaSection.children.length > 0) {
        card.appendChild(mediaSection);
      }

      return card;
    }

    function updateEmptyState(hasNotes) {
      listEl.style.display = hasNotes ? "" : "none";
      comingSoonEl.style.display = hasNotes ? "none" : "block";
    }

    notesRef(subjectKey, unitId).once("value")
      .then(function (snapshot) {
        var notes = [];
        snapshot.forEach(function (child) {
          var noteData = child.val();
          noteData.id = child.key;
          notes.push(noteData);
        });
        notes.sort(function (a, b) {
          return (a.createdAt || 0) - (b.createdAt || 0);
        });

        listEl.innerHTML = "";
        if (notes.length === 0) {
          updateEmptyState(false);
          return;
        }

        notes.forEach(function (note, position) {
          listEl.appendChild(renderNote(note, position));
        });
        updateEmptyState(true);
      })
      .catch(function (err) {
        console.error("loadNotes cancelled: " + err.message);
        listEl.innerHTML = "";
        updateEmptyState(false);
      });
  })();
</script>

</body>
</html>
