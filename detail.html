<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch - NPLcode</title>
<meta name="theme-color" content="#101211">
<style>
:root {
  --bg: #101211;
  --surface: #1B211E;
  --primary: #A3E635;
  --text: #F5F5F5;
  --muted: #9AA39E;
  --line: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(16, 18, 17, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.back {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 12px;
  width: 40px;
  height: 40px;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.title { font-size: 1.05rem; font-weight: 700; }
main {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px;
}
.section-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 8px 0 12px;
}
.match-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px 16px;
  margin-bottom: 20px;
}
.match-card.live { border-color: var(--primary); }
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.team-logo {
  width: 76px;
  height: 76px;
  border-radius: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: 1.6rem;
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name { font-size: 0.95rem; font-weight: 700; word-break: break-word; }
.vs { font-weight: 800; color: var(--muted); }
.tag-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.time { font-size: 0.85rem; color: var(--muted); }
.badge {
  font-size: 0.75rem;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 999px;
  letter-spacing: 0.06em;
}
.badge.live {
  background: var(--primary);
  color: #101211;
  animation: pulse 1.4s ease-in-out infinite;
}
.badge.notstarted {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
}
.badge.ended {
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--line);
}
.badge.tomorrow {
  background: rgba(163, 230, 53, 0.14);
  color: var(--primary);
  border: 1px solid rgba(163, 230, 53, 0.35);
}
.badge.days {
  background: var(--bg);
  color: var(--primary);
  border: 1px solid var(--line);
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.links { display: flex; flex-direction: column; gap: 10px; }
.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
  transition: transform 0.15s ease;
}
.link-item:active { transform: scale(0.985); }
.link-item span:last-child { color: var(--primary); }
.hd {
  background: var(--primary);
  color: #101211;
  font-size: 0.7rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 8px;
  margin-right: 10px;
}
.link-left { display: flex; align-items: center; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }
</style>
</head>
<body>
<header>
  <a class="back" id="backBtn" href="/">&#8592;</a>
  <div class="title">Watch</div>
</header>
<main id="detail"><div class="empty">Loading...</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LINK_COUNT = 5;
const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const detail = document.getElementById("detail");

function getMatchId() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "match" && parts[1]) {
    try {
      return decodeURIComponent(parts[1]);
    } catch (err) {
      return parts[1];
    }
  }
  return new URLSearchParams(location.search).get("id");
}

const matchId = getMatchId();

let teamsData = {};
let match = null;
let loaded = false;
let failed = false;
let lastSignature = "";

document.getElementById("backBtn").addEventListener("click", (e) => {
  let sameOrigin = false;
  try {
    sameOrigin = document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (err) {
    sameOrigin = false;
  }
  if (sameOrigin && history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function dayNumber(ms) {
  const d = new Date(ms);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function getInfo(m, now) {
  const start = m.startTime;
  const dayDiff = dayNumber(start) - dayNumber(now);
  let state;
  if (now < start) state = "notstarted";
  else if (now < start + LIVE_MS) state = "live";
  else state = "ended";

  let visible = true;
  let group = "today";
  if (dayDiff > 0) group = "upcoming";
  if (dayDiff < 0) {
    if (state === "live") group = "today";
    else visible = false;
  }
  return { state, dayDiff, visible, group };
}

function teamHtml(id) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  return `<div class="team"><div class="team-logo">${logo}</div><div class="team-name">${name}</div></div>`;
}

function tagHtml(info) {
  if (info.group === "today") {
    if (info.state === "live") return '<span class="badge live">LIVE NOW</span>';
    if (info.state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
    return '<span class="badge notstarted">NOT STARTED</span>';
  }
  if (info.dayDiff === 1) return '<span class="badge tomorrow">TOMORROW</span>';
  return `<span class="badge days">${info.dayDiff} DAYS LEFT</span>`;
}

function render() {
  if (failed) {
    detail.innerHTML = '<div class="empty">Could not load match. Please check your connection and try again.</div>';
    return;
  }
  if (!loaded) return;
  const now = Date.now();
  const info = match && typeof match.startTime === "number" ? getInfo(match, now) : null;
  if (!match || !info || !info.visible) {
    detail.innerHTML = '<div class="empty">Match not found</div>';
    return;
  }

  let linksHtml;
  if (info.group === "today" && info.state === "live") {
    const items = [];
    for (let i = 1; i <= LINK_COUNT; i++) {
      const u = match.links && match.links["link" + i];
      if (u) {
        items.push(`
          <a class="link-item" href="${esc(u)}" target="_blank" rel="noopener">
            <span class="link-left"><span class="hd">HD</span>Link ${i}</span>
            <span>&#9654;</span>
          </a>
        `);
      }
    }
    linksHtml = items.length
      ? `<div class="links">${items.join("")}</div>`
      : '<div class="empty">No links added yet</div>';
  } else if (info.group === "today" && info.state === "ended") {
    linksHtml = '<div class="empty">This match has ended</div>';
  } else {
    linksHtml = '<div class="empty">Links will appear when the match goes live</div>';
  }

  detail.innerHTML = `
    <div class="match-card ${info.group === "today" && info.state === "live" ? "live" : ""}">
      <div class="teams">
        ${teamHtml(match.team1)}
        <div class="vs">VS</div>
        ${teamHtml(match.team2)}
      </div>
      <div class="tag-row">
        <span class="time">${formatTime(match.startTime)}</span>
        ${tagHtml(info)}
      </div>
    </div>
    <div class="section-title">Watch links</div>
    ${linksHtml}
  `;
}

function onError() {
  failed = true;
  render();
}

if (!matchId) {
  loaded = true;
  render();
} else {
  onValue(ref(db, "teams"), (snap) => {
    teamsData = snap.val() || {};
    render();
  }, onError);

  onValue(ref(db, "matches/" + matchId), (snap) => {
    match = snap.val();
    loaded = true;
    failed = false;
    render();
  }, onError);

  setInterval(() => {
    if (!match || typeof match.startTime !== "number") return;
    const i = getInfo(match, Date.now());
    const sig = i.state + i.dayDiff + (i.visible ? "v" : "h");
    if (sig !== lastSignature) {
      lastSignature = sig;
      render();
    }
  }, 1000);
}
</script>
</body>
</html>
