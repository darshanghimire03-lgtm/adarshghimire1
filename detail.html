
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Details</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#090d16;color:#f5f7fb;padding:18px}
.container{max-width:700px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.back{color:#aab8d0;text-decoration:none}
.card{background:#131b2b;border:1px solid #26344b;border-radius:16px;padding:20px;margin-bottom:16px}
.teams{display:flex;align-items:center;justify-content:space-around;text-align:center;gap:12px}
.team{flex:1;font-size:17px;font-weight:700}
.team img{width:65px;height:65px;object-fit:contain;display:block;margin:0 auto 10px}
.vs{color:#8291aa;font-weight:800}
.meta{color:#9eabc0;text-align:center;margin-top:17px;font-size:13px}
h2{font-size:18px;margin-bottom:15px}
.links{display:grid;gap:10px}
.link{display:flex;justify-content:space-between;align-items:center;background:#1c2940;padding:15px;border-radius:10px;color:white;text-decoration:none;border:1px solid #30415e}
.link:active{background:#263c5e}
.status{color:#9eabc0;text-align:center;padding:25px}
</style>
</head>
<body>
<div class="container">
<header class="header">
<a href="index.html" class="back">← Back</a>
<strong>Match Details</strong>
</header>

<div id="content" class="status">Loading match...</div>
</div>

<script>
const DATA_URL="https://npl-tv.pages.dev/data.json";
const PLAYER_PAGE="player.html";

const params=new URLSearchParams(location.search);
const matchId=params.get("match");

const content=document.getElementById("content");

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

function getLinks(match){
const links=[];

if(match.common?.url){
links.push({
id:"1",
name:match.common.name||"Watch Live",
url:match.common.url
});
}

Object.keys(match).forEach(key=>{
const found=key.match(/^link(\d+)$/);
if(found && match[key]?.url){
links.push({
id:found[1],
name:match[key].name||"Stream "+found[1],
url:match[key].url
});
}
});

return links;
}

async function loadMatch(){
if(!matchId){
content.innerHTML="No match ID provided.";
return;
}

try{
const response=await fetch(DATA_URL+"?t="+Date.now());
if(!response.ok)throw Error("Unable to load match data");

const data=await response.json();
const match=data[matchId];

if(!match)throw Error("Match not found");

const home=match.home||match.team1||match.team_a||"Team 1";
const away=match.away||match.team2||match.team_b||"Team 2";

const homeLogo=match.homeLogo||match.team1_logo||"";
const awayLogo=match.awayLogo||match.team2_logo||"";

const links=getLinks(match);

content.innerHTML=`
<div class="card">
<div class="teams">
<div class="team">
${homeLogo?`<img src="${escapeHTML(homeLogo)}" alt="">`:""}
${escapeHTML(home)}
</div>
<div class="vs">VS</div>
<div class="team">
${awayLogo?`<img src="${escapeHTML(awayLogo)}" alt="">`:""}
${escapeHTML(away)}
</div>
</div>
<div class="meta">
${escapeHTML(match.date||"")}
${match.time?" · "+escapeHTML(match.time):""}
${match.tournament?" · "+escapeHTML(match.tournament):""}
</div>
</div>

<div class="card">
<h2>Available Streams</h2>
<div class="links">
${links.length?links.map(link=>`
<a class="link" href="${PLAYER_PAGE}?match=${encodeURIComponent(matchId)}&id=${encodeURIComponent(link.id)}">
<span>${escapeHTML(link.name)}</span>
<span>▶</span>
</a>
`).join(""):"<p>No streaming links available.</p>"}
</div>
</div>
`;

}catch(error){
content.innerHTML=`<div class="card status">${escapeHTML(error.message)}</div>`;
}
}

loadMatch();
</script>
</body>
</html>
