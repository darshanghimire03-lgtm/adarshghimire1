<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player - NPLcode</title>
<meta name="theme-color" content="#0C0F0D">
<style>
:root {
  --bg: #0C0F0D;
  --surface: #151A17;
  --surface-2: #1C231F;
  --primary: #A3E635;
  --primary-soft: rgba(163, 230, 53, 0.12);
  --text: #F4F6F4;
  --muted: #8C9790;
  --line: rgba(255, 255, 255, 0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  background-image: radial-gradient(700px 320px at 50% -100px, rgba(163, 230, 53, 0.12), transparent);
  background-repeat: no-repeat;
}
.ic { width: 18px; height: 18px; flex-shrink: 0; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 15, 13, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top)) clamp(14px, 4vw, 24px) 12px;
}
.bar {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 13px;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.2s ease;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover { border-color: rgba(163, 230, 53, 0.5); }
.title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; flex: 1; }
.title span { color: var(--primary); }
main {
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: clamp(14px, 3vw, 24px) clamp(14px, 4vw, 24px) 48px;
}
.banner {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: clamp(20px, 4vw, 28px);
  padding: clamp(16px, 3.5vw, 26px) clamp(10px, 3vw, 24px) clamp(14px, 3vw, 20px);
  margin-bottom: clamp(14px, 3vw, 20px);
}
.banner.live {
  border-color: rgba(163, 230, 53, 0.6);
  box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.15), 0 14px 50px -16px rgba(163, 230, 53, 0.4);
}
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: clamp(6px, 2vw, 18px);
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vw, 12px); min-width: 0; }
.team-logo {
  width: clamp(56px, 15vw, 96px);
  height: clamp(56px, 15vw, 96px);
  border-radius: clamp(16px, 4vw, 26px);
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: clamp(1.3rem, 5vw, 2rem);
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name {
  font-size: clamp(0.8rem, 2.8vw, 1.05rem);
  font-weight: 800;
  max-width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.vs {
  font-weight: 800;
  font-size: clamp(0.7rem, 2.4vw, 0.85rem);
  color: var(--muted);
  width: clamp(34px, 8vw, 46px);
  height: clamp(34px, 8vw, 46px);
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner-info {
  margin-top: clamp(14px, 3vw, 20px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 14px;
}
.when { font-size: 0.85rem; color: var(--muted); font-weight: 600; text-align: center; }
.badge {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 7px 14px;
  border-radius: 999px;
  letter-spacing: 0.07em;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.badge.live { background: var(--primary); color: #0C0F0D; }
.badge.live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #0C0F0D;
  animation: pulse 1.4s ease-in-out infinite;
}
.badge.notstarted { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.badge.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.stage { position: relative; width: 100%; }
.player-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid var(--line);
  border-radius: clamp(16px, 3vw, 22px);
  overflow: hidden;
  box-shadow: 0 20px 60px -30px rgba(0, 0, 0, 0.9);
}
.player-wrap iframe { display: block; width: 100%; height: 100%; }
.react {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
}
.react-menu {
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateX(14px) scale(0.85);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.react.open .react-menu { opacity: 1; transform: none; pointer-events: auto; }
.rx-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: rgba(12, 15, 13, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 1.05rem;
  font-weight: 900;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}
.rx-btn:active { transform: scale(0.86); }
.rx-four { color: #38BDF8; }
.rx-six { color: #A3E635; }
.rx-wicket { color: #F43F5E; }
.rx-fab {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 0;
  background: var(--primary);
  color: #0C0F0D;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 22px -4px rgba(163, 230, 53, 0.7);
  transition: transform 0.15s ease;
}
.rx-fab:active { transform: scale(0.9); }
.rx-fab .ic { width: 22px; height: 22px; transition: transform 0.25s ease; }
.react.open .rx-fab .ic { transform: rotate(90deg); }
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--line);
  border-radius: clamp(16px, 3vw, 22px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.6vw, 12px);
  text-align: center;
  padding: 16px;
  background:
    radial-gradient(60% 75% at 50% 30%, rgba(163, 230, 53, 0.22), transparent 70%),
    linear-gradient(160deg, #111812, #050605);
  box-shadow: 0 20px 60px -30px rgba(0, 0, 0, 0.9);
}
.thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 72%);
}
.thumb > * { position: relative; }
.thumb.ended {
  background:
    radial-gradient(60% 75% at 50% 30%, rgba(140, 151, 144, 0.16), transparent 70%),
    linear-gradient(160deg, #101312, #050605);
}
.thumb-brand { display: flex; align-items: center; gap: clamp(8px, 2vw, 12px); }
.thumb-logo {
  width: clamp(36px, 8vw, 54px);
  height: clamp(36px, 8vw, 54px);
  border-radius: clamp(11px, 2.4vw, 16px);
  background: linear-gradient(145deg, #1F2A22, #131814);
  border: 1px solid rgba(163, 230, 53, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: clamp(1rem, 3.4vw, 1.5rem);
  color: var(--primary);
}
.thumb-word { font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 900; letter-spacing: -0.02em; }
.thumb-word span { color: var(--primary); }
.thumb.ended .thumb-logo { border-color: var(--line); color: var(--muted); }
.thumb.ended .thumb-word span { color: var(--muted); }
.thumb-title {
  font-size: clamp(1.15rem, 5vw, 2.3rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.thumb-sub {
  font-size: clamp(0.78rem, 2.4vw, 1rem);
  color: var(--muted);
  font-weight: 600;
  max-width: 90%;
}
.thumb-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--primary-soft);
  border: 1px solid rgba(163, 230, 53, 0.35);
  color: var(--primary);
  border-radius: 999px;
  padding: clamp(5px, 1.2vw, 8px) clamp(10px, 2.4vw, 16px);
  font-size: clamp(0.72rem, 2.2vw, 0.92rem);
  font-weight: 800;
}
.thumb-chip .ic { width: 16px; height: 16px; }
.thumb.ended .thumb-chip { background: var(--surface); border-color: var(--line); color: var(--text); }
.controls {
  margin: 14px 0 clamp(18px, 4vw, 26px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
}
.pill b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill .ic { color: var(--primary); width: 16px; height: 16px; }
.actions { display: flex; gap: 10px; }
.section-title {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  transition: transform 0.15s ease, border-color 0.2s ease;
}
.link-item:hover { border-color: rgba(163, 230, 53, 0.5); }
.link-item:active { transform: scale(0.98); }
.link-item.active { border-color: var(--primary); box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.2); background: linear-gradient(180deg, rgba(163, 230, 53, 0.1), var(--surface)); }
.link-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.play {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--primary);
  color: #0C0F0D;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.play .ic { width: 16px; height: 16px; }
.link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.link-text small { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.hd {
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid rgba(163, 230, 53, 0.35);
  font-size: 0.68rem;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 8px;
  letter-spacing: 0.06em;
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  padding: 30px 16px;
  border: 1px dashed var(--line);
  border-radius: 20px;
}
.empty a { color: var(--primary); font-weight: 800; text-decoration: none; display: inline-block; margin-top: 12px; }
.skeleton {
  height: 170px;
  border-radius: 28px;
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.3s linear infinite;
  margin-bottom: 14px;
}
.skeleton.video { height: auto; aspect-ratio: 16 / 9; border-radius: 22px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--primary);
  color: #0C0F0D;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 11px 20px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 50;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.fx {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  overflow: hidden;
}
.fx-scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.fx-scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.62));
  opacity: 0;
  animation: fxDim 3.2s ease forwards;
}
.fx-word {
  position: relative;
  z-index: 2;
  font-size: clamp(4.5rem, 26vw, 11rem);
  font-weight: 900;
  font-style: italic;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--fc);
  text-shadow: 0 0 32px var(--fc), 0 8px 0 rgba(0, 0, 0, 0.45);
  opacity: 0;
  animation: fxPop 2.6s 0.35s ease-out forwards;
}
.fx-sub {
  position: relative;
  z-index: 2;
  margin-top: 10px;
  font-size: clamp(0.9rem, 4vw, 1.5rem);
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0;
  animation: fxFade 2.3s 0.7s ease-out forwards;
}
.fx-ball {
  position: absolute;
  z-index: 3;
  left: 0;
  width: clamp(28px, 7vw, 44px);
  height: clamp(28px, 7vw, 44px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FF7B7B, #C81E1E 65%, #7F1212);
  box-shadow: 0 0 24px rgba(255, 90, 90, 0.8);
}
.fx-ball::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: 47%;
  height: 2px;
  background: rgba(255, 255, 255, 0.75);
}
.fx-ball.arc { bottom: 16vh; animation: fxArc 1.5s ease-out forwards; }
.fx-ball.ground { bottom: 13vh; animation: fxGround 1.25s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
.fx-ball.hit { top: calc(20vh + clamp(52px, 15vw, 84px)); animation: fxHit 0.45s ease-in forwards; }
.cf {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: 10px;
  height: 16px;
  border-radius: 2px;
  background: var(--c);
  opacity: 0;
  animation: fxConfetti 1.9s ease-out var(--dl) forwards;
}
.fx-rope {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  bottom: calc(13vh - 4px);
  border-top: 4px dotted rgba(244, 246, 244, 0.85);
  opacity: 0;
  animation: fxRope 2s ease forwards;
}
.fx-trail {
  position: absolute;
  z-index: 2;
  left: 0;
  width: 100vw;
  bottom: calc(13vh + clamp(12px, 3vw, 20px));
  height: 5px;
  border-radius: 5px;
  background: linear-gradient(90deg, transparent, var(--fc));
  transform-origin: left center;
  transform: scaleX(0);
  animation: fxTrail 1.25s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
}
.fx-word.slide { animation: fxSlide 2.3s 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
.fx-flash {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: radial-gradient(circle at 50% 40%, rgba(244, 63, 94, 0.7), rgba(244, 63, 94, 0.1) 70%);
  opacity: 0;
  animation: fxFlash 1s 0.4s ease-out forwards;
}
.fx-stumps {
  position: absolute;
  z-index: 2;
  top: 20vh;
  left: 50%;
  width: clamp(100px, 30vw, 190px);
  transform: translateX(-50%);
  overflow: visible;
}
.fx-scene.wicket { animation: fxShake 0.5s 0.42s linear; }
.fx-scene.wicket .fx-word { animation-delay: 0.5s; }
.fx-scene.wicket { justify-content: flex-end; padding-bottom: 20vh; }
.st { transform-box: fill-box; transform-origin: 50% 100%; }
.st rect { fill: #EBD9A8; }
.bail { fill: #F4F6F4; transform-box: fill-box; transform-origin: 50% 50%; }
.s1 { animation: fxS1 1.4s 0.42s ease-in forwards; }
.s2 { animation: fxS2 1.4s 0.42s ease-in forwards; }
.s3 { animation: fxS3 1.4s 0.42s ease-in forwards; }
.b1 { animation: fxB1 1.3s 0.42s ease-out forwards; }
.b2 { animation: fxB2 1.3s 0.42s ease-out forwards; }
@keyframes fxDim { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxPop {
  0% { opacity: 0; transform: scale(0.2) rotate(-10deg); }
  14% { opacity: 1; transform: scale(1.3) rotate(3deg); }
  24% { opacity: 1; transform: scale(1) rotate(0); }
  80% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.25); }
}
@keyframes fxSlide {
  0% { opacity: 0; transform: translateX(-70vw) skewX(-14deg); }
  22% { opacity: 1; transform: translateX(0) skewX(-6deg); }
  30% { transform: translateX(0) skewX(0); }
  78% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(70vw) skewX(-14deg); }
}
@keyframes fxFade {
  0% { opacity: 0; transform: translateY(14px); }
  20% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes fxArc {
  0% { transform: translate(-12vw, 0) scale(1) rotate(0); }
  45% { transform: translate(50vw, -52vh) scale(2.4) rotate(540deg); }
  100% { transform: translate(115vw, -80vh) scale(0.6) rotate(1080deg); }
}
@keyframes fxGround {
  0% { transform: translateX(-12vw) rotate(0); }
  100% { transform: translateX(112vw) rotate(1440deg); }
}
@keyframes fxTrail {
  0% { transform: scaleX(0); opacity: 1; }
  80% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}
@keyframes fxRope { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxConfetti {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(0) scale(0.4); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) + 18vh)) rotate(var(--r)) scale(1); }
}
@keyframes fxHit {
  0% { opacity: 1; transform: translateX(-10vw) rotate(0); }
  95% { opacity: 1; }
  100% { opacity: 0; transform: translateX(calc(50vw - 20px)) rotate(900deg); }
}
@keyframes fxFlash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxShake {
  0%, 100% { transform: translate(0, 0); }
  15% { transform: translate(-10px, 6px); }
  30% { transform: translate(9px, -7px); }
  45% { transform: translate(-8px, -5px); }
  60% { transform: translate(7px, 6px); }
  80% { transform: translate(-4px, 3px); }
}
@keyframes fxS1 {
  0% { transform: none; opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(-60px, 24px) rotate(-75deg); opacity: 0; }
}
@keyframes fxS2 {
  0% { transform: none; opacity: 1; }
  40% { transform: translate(6px, -90px) rotate(20deg); opacity: 1; }
  100% { transform: translate(20px, 40px) rotate(70deg); opacity: 0; }
}
@keyframes fxS3 {
  0% { transform: none; opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(60px, 24px) rotate(75deg); opacity: 0; }
}
@keyframes fxB1 {
  0% { transform: none; opacity: 1; }
  100% { transform: translate(-70px, -90px) rotate(-300deg); opacity: 0; }
}
@keyframes fxB2 {
  0% { transform: none; opacity: 1; }
  100% { transform: translate(70px, -110px) rotate(320deg); opacity: 0; }
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (max-width: 420px) {
  .controls { flex-direction: column; align-items: stretch; }
  .actions { justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .badge.live::before, .skeleton { animation: none; }
  .link-item, .icon-btn, .toast { transition: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="icon-btn" id="backBtn" href="/" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="title">NPL<span>code</span></div>
  </div>
</header>
<main id="app">
  <div class="skeleton"></div>
  <div class="skeleton video"></div>
</main>
<div class="toast" id="toast"></div>
<div class="fx" id="fx"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push, query, limitToLast, onChildAdded, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LINK_COUNT = 2;
const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const BEAT_MS = 20000;
const ACTIVE_MS = 90000;
const PRUNE_MS = 180000;
const FX_COOLDOWN_MS = 1500;
const FX_FRESH_MS = 7000;
const root = document.getElementById("app");
const backBtn = document.getElementById("backBtn");
const toastEl = document.getElementById("toast");
const fxEl = document.getElementById("fx");

const ICON = {
  play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  eye: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  refresh: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
  share: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  flag: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>',
  trophy: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  off: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  spark: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg>'
};

const FX_KINDS = { four: 1, six: 1, wicket: 1 };

function safeDecode(s) {
  try {
    return decodeURIComponent(s);
  } catch (err) {
    return s;
  }
}

function getMatchId() {
  const fromQuery = new URLSearchParams(location.search).get("id");
  if (fromQuery) return fromQuery;
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "match" && parts[1] === "player" && parts[2]) {
    return safeDecode(parts[2]).split(/[&?]/)[0];
  }
  return null;
}

function getLinkNo() {
  let n = parseInt(new URLSearchParams(location.search).get("link"), 10);
  if (!n) {
    const m = safeDecode(location.pathname).match(/[&?]link=?(\d+)/i);
    n = m ? parseInt(m[1], 10) : 1;
  }
  return n >= 1 && n <= LINK_COUNT ? n : 1;
}

const matchId = getMatchId();
let linkNo = getLinkNo();

let teamsData = {};
let match = null;
let loaded = false;
let failed = false;
let viewers = 0;
let presenceData = {};
let serverOffset = 0;
let reloadN = 0;
let lastSignature = "";
let lastPlayerKey = null;
let toastTimer = null;
let fxTimer = null;
let lastSend = 0;
const seenFx = new Set();

function matchUrl() {
  return "/match/" + encodeURIComponent(matchId);
}

function playerUrl(n) {
  return "/match/player/" + encodeURIComponent(matchId) + "?link=" + n;
}

function isHttpUrl(u) {
  return typeof u === "string" && /^https?:\/\//i.test(u.trim());
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function teamName(id) {
  const t = teamsData[id];
  return t && t.name ? t.name : "TBD";
}

function winnerOf(m) {
  return m.winner && (m.winner === m.team1 || m.winner === m.team2) ? m.winner : null;
}

function duration(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h >= 24) {
    const d = Math.floor(h / 24);
    const hh = h % 24;
    return hh ? d + "d " + hh + "h" : d + "d";
  }
  return m ? h + "h " + m + "m" : h + "h";
}

function formatDateTime(ms) {
  return new Date(ms).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function getState(m, now) {
  if (now < m.startTime) return "notstarted";
  if (m.ended !== true && now < m.startTime + LIVE_MS) return "live";
  return "ended";
}

function whenText(m, state, now) {
  if (state === "live") return "Started " + duration(now - m.startTime) + " ago";
  if (state === "notstarted") return "Starts in " + duration(m.startTime - now) + " · " + formatDateTime(m.startTime);
  return "Match ended";
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err2) {
      ok = false;
    }
    ta.remove();
    return ok;
  }
}

async function shareMatch() {
  if (!match || !matchId) return;
  const url = location.origin + matchUrl();
  const title = teamName(match.team1) + " vs " + teamName(match.team2);
  if (navigator.share) {
    try {
      await navigator.share({ title, text: title + " - Watch live on NPLcode", url });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const ok = await copyText(url);
  showToast(ok ? "Match link copied" : url);
}

function confetti(n, colors, base) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 22 + Math.random() * 38;
    const x = Math.cos(a) * d;
    const y = Math.sin(a) * d * 0.9 - 8;
    const r = Math.round(Math.random() * 720 - 360);
    const dl = (base + Math.random() * 0.25).toFixed(2);
    s += '<i class="cf" style="--x:' + x.toFixed(1) + "vw;--y:" + y.toFixed(1) + "vh;--r:" + r + "deg;--c:" + colors[i % colors.length] + ";--dl:" + dl + 's"></i>';
  }
  return s;
}

function fxHtml(kind) {
  if (kind === "six") {
    return '<div class="fx-scene six" style="--fc:#A3E635"><div class="fx-ball arc"></div>' +
      confetti(36, ["#A3E635", "#F4F6F4", "#FACC15", "#38BDF8", "#F43F5E"], 0.55) +
      '<div class="fx-word">SIX</div><div class="fx-sub">Out of the park</div></div>';
  }
  if (kind === "four") {
    return '<div class="fx-scene four" style="--fc:#38BDF8"><div class="fx-rope"></div><div class="fx-trail"></div><div class="fx-ball ground"></div>' +
      '<div class="fx-word slide">FOUR</div><div class="fx-sub">Straight to the rope</div></div>';
  }
  return '<div class="fx-scene wicket" style="--fc:#F43F5E"><div class="fx-flash"></div>' +
    '<svg class="fx-stumps" viewBox="0 0 120 150">' +
    '<g class="st s1"><rect x="16" y="24" width="12" height="120" rx="4"/></g>' +
    '<g class="st s2"><rect x="54" y="24" width="12" height="120" rx="4"/></g>' +
    '<g class="st s3"><rect x="92" y="24" width="12" height="120" rx="4"/></g>' +
    '<rect class="bail b1" x="18" y="16" width="40" height="7" rx="3"/>' +
    '<rect class="bail b2" x="62" y="16" width="40" height="7" rx="3"/></svg>' +
    '<div class="fx-ball hit"></div><div class="fx-word">WICKET</div><div class="fx-sub">Clean bowled</div></div>';
}

function playFx(kind) {
  if (!fxEl || !FX_KINDS[kind]) return;
  clearTimeout(fxTimer);
  fxEl.innerHTML = fxHtml(kind);
  try {
    if (navigator.vibrate) navigator.vibrate(kind === "wicket" ? [120, 60, 200] : 80);
  } catch (err) {}
  fxTimer = setTimeout(() => {
    fxEl.innerHTML = "";
  }, 3500);
}

function sendFx(kind) {
  if (!matchId || !FX_KINDS[kind]) return;
  const now = Date.now();
  if (now - lastSend < FX_COOLDOWN_MS) return;
  lastSend = now;
  const r = push(ref(db, "reactions/" + matchId), { k: kind, t: serverTimestamp() });
  r.catch(() => {
    playFx(kind);
  });
  setTimeout(() => {
    remove(r).catch(() => {});
  }, 12000);
}

function startReactions() {
  const q = query(ref(db, "reactions/" + matchId), limitToLast(1));
  onChildAdded(q, (snap) => {
    const v = snap.val();
    if (!v || !FX_KINDS[v.k]) return;
    if (seenFx.has(snap.key)) return;
    seenFx.add(snap.key);
    const now = Date.now() + serverOffset;
    const t = typeof v.t === "number" ? v.t : now;
    if (Math.abs(now - t) > FX_FRESH_MS) return;
    playFx(v.k);
  }, () => {});
}

if (matchId) backBtn.setAttribute("href", matchUrl());

backBtn.addEventListener("click", (e) => {
  let sameOrigin = false;
  try {
    sameOrigin = document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (err) {
    sameOrigin = false;
  }
  if (sameOrigin && history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

root.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.getAttribute("data-act");
    if (a === "reload") {
      reloadN++;
      render();
      showToast("Stream reloaded");
    }
    if (a === "share") shareMatch();
    if (a === "fab") {
      const box = document.getElementById("react");
      if (box) box.classList.toggle("open");
    }
    if (a === "fx") {
      const box = document.getElementById("react");
      if (box) box.classList.remove("open");
      sendFx(act.getAttribute("data-kind"));
    }
    return;
  }
  const link = e.target.closest("a[data-link]");
  if (!link) return;
  e.preventDefault();
  const n = parseInt(link.getAttribute("data-link"), 10);
  if (!n || n === linkNo) return;
  linkNo = n;
  try {
    history.replaceState(null, "", playerUrl(n));
  } catch (err) {}
  render();
});

function teamHtml(id) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  return `<div class="team"><div class="team-logo">${logo}</div><div class="team-name">${name}</div></div>`;
}

function badgeHtml(state) {
  if (state === "live") return '<span class="badge live">LIVE NOW</span>';
  if (state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
  return '<span class="badge notstarted">NOT STARTED</span>';
}

function thumbBrand() {
  return '<div class="thumb-brand"><div class="thumb-logo">N</div><div class="thumb-word">NPL<span>code</span></div></div>';
}

function thumbNotStarted(m, now) {
  return `
    <div class="thumb">
      ${thumbBrand()}
      <div class="thumb-title">Match not started yet</div>
      <div class="thumb-chip">${ICON.clock}Starts in ${esc(duration(m.startTime - now))}</div>
      <div class="thumb-sub">${esc(formatDateTime(m.startTime))}</div>
    </div>
  `;
}

function thumbEnded(m) {
  const w = winnerOf(m);
  const chip = w
    ? `<div class="thumb-chip">${ICON.trophy}Winner: ${esc(teamName(w))}</div>`
    : `<div class="thumb-chip">${ICON.flag}Full time</div>`;
  return `
    <div class="thumb ended">
      ${thumbBrand()}
      <div class="thumb-title">Match Ended</div>
      ${chip}
      <div class="thumb-sub">Thanks for watching on NPLcode</div>
    </div>
  `;
}

function thumbNoLinks() {
  return `
    <div class="thumb">
      ${thumbBrand()}
      <div class="thumb-title">Stream coming soon</div>
      <div class="thumb-chip">${ICON.off}No links added yet</div>
    </div>
  `;
}

function reactHtml() {
  return `
    <div class="react" id="react">
      <div class="react-menu">
        <button class="rx-btn rx-four" type="button" data-act="fx" data-kind="four" aria-label="Four">4</button>
        <button class="rx-btn rx-six" type="button" data-act="fx" data-kind="six" aria-label="Six">6</button>
        <button class="rx-btn rx-wicket" type="button" data-act="fx" data-kind="wicket" aria-label="Wicket">W</button>
      </div>
      <button class="rx-fab" type="button" data-act="fab" aria-label="Reactions">${ICON.spark}</button>
    </div>
  `;
}

function notFound(text) {
  lastPlayerKey = null;
  root.innerHTML = `<div class="empty">${text}<br><a href="${matchId ? esc(matchUrl()) : "/"}">&#8592; Back</a></div>`;
}

function render() {
  if (failed) {
    notFound("Could not load match. Please check your connection and try again.");
    return;
  }
  if (!loaded) return;
  if (!match || typeof match.startTime !== "number") {
    notFound("Match not found");
    return;
  }

  const now = Date.now();
  const state = getState(match, now);
  document.title = teamName(match.team1) + " vs " + teamName(match.team2) + " - NPLcode";

  if (!document.getElementById("playerSlot")) {
    root.innerHTML = '<div id="bannerSlot"></div><div id="playerSlot"></div><div id="barSlot"></div><div id="linksSlot"></div>';
    lastPlayerKey = null;
  }

  const available = [];
  let activeNo = 0;
  if (state === "live") {
    for (let i = 1; i <= LINK_COUNT; i++) {
      const u = match.links && match.links["link" + i];
      if (isHttpUrl(u)) available.push(i);
    }
    if (available.length) activeNo = available.indexOf(linkNo) !== -1 ? linkNo : available[0];
  }

  document.getElementById("bannerSlot").innerHTML = `
    <div class="banner ${state === "live" ? "live" : ""}">
      <div class="teams">
        ${teamHtml(match.team1)}
        <div class="vs">VS</div>
        ${teamHtml(match.team2)}
      </div>
      <div class="banner-info">
        ${badgeHtml(state)}
        <div class="when">${esc(whenText(match, state, now))}</div>
      </div>
    </div>
  `;

  let playerHtml;
  let playerKey;
  if (state === "live" && activeNo) {
    const src = match.links["link" + activeNo].trim();
    playerKey = "p|" + activeNo + "|" + src + "|" + reloadN;
    playerHtml = `<div class="stage"><div class="player-wrap"><iframe src="${esc(src)}" width="100%" height="100%" style="aspect-ratio:16/9;border:0;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>${reactHtml()}</div>`;
  } else if (state === "live") {
    playerKey = "nolinks";
    playerHtml = thumbNoLinks();
  } else if (state === "ended") {
    playerKey = "ended|" + (match.winner || "");
    playerHtml = thumbEnded(match);
  } else {
    playerKey = "soon|" + duration(match.startTime - now);
    playerHtml = thumbNotStarted(match, now);
  }

  if (playerKey !== lastPlayerKey) {
    document.getElementById("playerSlot").innerHTML = playerHtml;
    lastPlayerKey = playerKey;
  }

  const count = Math.max(1, viewers);
  document.getElementById("barSlot").innerHTML = `
    <div class="controls">
      <div class="pills">
        <span class="pill" title="Currently watching">${ICON.eye}<b>${count}</b> watching now</span>
        ${state === "notstarted" ? `<span class="pill">${ICON.clock}Starts ${esc(new Date(match.startTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}</span>` : ""}
      </div>
      <div class="actions">
        ${state === "live" ? `<button class="icon-btn" type="button" data-act="reload" aria-label="Reload stream" title="Reload stream">${ICON.refresh}</button>` : ""}
        <button class="icon-btn" type="button" data-act="share" aria-label="Share match" title="Share match">${ICON.share}</button>
      </div>
    </div>
  `;

  const items = available.map((i) => {
    const isActive = i === activeNo;
    return `
      <a class="link-item ${isActive ? "active" : ""}" data-link="${i}" href="${esc(playerUrl(i))}">
        <span class="link-left">
          <span class="play">${ICON.play}</span>
          <span class="link-text">Stream ${i}<small>${isActive ? "Now playing" : "Tap to switch"}</small></span>
        </span>
        <span class="hd">HD</span>
      </a>
    `;
  });

  document.getElementById("linksSlot").innerHTML = items.length
    ? `<div class="section-title">Streams</div><div class="links">${items.join("")}</div>`
    : "";
}

function onError() {
  failed = true;
  render();
}

function makeSessionId() {
  const rand = () => Math.random().toString(36).slice(2, 10);
  const fresh = Date.now().toString(36) + rand() + rand();
  try {
    const key = "npl_sid";
    let id = sessionStorage.getItem(key);
    if (!id) {
      id = fresh;
      sessionStorage.setItem(key, id);
    }
    return id;
  } catch (err) {
    return fresh;
  }
}

function entryTime(v) {
  if (v && typeof v === "object") return typeof v.t === "number" ? v.t : 0;
  return typeof v === "number" ? v : 0;
}

function recountViewers() {
  const now = Date.now() + serverOffset;
  let n = 0;
  for (const key of Object.keys(presenceData)) {
    const t = entryTime(presenceData[key]);
    if (t && now - t < ACTIVE_MS) n++;
  }
  if (n !== viewers) {
    viewers = n;
    render();
  }
}

function pruneStale(roomPath) {
  const now = Date.now() + serverOffset;
  for (const key of Object.keys(presenceData)) {
    const t = entryTime(presenceData[key]);
    if (t && now - t > PRUNE_MS) {
      remove(ref(db, roomPath + "/" + key)).catch(() => {});
    }
  }
}

function startPresence() {
  const roomPath = "presence/" + matchId;
  const me = ref(db, roomPath + "/" + makeSessionId());
  let connected = false;
  let warned = false;

  function warn(err) {
    if (warned) return;
    warned = true;
    console.warn("[NPLcode] Viewer count needs Firebase rules for 'presence/{matchId}' (read + write). Error:", err && err.message ? err.message : err);
  }

  function beat() {
    if (!connected) return;
    set(me, { t: serverTimestamp() }).catch(warn);
  }

  onValue(ref(db, ".info/serverTimeOffset"), (snap) => {
    serverOffset = typeof snap.val() === "number" ? snap.val() : 0;
    recountViewers();
  });

  onValue(ref(db, ".info/connected"), (snap) => {
    connected = snap.val() === true;
    if (!connected) return;
    onDisconnect(me).remove().then(beat).catch((err) => {
      warn(err);
      beat();
    });
  });

  onValue(ref(db, roomPath), (snap) => {
    presenceData = snap.val() || {};
    recountViewers();
  }, warn);

  setInterval(beat, BEAT_MS);
  setInterval(() => {
    recountViewers();
    pruneStale(roomPath);
  }, 15000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") beat();
  });
  window.addEventListener("online", beat);
  window.addEventListener("pagehide", () => {
    remove(me).catch(() => {});
  });
  window.addEventListener("pageshow", beat);
}

if (!matchId) {
  loaded = true;
  render();
} else {
  onValue(ref(db, "teams"), (snap) => {
    teamsData = snap.val() || {};
    render();
  }, onError);

  onValue(ref(db, "matches/" + matchId), (snap) => {
    match = snap.val();
    loaded = true;
    failed = false;
    render();
  }, onError);

  startPresence();
  startReactions();

  setInterval(() => {
    if (!match || typeof match.startTime !== "number") return;
    const now = Date.now();
    const st = getState(match, now);
    const sig = st + whenText(match, st, now);
    if (sig !== lastSignature) {
      lastSignature = sig;
      render();
    }
  }, 1000);
}
</script>
</body>
</html>
