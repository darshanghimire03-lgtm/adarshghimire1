<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player - NPLcode</title>
<meta name="theme-color" content="#0C0F0D">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/player.css">
<link rel="stylesheet" href="/css/animation.css">
</head>
<body>
<div data-include="header" data-max="1400px" data-compact data-back></div>
<main id="app">
  <div class="skeleton video"></div>
  <div class="skeleton"></div>
</main>

<div class="sheet" id="shareSheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2 id="shareTitle">Share it to your friends</h2>
      <button class="sheet-x" id="shareClose" type="button" data-close aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <p class="sheet-sub">Invite your friends to watch live matches on NPLcode.</p>
    <div class="share-grid" id="shareGrid"></div>
    <div class="share-link">
      <span id="shareLink"></span>
      <button class="share-copy" id="shareCopy" type="button">Copy</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div data-include="auth-sheet"></div>

<script type="module" src="/js/player.js"></script>
</body>
</html>
