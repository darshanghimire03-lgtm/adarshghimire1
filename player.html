<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player - NPLcode</title>
<meta name="theme-color" content="#0C0F0D">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
:root {
  --bg: #0C0F0D;
  --surface: #151A17;
  --surface-2: #1C231F;
  --primary: #A3E635;
  --primary-soft: rgba(163, 230, 53, 0.12);
  --text: #F4F6F4;
  --muted: #8C9790;
  --line: rgba(255, 255, 255, 0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  background-image: radial-gradient(700px 320px at 50% -100px, rgba(163, 230, 53, 0.12), transparent);
  background-repeat: no-repeat;
}
.ic { width: 18px; height: 18px; flex-shrink: 0; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 15, 13, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top)) clamp(14px, 4vw, 24px) 12px;
}
.bar {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 13px;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.2s ease;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover { border-color: rgba(163, 230, 53, 0.5); }
.title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; flex: 1; }
.title span { color: var(--primary); }
main {
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: clamp(14px, 3vw, 24px) clamp(14px, 4vw, 24px) 48px;
}
.banner {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: clamp(20px, 4vw, 28px);
  padding: clamp(16px, 3.5vw, 26px) clamp(10px, 3vw, 24px) clamp(14px, 3vw, 20px);
  margin-bottom: clamp(14px, 3vw, 20px);
}
.banner.live {
  border-color: rgba(163, 230, 53, 0.6);
  box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.15), 0 14px 50px -16px rgba(163, 230, 53, 0.4);
}
.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: clamp(6px, 2vw, 18px);
  text-align: center;
}
.team { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vw, 12px); min-width: 0; }
.team-logo {
  width: clamp(56px, 15vw, 96px);
  height: clamp(56px, 15vw, 96px);
  border-radius: clamp(16px, 4vw, 26px);
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-weight: 800;
  font-size: clamp(1.3rem, 5vw, 2rem);
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-name {
  font-size: clamp(0.8rem, 2.8vw, 1.05rem);
  font-weight: 800;
  max-width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.vs {
  font-weight: 800;
  font-size: clamp(0.7rem, 2.4vw, 0.85rem);
  color: var(--muted);
  width: clamp(34px, 8vw, 46px);
  height: clamp(34px, 8vw, 46px);
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner-info {
  margin-top: clamp(14px, 3vw, 20px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 14px;
}
.when { font-size: 0.85rem; color: var(--muted); font-weight: 600; text-align: center; }
.badge {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 7px 14px;
  border-radius: 999px;
  letter-spacing: 0.07em;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.badge.live { background: var(--primary); color: #0C0F0D; }
.badge.live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #0C0F0D;
  animation: pulse 1.4s ease-in-out infinite;
}
.badge.notstarted { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.badge.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.stage { position: relative; width: 100%; }
.player-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid var(--line);
  border-radius: clamp(16px, 3vw, 22px);
  overflow: hidden;
  box-shadow: 0 20px 60px -30px rgba(0, 0, 0, 0.9);
}
.player-wrap iframe { display: block; width: 100%; height: 100%; }
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--line);
  border-radius: clamp(16px, 3vw, 22px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.6vw, 12px);
  text-align: center;
  padding: 16px;
  background:
    radial-gradient(60% 75% at 50% 30%, rgba(163, 230, 53, 0.22), transparent 70%),
    linear-gradient(160deg, #111812, #050605);
  box-shadow: 0 20px 60px -30px rgba(0, 0, 0, 0.9);
}
.thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 72%);
}
.thumb > * { position: relative; }
.thumb.ended {
  background:
    radial-gradient(60% 75% at 50% 30%, rgba(140, 151, 144, 0.16), transparent 70%),
    linear-gradient(160deg, #101312, #050605);
}
.thumb-brand { display: flex; align-items: center; gap: clamp(8px, 2vw, 12px); }
.thumb-logo {
  width: clamp(36px, 8vw, 54px);
  height: clamp(36px, 8vw, 54px);
  border-radius: clamp(11px, 2.4vw, 16px);
  background: linear-gradient(145deg, #1F2A22, #131814);
  border: 1px solid rgba(163, 230, 53, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: clamp(1rem, 3.4vw, 1.5rem);
  color: var(--primary);
}
.thumb-word { font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 900; letter-spacing: -0.02em; }
.thumb-word span { color: var(--primary); }
.thumb.ended .thumb-logo { border-color: var(--line); color: var(--muted); }
.thumb.ended .thumb-word span { color: var(--muted); }
.thumb-title {
  font-size: clamp(1.15rem, 5vw, 2.3rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.thumb-sub {
  font-size: clamp(0.78rem, 2.4vw, 1rem);
  color: var(--muted);
  font-weight: 600;
  max-width: 90%;
}
.thumb-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--primary-soft);
  border: 1px solid rgba(163, 230, 53, 0.35);
  color: var(--primary);
  border-radius: 999px;
  padding: clamp(5px, 1.2vw, 8px) clamp(10px, 2.4vw, 16px);
  font-size: clamp(0.72rem, 2.2vw, 0.92rem);
  font-weight: 800;
}
.thumb-chip .ic { width: 16px; height: 16px; }
.thumb.ended .thumb-chip { background: var(--surface); border-color: var(--line); color: var(--text); }
.controls {
  margin: 14px 0 clamp(18px, 4vw, 26px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
}
.pill b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill .ic { color: var(--primary); width: 16px; height: 16px; }
.actions { display: flex; gap: 10px; }
.chat {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: clamp(18px, 3vw, 24px);
  overflow: hidden;
}
.chat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.chat-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.chat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse 1.4s ease-in-out infinite;
}
.chat-count {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 999px;
}
.chat-list {
  height: clamp(260px, 45vh, 420px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 600;
}
.msg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.msg-top { display: flex; align-items: baseline; gap: 8px; }
.msg-name { font-size: 0.82rem; font-weight: 800; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-time { font-size: 0.68rem; color: var(--muted); font-weight: 600; }
.msg-text { font-size: 0.92rem; line-height: 1.4; word-break: break-word; }
.msg.mine .msg-name::after { content: " (you)"; color: var(--muted); font-weight: 600; }
.chat-foot { border-top: 1px solid var(--line); padding: 12px; }
.chat-as {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
  padding: 0 4px;
}
.chat-as b { color: var(--text); font-weight: 800; }
.chat-link {
  background: none;
  border: 0;
  color: var(--primary);
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
}
.chat-form { display: flex; gap: 8px; }
.chat-input {
  flex: 1;
  min-width: 0;
  height: 44px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 16px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
}
.chat-input:focus { border-color: var(--primary); }
.chat-send {
  height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  background: var(--primary);
  color: #0C0F0D;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.chat-send:active { transform: scale(0.95); }
.chat-send .ic { width: 16px; height: 16px; }
.name-box p { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin: 0 4px 10px; }
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  padding: 30px 16px;
  border: 1px dashed var(--line);
  border-radius: 20px;
}
.empty a { color: var(--primary); font-weight: 800; text-decoration: none; display: inline-block; margin-top: 12px; }
.skeleton {
  height: 170px;
  border-radius: 28px;
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.3s linear infinite;
  margin-bottom: 14px;
}
.skeleton.video { height: auto; aspect-ratio: 16 / 9; border-radius: 22px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--primary);
  color: #0C0F0D;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 11px 20px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 50;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (max-width: 420px) {
  .controls { flex-direction: column; align-items: stretch; }
  .actions { justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .badge.live::before, .skeleton, .chat-dot { animation: none; }
  .icon-btn, .toast, .chat-send { transition: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="icon-btn" id="backBtn" href="/" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="title">NPL<span>code</span></div>
  </div>
</header>
<main id="app">
  <div class="skeleton"></div>
  <div class="skeleton video"></div>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push, query, limitToLast, onChildAdded, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LINK_COUNT = 2;
const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const BEAT_MS = 20000;
const ACTIVE_MS = 90000;
const PRUNE_MS = 180000;
const NAME_KEY = "npl_chat_name";
const MAX_NAME = 20;
const MAX_MSG = 200;
const SEND_GAP_MS = 2000;
const KEEP_MSGS = 80;
const root = document.getElementById("app");
const backBtn = document.getElementById("backBtn");
const toastEl = document.getElementById("toast");

const ICON = {
  eye: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  refresh: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
  share: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  flag: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>',
  trophy: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  off: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  send: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>'
};

function safeDecode(s) {
  try {
    return decodeURIComponent(s);
  } catch (err) {
    return s;
  }
}

function getMatchId() {
  const fromQuery = new URLSearchParams(location.search).get("id");
  if (fromQuery) return fromQuery;
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "match" && parts[1] === "player" && parts[2]) {
    return safeDecode(parts[2]).split(/[&?]/)[0];
  }
  return null;
}

function getLinkNo() {
  let n = parseInt(new URLSearchParams(location.search).get("link"), 10);
  if (!n) {
    const m = safeDecode(location.pathname).match(/[&?]link=?(\d+)/i);
    n = m ? parseInt(m[1], 10) : 1;
  }
  return n >= 1 && n <= LINK_COUNT ? n : 1;
}

const matchId = getMatchId();
const linkNo = getLinkNo();

let teamsData = {};
let match = null;
let loaded = false;
let failed = false;
let viewers = 0;
let presenceData = {};
let serverOffset = 0;
let reloadN = 0;
let lastSignature = "";
let lastPlayerKey = null;
let toastTimer = null;

let chatName = loadName();
let editingName = false;
let comments = [];
let lastPost = 0;
const seenComments = new Set();

function matchUrl() {
  return "/match/" + encodeURIComponent(matchId);
}

function isHttpUrl(u) {
  return typeof u === "string" && /^https?:\/\//i.test(u.trim());
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function teamName(id) {
  const t = teamsData[id];
  return t && t.name ? t.name : "TBD";
}

function winnerOf(m) {
  return m.winner && (m.winner === m.team1 || m.winner === m.team2) ? m.winner : null;
}

function duration(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h >= 24) {
    const d = Math.floor(h / 24);
    const hh = h % 24;
    return hh ? d + "d " + hh + "h" : d + "d";
  }
  return m ? h + "h " + m + "m" : h + "h";
}

function formatDateTime(ms) {
  return new Date(ms).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function getState(m, now) {
  if (now < m.startTime) return "notstarted";
  if (m.ended !== true && now < m.startTime + LIVE_MS) return "live";
  return "ended";
}

function whenText(m, state, now) {
  if (state === "live") return "Started " + duration(now - m.startTime) + " ago";
  if (state === "notstarted") return "Starts in " + duration(m.startTime - now) + " · " + formatDateTime(m.startTime);
  return "Match ended";
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err2) {
      ok = false;
    }
    ta.remove();
    return ok;
  }
}

async function shareMatch() {
  if (!match || !matchId) return;
  const url = location.origin + matchUrl();
  const title = teamName(match.team1) + " vs " + teamName(match.team2);
  if (navigator.share) {
    try {
      await navigator.share({ title, text: title + " - Watch live on NPLcode", url });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const ok = await copyText(url);
  showToast(ok ? "Match link copied" : url);
}

function cleanName(s) {
  return String(s || "").replace(/\s+/g, " ").trim().slice(0, MAX_NAME);
}

function loadName() {
  try {
    return cleanName(localStorage.getItem(NAME_KEY));
  } catch (err) {
    return "";
  }
}

function saveName(n) {
  try {
    localStorage.setItem(NAME_KEY, n);
  } catch (err) {}
}

function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsl(" + h + ", 70%, 68%)";
}

function msgTime(t) {
  const ms = typeof t === "number" ? t : Date.now();
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function msgHtml(c, sid) {
  return `
    <div class="msg ${c.s && c.s === sid ? "mine" : ""}">
      <div class="msg-top">
        <span class="msg-name" style="color:${nameColor(c.n)}">${esc(c.n)}</span>
        <span class="msg-time">${esc(msgTime(c.t))}</span>
      </div>
      <div class="msg-text">${esc(c.m)}</div>
    </div>
  `;
}

function renderComments(forceBottom) {
  const list = document.getElementById("chatList");
  if (!list) return;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const sid = makeSessionId();
  list.innerHTML = comments.length
    ? comments.map((c) => msgHtml(c, sid)).join("")
    : '<div class="chat-empty">No comments yet.<br>Be the first to say something!</div>';
  const count = document.getElementById("chatCount");
  if (count) count.textContent = comments.length;
  if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight;
}

function renderChatFoot() {
  const foot = document.getElementById("chatFoot");
  if (!foot) return;
  if (!chatName || editingName) {
    foot.innerHTML = `
      <div class="name-box">
        <p>${editingName && chatName ? "Change your display name" : "Enter a name to join the live chat"}</p>
        <form class="chat-form" id="nameForm" autocomplete="off">
          <input class="chat-input" id="nameInput" type="text" maxlength="${MAX_NAME}" placeholder="Your name" value="${esc(chatName)}" aria-label="Your name">
          <button class="chat-send" type="submit">Join</button>
        </form>
      </div>
    `;
    const input = document.getElementById("nameInput");
    if (input && editingName) input.focus();
    return;
  }
  foot.innerHTML = `
    <div class="chat-as"><span>Chatting as <b>${esc(chatName)}</b></span><button class="chat-link" type="button" data-act="rename">Change name</button></div>
    <form class="chat-form" id="msgForm" autocomplete="off">
      <input class="chat-input" id="msgInput" type="text" maxlength="${MAX_MSG}" placeholder="Write a comment..." aria-label="Write a comment">
      <button class="chat-send" type="submit" aria-label="Send">${ICON.send}Send</button>
    </form>
  `;
}

function initChat() {
  const slot = document.getElementById("chatSlot");
  if (!slot) return;
  slot.innerHTML = `
    <section class="chat">
      <div class="chat-head">
        <div class="chat-title"><span class="chat-dot"></span>Live chat</div>
        <div class="chat-count" id="chatCount">0</div>
      </div>
      <div class="chat-list" id="chatList"></div>
      <div class="chat-foot" id="chatFoot"></div>
    </section>
  `;
  renderChatFoot();
  renderComments(true);
}

function submitName(form) {
  const input = form.querySelector("input");
  const n = cleanName(input ? input.value : "");
  if (!n) {
    showToast("Please enter a name");
    return;
  }
  chatName = n;
  editingName = false;
  saveName(n);
  renderChatFoot();
  const mi = document.getElementById("msgInput");
  if (mi) mi.focus();
}

function submitMessage(form) {
  const input = form.querySelector("input");
  const text = String(input ? input.value : "").replace(/\s+/g, " ").trim().slice(0, MAX_MSG);
  if (!text || !chatName || !matchId) return;
  const now = Date.now();
  if (now - lastPost < SEND_GAP_MS) {
    showToast("Slow down a little");
    return;
  }
  lastPost = now;
  input.value = "";
  push(ref(db, "comments/" + matchId), {
    n: chatName,
    m: text,
    s: makeSessionId(),
    t: serverTimestamp()
  }).catch(() => {
    showToast("Could not send comment");
  });
  const list = document.getElementById("chatList");
  if (list) list.scrollTop = list.scrollHeight;
}

function startChat() {
  const q = query(ref(db, "comments/" + matchId), limitToLast(KEEP_MSGS));
  onChildAdded(q, (snap) => {
    const v = snap.val();
    if (!v || typeof v.m !== "string" || typeof v.n !== "string") return;
    if (seenComments.has(snap.key)) return;
    seenComments.add(snap.key);
    comments.push({
      k: snap.key,
      n: cleanName(v.n) || "Guest",
      m: v.m.slice(0, MAX_MSG),
      s: typeof v.s === "string" ? v.s : "",
      t: typeof v.t === "number" ? v.t : Date.now()
    });
    if (comments.length > KEEP_MSGS) comments.shift();
    renderComments(false);
  }, () => {});
}

if (matchId) backBtn.setAttribute("href", matchUrl());

backBtn.addEventListener("click", (e) => {
  let sameOrigin = false;
  try {
    sameOrigin = document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (err) {
    sameOrigin = false;
  }
  if (sameOrigin && history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

root.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.getAttribute("data-act");
  if (a === "reload") {
    reloadN++;
    render();
    showToast("Stream reloaded");
  }
  if (a === "share") shareMatch();
  if (a === "rename") {
    editingName = true;
    renderChatFoot();
  }
});

root.addEventListener("submit", (e) => {
  const form = e.target;
  if (!form || !form.id) return;
  if (form.id === "nameForm") {
    e.preventDefault();
    submitName(form);
  }
  if (form.id === "msgForm") {
    e.preventDefault();
    submitMessage(form);
  }
});

function teamHtml(id) {
  const t = teamsData[id];
  const name = t && t.name ? esc(t.name) : "TBD";
  const letter = t && t.name ? esc(t.name.charAt(0).toUpperCase()) : "?";
  const logo = t && t.logourl
    ? `<img src="${esc(t.logourl)}" alt="" onerror="this.parentNode.textContent='${letter}'">`
    : letter;
  return `<div class="team"><div class="team-logo">${logo}</div><div class="team-name">${name}</div></div>`;
}

function badgeHtml(state) {
  if (state === "live") return '<span class="badge live">LIVE NOW</span>';
  if (state === "ended") return '<span class="badge ended">MATCH ENDED</span>';
  return '<span class="badge notstarted">NOT STARTED</span>';
}

function thumbBrand() {
  return '<div class="thumb-brand"><div class="thumb-logo">N</div><div class="thumb-word">NPL<span>code</span></div></div>';
}

function thumbNotStarted(m, now) {
  return `
    <div class="thumb">
      ${thumbBrand()}
      <div class="thumb-title">Match not started yet</div>
      <div class="thumb-chip">${ICON.clock}Starts in ${esc(duration(m.startTime - now))}</div>
      <div class="thumb-sub">${esc(formatDateTime(m.startTime))}</div>
    </div>
  `;
}

function thumbEnded(m) {
  const w = winnerOf(m);
  const chip = w
    ? `<div class="thumb-chip">${ICON.trophy}Winner: ${esc(teamName(w))}</div>`
    : `<div class="thumb-chip">${ICON.flag}Full time</div>`;
  return `
    <div class="thumb ended">
      ${thumbBrand()}
      <div class="thumb-title">Match Ended</div>
      ${chip}
      <div class="thumb-sub">Thanks for watching on NPLcode</div>
    </div>
  `;
}

function thumbNoLinks() {
  return `
    <div class="thumb">
      ${thumbBrand()}
      <div class="thumb-title">Stream coming soon</div>
      <div class="thumb-chip">${ICON.off}No links added yet</div>
    </div>
  `;
}

function notFound(text) {
  lastPlayerKey = null;
  root.innerHTML = `<div class="empty">${text}<br><a href="${matchId ? esc(matchUrl()) : "/"}">&#8592; Back</a></div>`;
}

function render() {
  if (failed) {
    notFound("Could not load match. Please check your connection and try again.");
    return;
  }
  if (!loaded) return;
  if (!match || typeof match.startTime !== "number") {
    notFound("Match not found");
    return;
  }

  const now = Date.now();
  const state = getState(match, now);
  document.title = teamName(match.team1) + " vs " + teamName(match.team2) + " - NPLcode";

  if (!document.getElementById("playerSlot")) {
    root.innerHTML = '<div id="bannerSlot"></div><div id="playerSlot"></div><div id="barSlot"></div><div id="chatSlot"></div>';
    lastPlayerKey = null;
    initChat();
  }

  const available = [];
  let activeNo = 0;
  if (state === "live") {
    for (let i = 1; i <= LINK_COUNT; i++) {
      const u = match.links && match.links["link" + i];
      if (isHttpUrl(u)) available.push(i);
    }
    if (available.length) activeNo = available.indexOf(linkNo) !== -1 ? linkNo : available[0];
  }

  document.getElementById("bannerSlot").innerHTML = `
    <div class="banner ${state === "live" ? "live" : ""}">
      <div class="teams">
        ${teamHtml(match.team1)}
        <div class="vs">VS</div>
        ${teamHtml(match.team2)}
      </div>
      <div class="banner-info">
        ${badgeHtml(state)}
        <div class="when">${esc(whenText(match, state, now))}</div>
      </div>
    </div>
  `;

  let playerHtml;
  let playerKey;
  if (state === "live" && activeNo) {
    const src = match.links["link" + activeNo].trim();
    playerKey = "p|" + activeNo + "|" + src + "|" + reloadN;
    playerHtml = `<div class="stage"><div class="player-wrap"><iframe src="${esc(src)}" width="100%" height="100%" style="aspect-ratio:16/9;border:0;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`;
  } else if (state === "live") {
    playerKey = "nolinks";
    playerHtml = thumbNoLinks();
  } else if (state === "ended") {
    playerKey = "ended|" + (match.winner || "");
    playerHtml = thumbEnded(match);
  } else {
    playerKey = "soon|" + duration(match.startTime - now);
    playerHtml = thumbNotStarted(match, now);
  }

  if (playerKey !== lastPlayerKey) {
    document.getElementById("playerSlot").innerHTML = playerHtml;
    lastPlayerKey = playerKey;
  }

  const count = Math.max(1, viewers);
  document.getElementById("barSlot").innerHTML = `
    <div class="controls">
      <div class="pills">
        <span class="pill" title="Currently watching">${ICON.eye}<b>${count}</b> watching now</span>
        ${state === "notstarted" ? `<span class="pill">${ICON.clock}Starts ${esc(new Date(match.startTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}</span>` : ""}
      </div>
      <div class="actions">
        ${state === "live" ? `<button class="icon-btn" type="button" data-act="reload" aria-label="Reload stream" title="Reload stream">${ICON.refresh}</button>` : ""}
        <button class="icon-btn" type="button" data-act="share" aria-label="Share match" title="Share match">${ICON.share}</button>
      </div>
    </div>
  `;
}

function onError() {
  failed = true;
  render();
}

function makeSessionId() {
  const rand = () => Math.random().toString(36).slice(2, 10);
  const fresh = Date.now().toString(36) + rand() + rand();
  try {
    const key = "npl_sid";
    let id = sessionStorage.getItem(key);
    if (!id) {
      id = fresh;
      sessionStorage.setItem(key, id);
    }
    return id;
  } catch (err) {
    return fresh;
  }
}

function entryTime(v) {
  if (v && typeof v === "object") return typeof v.t === "number" ? v.t : 0;
  return typeof v === "number" ? v : 0;
}

function recountViewers() {
  const now = Date.now() + serverOffset;
  let n = 0;
  for (const key of Object.keys(presenceData)) {
    const t = entryTime(presenceData[key]);
    if (t && now - t < ACTIVE_MS) n++;
  }
  if (n !== viewers) {
    viewers = n;
    render();
  }
}

function pruneStale(roomPath) {
  const now = Date.now() + serverOffset;
  for (const key of Object.keys(presenceData)) {
    const t = entryTime(presenceData[key]);
    if (t && now - t > PRUNE_MS) {
      remove(ref(db, roomPath + "/" + key)).catch(() => {});
    }
  }
}

function startPresence() {
  const roomPath = "presence/" + matchId;
  const me = ref(db, roomPath + "/" + makeSessionId());
  let connected = false;
  let warned = false;

  function warn(err) {
    if (warned) return;
    warned = true;
    console.warn("[NPLcode] Viewer count needs Firebase rules for 'presence/{matchId}' (read + write). Error:", err && err.message ? err.message : err);
  }

  function beat() {
    if (!connected) return;
    set(me, { t: serverTimestamp() }).catch(warn);
  }

  onValue(ref(db, ".info/serverTimeOffset"), (snap) => {
    serverOffset = typeof snap.val() === "number" ? snap.val() : 0;
    recountViewers();
  });

  onValue(ref(db, ".info/connected"), (snap) => {
    connected = snap.val() === true;
    if (!connected) return;
    onDisconnect(me).remove().then(beat).catch((err) => {
      warn(err);
      beat();
    });
  });

  onValue(ref(db, roomPath), (snap) => {
    presenceData = snap.val() || {};
    recountViewers();
  }, warn);

  setInterval(beat, BEAT_MS);
  setInterval(() => {
    recountViewers();
    pruneStale(roomPath);
  }, 15000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") beat();
  });
  window.addEventListener("online", beat);
  window.addEventListener("pagehide", () => {
    remove(me).catch(() => {});
  });
  window.addEventListener("pageshow", beat);
}

if (!matchId) {
  loaded = true;
  render();
} else {
  onValue(ref(db, "teams"), (snap) => {
    teamsData = snap.val() || {};
    render();
  }, onError);

  onValue(ref(db, "matches/" + matchId), (snap) => {
    match = snap.val();
    loaded = true;
    failed = false;
    render();
  }, onError);

  startPresence();
  startChat();

  setInterval(() => {
    if (!match || typeof match.startTime !== "number") return;
    const now = Date.now();
    const st = getState(match, now);
    const sig = st + whenText(match, st, now);
    if (sig !== lastSignature) {
      lastSignature = sig;
      render();
    }
  }, 1000);
}
</script>
</body>
