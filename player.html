
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f7fb;--card:#fff;--text:#172033;
--muted:#748096;--border:#e4e8ef;--accent:#2563eb
}
[data-theme=dark]{
--bg:#090d16;--card:#131b2b;--text:#f5f7fb;
--muted:#9eabc0;--border:#26344b
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:950px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
header a{color:var(--accent);text-decoration:none}
.controls{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
button{border:0;padding:11px 16px;border-radius:9px;background:var(--accent);color:white;font-weight:600;cursor:pointer}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
video,iframe{width:100%;height:100%;border:0;display:block;background:#000;object-fit:contain}
iframe{position:absolute;inset:0}
#message{color:var(--muted);text-align:center;padding:25px;background:var(--card);border-radius:10px;margin-top:12px}
.info{margin-top:16px;background:var(--card);border:1px solid var(--border);padding:17px;border-radius:12px}
.info p{color:var(--muted);font-size:13px;margin-top:6px}
.embed{width:100%;margin-top:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:12px;border-radius:8px;min-height:75px;resize:vertical}
.hidden{display:none!important}
</style>
</head>

<body>
<div class="container">

<header>
<a href="javascript:history.back()">← Back</a>
<strong>LIVE PLAYER</strong>
<button id="themeBtn">☾</button>
</header>

<div class="controls">
<button id="fullscreenBtn">⛶ Fullscreen</button>
<button id="refreshBtn">↻ Refresh</button>
</div>

<div class="player" id="player">
<video id="video" controls autoplay muted playsinline></video>
<iframe id="frame"
allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
allowfullscreen
referrerpolicy="strict-origin-when-cross-origin"
class="hidden"></iframe>
</div>

<div id="message">Loading stream...</div>

<div class="info">
<strong>Stream Information</strong>
<p id="streamInfo">Connecting...</p>
</div>

<div class="info">
<strong>Embed Player</strong>
<p>Copy this code to embed this player on another website.</p>
<textarea class="embed" id="embedCode" readonly></textarea>
<button id="copyEmbed">Copy Embed Code</button>
</div>

</div>

<script>
const DATA_URL="https://npl-tv.pages.dev/data.json";

const params=new URLSearchParams(location.search);
const matchId=params.get("match");
const linkId=params.get("id");

const video=document.getElementById("video");
const frame=document.getElementById("frame");
const message=document.getElementById("message");
const player=document.getElementById("player");
const info=document.getElementById("streamInfo");

let hls=null;

function showMessage(text){
message.textContent=text;
message.classList.remove("hidden");
}

function hideMessage(){
message.classList.add("hidden");
}

function destroyPlayer(){
if(hls){
hls.destroy();
hls=null;
}
video.pause();
video.removeAttribute("src");
video.load();
frame.removeAttribute("src");
frame.classList.add("hidden");
video.classList.remove("hidden");
}

function getType(obj,url){
if(obj.type==="hls"||obj.type==="iframe"||
obj.type==="mp4")return obj.type;

if(/\.m3u8(?:$|[?#])/i.test(url))return "hls";
if(/\.mp4(?:$|[?#])/i.test(url))return "mp4";
if(/\.webm(?:$|[?#])/i.test(url))return "mp4";

return "iframe";
}

async function loadStream(){
destroyPlayer();

if(!matchId||!linkId){
showMessage("Missing match ID or stream ID.");
return;
}

showMessage("Loading stream...");

try{
const response=await fetch(DATA_URL+"?t="+Date.now());

if(!response.ok)throw Error("Unable to fetch stream data.");

const data=await response.json();
const match=data[matchId];

if(!match)throw Error("Match not found.");

const selected=linkId==="1"&&match.common?.url
?match.common
:match["link"+linkId];

if(!selected?.url)throw Error("Stream link not found.");

const url=selected.url;

if(!/^https?:\/\//i.test(url)){
throw Error("Invalid stream URL.");
}

const type=getType(selected,url);

info.textContent=selected.name||"Stream "+linkId;

if(type==="hls"){
if(Hls.isSupported()){
hls=new Hls({
enableWorker:true,
maxBufferLength:30
});

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
hideMessage();
video.play().catch(()=>showMessage("Press Play to start streaming."));
});

hls.on(Hls.Events.ERROR,(event,data)=>{
if(data.fatal){
showMessage("Stream playback failed. Try refreshing or another link.");
}
});

}else if(video.canPlayType("application/vnd.apple.mpegurl")){
video.src=url;
video.onloadedmetadata=()=>{
hideMessage();
video.play().catch(()=>showMessage("Press Play to start."));
};
}else{
throw Error("HLS playback is not supported by this browser.");
}

}else if(type==="mp4"){
video.src=url;
video.onloadedmetadata=()=>{
hideMessage();
video.play().catch(()=>showMessage("Press Play to start."));
};
video.onerror=()=>showMessage("Video could not be loaded.");

}else{
video.classList.add("hidden");
frame.classList.remove("hidden");
frame.src=url;
hideMessage();
}

}catch(error){
showMessage(error.message);
}
}

document.getElementById("refreshBtn").onclick=loadStream;

document.getElementById("fullscreenBtn").onclick=async()=>{
try{
if(document.fullscreenElement){
await document.exitFullscreen();
}else if(player.requestFullscreen){
await player.requestFullscreen();
}else if(video.webkitEnterFullscreen){
video.webkitEnterFullscreen();
}
}catch(e){
showMessage("Fullscreen is unavailable in this browser.");
}
};

document.getElementById("themeBtn").onclick=()=>{
const dark=document.documentElement.dataset.theme==="dark";
document.documentElement.dataset.theme=dark?"light":"dark";
localStorage.setItem("playerTheme",dark?"light":"dark");
};

const savedTheme=localStorage.getItem("playerTheme");
document.documentElement.dataset.theme=savedTheme||"dark";

document.getElementById("copyEmbed").onclick=async()=>{
const code=`<iframe src="${location.href}" width="100%" height="400" allowfullscreen></iframe>`;
try{
await navigator.clipboard.writeText(code);
document.getElementById("copyEmbed").textContent="Copied!";
}catch(e){
document.getElementById("embedCode").value=code;
}
};

document.getElementById("embedCode").value=
`<iframe src="${location.href}" width="100%" height="400" allowfullscreen></iframe>`;

loadStream();
</script>
</body>
</html>
