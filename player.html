<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<title>Live Player - NPLcode</title>
<style>
:root{color-scheme:dark;--bg:#080b09;--panel:#151b17;--line:rgba(255,255,255,.09);--lime:#a3e635;--text:#f4f7f4;--muted:#9aa59d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#101511;border-bottom:1px solid var(--line)}
.back{color:var(--text);text-decoration:none;font-size:25px;line-height:1;width:34px}.brand{font-weight:850;font-size:18px}.brand span{color:var(--lime)}.spacer{flex:1}.status{font-size:11px;color:var(--lime);font-weight:800;letter-spacing:.1em}
main{width:min(100%,1000px);margin:auto;padding:20px 14px 30px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.heading h1{font-size:16px;margin:0;font-weight:800}.heading p{font-size:12px;color:var(--muted);margin:4px 0 0}.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;place-items:center}.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}.screen video{object-fit:contain}.message{padding:24px;text-align:center;color:var(--muted);font-size:14px}.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}.tools a{color:var(--lime);text-decoration:none;font-weight:750}.hint{line-height:1.5;margin-top:16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.hint strong{color:var(--text)}
@media(max-width:520px){main{padding:14px 10px 24px}.screen{border-radius:8px}.heading h1{font-size:14px}}
</style>
</head>
<body>
<header class="top"><a class="back" id="back" href="javascript:history.back()" aria-label="Back">&#8592;</a><div class="brand">NPL<span>code</span></div><div class="spacer"></div><div class="status">LIVE PLAYER</div></header>
<main>
  <div class="heading"><div><h1 id="title">Live stream</h1><p id="kind">Loading player…</p></div></div>
  <div class="screen" id="screen"><div class="message">Loading stream…</div></div>
  <div class="tools"><a id="open" href="#" target="_blank" rel="noopener noreferrer">Open source ↗</a><span>Use fullscreen for a larger view</span></div>
  <div class="hint" id="hint" hidden></div>
</main>
<script type="module">
import Hls from "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/+esm";
const params=new URLSearchParams(location.search);
const raw=params.get("src");
const title=params.get("title")||"Live stream";
const screen=document.getElementById("screen");
const hint=document.getElementById("hint");
document.getElementById("title").textContent=title;
document.title=title+" - NPLcode";
function message(text){screen.innerHTML="";const el=document.createElement("div");el.className="message";el.textContent=text;screen.appendChild(el)}
function safeUrl(value){try{const u=new URL(value);return ["http:","https:"].includes(u.protocol)?u.href:null}catch{return null}}
const src=safeUrl(raw||"");
if(!src){message("Invalid or missing stream URL. Return to the match page and choose a stream.");}
else{
 document.getElementById("open").href=src;
 const lower=src.toLowerCase();
 if(/\.m3u8(?:$|[?#])/.test(lower)){
   document.getElementById("kind").textContent="HLS video stream";
   const video=document.createElement("video");video.controls=true;video.autoplay=true;video.playsInline=true;video.setAttribute("webkit-playsinline","");video.preload="metadata";screen.replaceChildren(video);
   if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=src;video.play().catch(()=>{});}
   else if(Hls.isSupported()){const hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)message("Unable to play this stream. It may be offline or its server may block browser playback (CORS).")});}
   else message("This browser does not support HLS playback.");
 }else if(/\.(mp4|webm|ogg)(?:$|[?#])/.test(lower)){
   document.getElementById("kind").textContent="Direct video";
   const video=document.createElement("video");video.controls=true;video.autoplay=true;video.playsInline=true;video.preload="metadata";video.src=src;screen.replaceChildren(video);video.play().catch(()=>{});
 }else if(/\.mpd(?:$|[?#])/.test(lower)){
   document.getElementById("kind").textContent="MPEG-DASH stream";
   const video=document.createElement("video");video.controls=true;video.playsInline=true;video.preload="metadata";screen.replaceChildren(video);
   import("https://cdn.dashjs.org/latest/dash.all.min.js").then(()=>{if(window.dashjs){window.dashjs.MediaPlayer().create().initialize(video,src,true)}else message("DASH player could not be initialized.")}).catch(()=>message("DASH playback is unavailable. DRM-protected streams may require an authorized provider player."));
 }else{
   document.getElementById("kind").textContent="External player page";
   const frame=document.createElement("iframe");frame.src=src;frame.title=title;frame.allow="autoplay; encrypted-media; fullscreen; picture-in-picture";frame.allowFullscreen=true;frame.referrerPolicy="strict-origin-when-cross-origin";frame.loading="eager";screen.replaceChildren(frame);
   hint.hidden=false;hint.innerHTML="<strong>Note:</strong> This source is a webpage/embed, not a direct video file. The player displays the provider's embedded page. NPLcode cannot extract or hide the provider's surrounding website unless that provider supplies a video-only embed URL.";
 }
}
</script>
</body>
</html>
