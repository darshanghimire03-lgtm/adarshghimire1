<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player - NPLcode</title>
<meta name="theme-color" content="#0C0F0D">
<style>
:root {
  --bg: #0C0F0D;
  --surface: #151A17;
  --surface-2: #1C231F;
  --primary: #A3E635;
  --primary-soft: rgba(163, 230, 53, 0.12);
  --text: #F4F6F4;
  --muted: #8C9790;
  --line: rgba(255, 255, 255, 0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  background-image: radial-gradient(600px 300px at 50% -80px, rgba(163, 230, 53, 0.10), transparent);
  background-repeat: no-repeat;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 15, 13, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
}
.bar {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.back {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 13px;
  width: 40px;
  height: 40px;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: transform 0.15s ease;
}
.back:active { transform: scale(0.92); }
.title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; flex: 1; }
.title span { color: var(--primary); }
main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 20px 40px;
}
.player-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 18px;
}
.player-wrap iframe { display: block; width: 100%; height: 100%; }
.match-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.match-name {
  font-size: 1.05rem;
  font-weight: 800;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 7px 15px;
  border-radius: 999px;
  letter-spacing: 0.07em;
  flex-shrink: 0;
}
.badge.live { background: var(--primary); color: #0C0F0D; animation: pulse 1.4s ease-in-out infinite; }
.badge.notstarted { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.badge.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.section-head { margin: 0 0 12px; }
.section-title {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.links { display: flex; flex-direction: column; gap: 12px; }
.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  transition: transform 0.15s ease, border-color 0.2s ease;
}
.link-item:active { transform: scale(0.98); border-color: var(--primary); }
.link-item.active { border-color: var(--primary); box-shadow: 0 0 0 1px rgba(163, 230, 53, 0.2); }
.link-left { display: flex; align-items: center; gap: 12px; }
.play {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--primary);
  color: #0C0F0D;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  padding-left: 2px;
}
.link-text { display: flex; flex-direction: column; gap: 2px; }
.link-text small { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.hd {
  background: var(--primary-soft);
  color: var(--primary);
  border: 1px solid rgba(163, 230, 53, 0.35);
  font-size: 0.68rem;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 8px;
  letter-spacing: 0.06em;
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  padding: 30px 16px;
  border: 1px dashed var(--line);
  border-radius: 20px;
}
.empty a { color: var(--primary); font-weight: 800; text-decoration: none; display: inline-block; margin-top: 12px; }
.skeleton {
  aspect-ratio: 16 / 9;
  border-radius: 20px;
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.3s linear infinite;
  margin-bottom: 14px;
}
.skeleton.small { aspect-ratio: auto; height: 64px; border-radius: 18px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) {
  .badge.live, .skeleton { animation: none; }
  .link-item, .back { transition: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" id="backBtn" href="/" aria-label="Back">&#8592;</a>
    <div class="title">NPL<span>code</span></div>
  </div>
</header>
<main id="app">
  <div class="skeleton"></div>
  <div class="skeleton small"></div>
  <div class="skeleton small"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ramus-7f7aa.firebaseapp.com",
  databaseURL: "https://ramus-7f7aa-default-rtdb.firebaseio.com",
  projectId: "ramus-7f7aa",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LINK_COUNT = 5;
const LIVE_MS = (4 * 60 + 30) * 60 * 1000;
const root = document.getElementById("app");
const backBtn = document.getElementById("backBtn");

function safeDecode(s) {
  try {
    return decodeURIComponent(s);
  } catch (err) {
    return s;
  }
}

function getMatchId() {
  const fromQuery = new URLSearchParams(location.search).get("id");
  if (fromQuery) return fromQuery;
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "match" && parts[1] === "player" && parts[2]) {
    return safeDecode(parts[2]).split(/[&?]/)[0];
  }
  return null;
}

function getLinkNo() {
  let n = parseInt(new URLSearchParams(location.search).get("link"), 10);
  if (!n) {
    const m = safeDecode(location.pathname).match(/[&?]link=?(\d+)/i);
    n = m ? parseInt(m[1], 10) : 1;
  }
  return n >= 1 && n <= LINK_COUNT ? n : 1;
}

const matchId = getMatchId();
let linkNo = getLinkNo();

let teamsData = {};
let match = null;
let loaded = false;
let failed = false;
let lastSignature = "";
let lastPlayerKey = null;

function matchUrl() {
  return "/match/" + encodeURIComponent(matchId);
}

function playerUrl(n) {
  return "/match/player/" + encodeURIComponent(matchId) + "?link=" + n;
}

function isHttpUrl(u) {
  return typeof u === "string" && /^https?:\/\//i.test(u.trim());
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function teamName(id) {
  const t = teamsData[id];
  return t && t.name ? t.name : "TBD";
}

if (matchId) backBtn.setAttribute("href", matchUrl());

backBtn.addEventListener("click", (e) => {
  let sameOrigin = false;
  try {
    sameOrigin = document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (err) {
    sameOrigin = false;
  }
  if (sameOrigin && history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

root.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (!a) return;
  e.preventDefault();
  const n = parseInt(a.getAttribute("data-link"), 10);
  if (!n || n === linkNo) return;
  linkNo = n;
  try {
    history.replaceState(null, "", playerUrl(n));
  } catch (err) {}
  render();
});

function getState(m, now) {
  if (now < m.startTime) return "notstarted";
  if (m.ended !== true && now < m.startTime + LIVE_MS) return "live";
  return "ended";
}

function notFound(text) {
  lastPlayerKey = null;
  root.innerHTML = `<div class="empty">${text}<br><a href="${matchId ? esc(matchUrl()) : "/"}">&#8592; Back</a></div>`;
}

function render() {
  if (failed) {
    notFound("Could not load match. Please check your connection and try again.");
    return;
  }
  if (!loaded) return;
  if (!match || typeof match.startTime !== "number") {
    notFound("Match not found");
    return;
  }

  const state = getState(match, Date.now());
  const name = teamName(match.team1) + " vs " + teamName(match.team2);
  document.title = name + " - NPLcode";

  if (!document.getElementById("playerSlot")) {
    root.innerHTML = '<div id="playerSlot"></div><div id="infoSlot"></div><div id="linksSlot"></div>';
    lastPlayerKey = null;
  }

  const available = [];
  let activeNo = 0;
  if (state === "live") {
    for (let i = 1; i <= LINK_COUNT; i++) {
      const u = match.links && match.links["link" + i];
      if (isHttpUrl(u)) available.push(i);
    }
    if (available.length) activeNo = available.indexOf(linkNo) !== -1 ? linkNo : available[0];
  }

  let playerHtml;
  let playerKey;
  if (activeNo) {
    const src = match.links["link" + activeNo].trim();
    playerKey = "p|" + activeNo + "|" + src;
    playerHtml = `<div class="player-wrap"><iframe src="${esc(src)}" width="100%" height="100%" style="aspect-ratio:16/9;border:0;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  } else if (state === "live") {
    playerKey = "empty-live";
    playerHtml = '<div class="empty" style="margin-bottom:18px">No links added yet</div>';
  } else if (state === "ended") {
    playerKey = "empty-ended";
    playerHtml = '<div class="empty" style="margin-bottom:18px">This match has ended</div>';
  } else {
    playerKey = "empty-soon";
    playerHtml = '<div class="empty" style="margin-bottom:18px">Stream will appear when the match goes live</div>';
  }

  if (playerKey !== lastPlayerKey) {
    document.getElementById("playerSlot").innerHTML = playerHtml;
    lastPlayerKey = playerKey;
  }

  const badge = state === "live"
    ? '<span class="badge live">LIVE NOW</span>'
    : state === "ended"
      ? '<span class="badge ended">MATCH ENDED</span>'
      : '<span class="badge notstarted">NOT STARTED</span>';

  document.getElementById("infoSlot").innerHTML =
    `<div class="match-line"><div class="match-name">${esc(name)}</div>${badge}</div>`;

  const items = available.map((i) => {
    const isActive = i === activeNo;
    return `
      <a class="link-item ${isActive ? "active" : ""}" data-link="${i}" href="${esc(playerUrl(i))}">
        <span class="link-left">
          <span class="play">&#9654;</span>
          <span class="link-text">Stream ${i}<small>${isActive ? "Now playing" : "Tap to switch"}</small></span>
        </span>
        <span class="hd">HD</span>
      </a>
    `;
  });

  document.getElementById("linksSlot").innerHTML = items.length
    ? `<div class="section-head"><div class="section-title">Streams</div></div><div class="links">${items.join("")}</div>`
    : "";
}

function onError() {
  failed = true;
  render();
}

if (!matchId) {
  loaded = true;
  render();
} else {
  onValue(ref(db, "teams"), (snap) => {
    teamsData = snap.val() || {};
    render();
  }, onError);

  onValue(ref(db, "matches/" + matchId), (snap) => {
    match = snap.val();
    loaded = true;
    failed = false;
    render();
  }, onError);

  setInterval(() => {
    if (!match || typeof match.startTime !== "number") return;
    const sig = getState(match, Date.now());
    if (sig !== lastSignature) {
      lastSignature = sig;
      render();
    }
  }, 1000);
}
</script>
</body>
</html>
