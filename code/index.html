<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, #1e0f2e 0%, #0b0b1f 80%);
            animation: breathe 8s infinite alternate ease-in-out;
            z-index: 0;
        }

        @keyframes breathe {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            pointer-events: none;
        }

        .love-message {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff0f5;
            text-shadow: 0 0 20px #ff4d6d, 0 0 40px #b300b3;
            animation: messagePulse 2s infinite alternate;
            pointer-events: none;
            user-select: none;
        }

        .love-message h1 {
            font-size: clamp(2.5rem, 12vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffe6f0, #ffb3c6, #ff4d6d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 15px #ff4d6d);
            margin-bottom: 0.2em;
        }

        .love-message p {
            font-size: clamp(1rem, 3vw, 1.8rem);
            letter-spacing: 0.3em;
            color: #ffccd5;
            opacity: 0.9;
            text-shadow: 0 0 10px #ff4d6d, 0 0 30px #b300b3;
            font-weight: 300;
        }

        @keyframes messagePulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.2); }
        }

        .heart-icon {
            display: inline-block;
            animation: floatHeart 3s infinite ease-in-out;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="love-message">
        <h1>love <span class="heart-icon">❤️</span></h1>
        <p>always & forever</p>
    </div>
    <canvas id="heartCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;

            class Heart {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = height + 20 + Math.random() * 100;
                    this.size = 8 + Math.random() * 18;
                    this.speedY = -(0.6 + Math.random() * 1.6);
                    this.speedX = (Math.random() - 0.5) * 0.6;
                    this.opacity = 0.5 + Math.random() * 0.5;
                    this.angle = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                    const hue = 330 + Math.random() * 40;
                    this.color = `hsl(${hue}, 85%, 70%)`;
                    this.twinkle = Math.random() * Math.PI * 2;
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;
                    this.angle += this.rotationSpeed;

                    if (this.y < height * 0.3) {
                        this.opacity -= 0.002;
                    }

                    if (this.y < -50 || this.x < -50 || this.x > width + 50 || this.opacity <= 0.02) {
                        this.reset();
                        this.y = height + 20 + Math.random() * 80;
                        this.opacity = 0.6 + Math.random() * 0.4;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.scale(1, 1);

                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 18 + Math.sin(this.twinkle) * 6;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;

                    ctx.beginPath();
                    const s = this.size;
                    const topCurveHeight = s * 0.3;

                    ctx.moveTo(0, s * 0.35);

                    ctx.bezierCurveTo(
                        -s * 0.5, -s * 0.1,
                        -s * 0.8, -s * 0.5,
                        -s * 0.3, -s * 0.8
                    );

                    ctx.bezierCurveTo(
                        -s * 0.1, -s * 0.9,
                         s * 0.1, -s * 0.9,
                         s * 0.3, -s * 0.8
                    );

                    ctx.bezierCurveTo(
                        s * 0.8, -s * 0.5,
                        s * 0.5, -s * 0.1,
                        0, s * 0.35
                    );

                    ctx.closePath();

                    const gradient = ctx.createRadialGradient(-s*0.2, -s*0.2, s*0.1, 0, 0, s*1.2);
                    gradient.addColorStop(0, '#ffb3c6');
                    gradient.addColorStop(0.6, this.color);
                    gradient.addColorStop(1, '#ff4d6d');

                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.shadowBlur = 25;
                    ctx.strokeStyle = '#ffe6f0';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    ctx.restore();
                }
            }

            let hearts = [];
            const HEART_COUNT = 70;

            function initCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;

                hearts = [];
                for (let i = 0; i < HEART_COUNT; i++) {
                    const heart = new Heart();
                    heart.y = Math.random() * height * 1.2 - 0.1 * height;
                    heart.x = Math.random() * width;
                    if (heart.y < height * 0.3) heart.opacity = 0.8;
                    hearts.push(heart);
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let heart of hearts) {
                    heart.update();
                    heart.draw();
                }

                requestAnimationFrame(animate);
            }

            function onResize() {
                initCanvas();
            }

            initCanvas();
            animate();

            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    onResize();
                }, 150);
            });

        })();
    </script>
</body>
</html>
