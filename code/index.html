<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Dynamic viewport height for mobile browsers (fixes the URL bar issue) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Log in to Facebook</title>
    <style>
        /* =========================================
           1. DESIGN TOKENS & CSS VARIABLES
           ========================================= */
        :root {
            /* Colors */
            --bg-body: #f0f2f5;
            --bg-app: #ffffff;
            --text-primary: #1c1e21;
            --text-secondary: #65676b;
            --text-placeholder: #8d949e;
            --brand-blue: #0064e0;
            --brand-blue-active: #0052b8;
            --border-color: #ccd0d5;
            --border-focus: #1877f2;
            
            /* Spacing */
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            /* Border Radius */
            --radius-input: 12px;
            --radius-button: 24px;
            
            /* Transitions */
            --transition-fast: 0.2s ease;
        }

        /* =========================================
           2. CSS RESET & BASE STYLES
           ========================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            /* Use dynamic viewport height for mobile */
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Prevent overscroll bounce on desktop */
            overscroll-behavior: none;
        }

        /* =========================================
           3. APP CONTAINER (Responsive Mobile Frame)
           ========================================= */
        .app-container {
            width: 100%;
            height: 100dvh; /* Takes full height on mobile */
            background-color: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Desktop / Tablet Responsive Framing */
        @media (min-width: 480px) {
            .app-container {
                max-width: 420px;
                height: 90dvh;
                max-height: 850px;
                border-radius: 20px;
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.08);
            }
        }

        /* =========================================
           4. HEADER COMPONENT
           ========================================= */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-lg);
            position: relative;
            flex-shrink: 0;
        }

        .btn-close {
            position: absolute;
            left: var(--spacing-lg);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color var(--transition-fast);
        }

        .btn-close:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .btn-close svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        .language-selector {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            gap: 4px;
            padding: 8px;
            border-radius: 8px;
            transition: background-color var(--transition-fast);
        }

        .language-selector:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .language-selector svg {
            width: 12px;
            height: 12px;
            fill: var(--text-secondary);
            margin-top: 2px;
        }

        /* =========================================
           5. MAIN CONTENT COMPONENT
           ========================================= */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 var(--spacing-lg);
            justify-content: center;
            /* Adjusts spacing to perfectly match screenshot */
            margin-top: -5vh; 
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-xl);
        }

        .logo-wrapper svg {
            width: 68px;
            height: 68px;
        }

        /* Form Styles */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            font-size: 16px; /* Prevents iOS auto-zoom */
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-input);
            color: var(--text-primary);
            background-color: var(--bg-app);
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-field::placeholder {
            color: var(--text-placeholder);
        }

        .input-field:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px var(--border-focus);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            background-color: var(--brand-blue);
            color: var(--bg-app);
            border: none;
            border-radius: var(--radius-button);
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color var(--transition-fast), transform 0.1s;
        }

        .btn-primary:active {
            background-color: var(--brand-blue-active);
            transform: scale(0.98);
        }

        .link-forgot {
            display: block;
            text-align: center;
            margin-top: var(--spacing-md);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            padding: 8px;
            transition: color var(--transition-fast);
        }

        .link-forgot:hover {
            color: var(--brand-blue);
            text-decoration: underline;
        }

        /* =========================================
           6. FOOTER COMPONENT
           ========================================= */
        .app-footer {
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
            flex-shrink: 0;
            /* Account for iPhone home indicator */
            padding-bottom: max(var(--spacing-lg), env(safe-area-inset-bottom));
        }

        .btn-outline {
            width: 100%;
            background-color: transparent;
            color: var(--brand-blue);
            border: 1px solid var(--brand-blue);
            border-radius: var(--radius-button);
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            transition: background-color var(--transition-fast), transform 0.1s;
        }

        .btn-outline:hover {
            background-color: rgba(0, 100, 224, 0.04);
        }

        .btn-outline:active {
            background-color: rgba(0, 100, 224, 0.1);
            transform: scale(0.98);
        }

        .meta-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }

        .meta-branding svg {
            width: 28px;
            height: 28px;
            fill: var(--brand-blue);
        }

        .meta-text {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
    </style>
</head>
<body>

    <div class="app-container" role="main">
        
        <!-- Header -->
        <header class="app-header">
            <button class="btn-close" aria-label="Close">
                <svg viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            
            <div class="language-selector" role="button" aria-haspopup="listbox" tabindex="0">
                <span>English (UK)</span>
                <svg viewBox="0 0 24 24">
                    <path d="M7 10l5 5 5-5z"/>
                </svg>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <div class="logo-wrapper">
                <!-- Facebook Logo SVG -->
                <svg viewBox="0 0 36 36" fill="#0064e0" aria-label="Facebook Logo">
                    <path d="M18 0C8.06 0 0 8.06 0 18c0 8.95 6.54 16.38 15.1 17.74V23.1h-4.54v-5.27h4.54v-3.91c0-4.5 2.68-6.99 6.78-6.99 1.96 0 4.02.35 4.02.35v4.42h-2.27c-2.23 0-2.93 1.39-2.93 2.81v3.37h5.02l-.8 5.27h-4.22v12.64C29.46 34.38 36 26.95 36 18c0-9.94-8.06-18-18-18z"/>
                </svg>
            </div>

            <form class="login-form" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Mobile number or email address" autocomplete="username" aria-label="Mobile number or email address">
                </div>
                
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="Password" autocomplete="current-password" aria-label="Password">
                </div>
                
                <button type="submit" class="btn-primary">Log in</button>
            </form>

            <a href="#" class="link-forgot">Forgotten password?</a>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <button type="button" class="btn-outline">Create new account</button>
            
            <div class="meta-branding">
                <!-- Meta Logo SVG -->
                <svg viewBox="0 0 1000 1000" aria-label="Meta Logo">
                    <path d="M500 250c-69.3 0-113.3 30-154.7 86.7L252 469.3C206.7 533.3 172 570 132 570c-48 0-85.3-38-85.3-94.7 0-56 37.3-94.7 85.3-94.7 38.7 0 69.3 24 105.3 70.7L280 408c-50.7-62.7-100-94.7-164.7-94.7C53.3 313.3 0 376 0 475.3 0 574.7 53.3 636 115.3 636c66.7 0 114.7-41.3 164.7-109.3l77.3-109.3C393.3 366.7 426.7 344 468 344c61.3 0 96 48 96 126.7 0 78.7-34.7 126.7-96 126.7-34.7 0-66.7-16-104.7-58.7l-47.3 56c52 56 96 81.3 152 81.3 106.7 0 180-78.7 180-205.3 0-126.7-73.3-205.3-180-205.3H468c-53.3 0-96 29.3-141.3 88l-64 84c-40 52-64 72-92 72-28 0-48-21.3-48-56 0-34.7 20-56 48-56 25.3 0 45.3 14.7 72 49.3l52-60C256 354.7 217.3 330 173.3 330 106.7 330 56 390.7 56 480c0 89.3 50.7 150 117.3 150 50.7 0 90.7-28 140-93.3l69.3-90.7C430.7 384 468 362.7 512 362.7c88 0 141.3 69.3 141.3 181.3 0 112-53.3 181.3-141.3 181.3-46.7 0-84-20-129.3-69.3l-48 56c56 60 109.3 85.3 174.7 85.3 128 0 218.7-101.3 218.7-253.3 0-152-90.7-253.3-218.7-253.3z"/>
                </svg>
                <span class="meta-text">Meta</span>
            </div>
        </footer>

    </div>

</body>
</html>
