<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | NPLcode</title>
<meta name="theme-color" content="#101211">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #101211;
  --surface: #1B211E;
  --primary: #A3E635;
  --text: #F5F5F5;
  --muted: #9AA39E;
  --line: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: rgba(16, 18, 17, 0.95);
  border-bottom: 1px solid var(--line);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid rgba(163, 230, 53, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: var(--primary);
}
header h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
header h1 span { color: var(--primary); }
main {
  flex: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 36px 24px;
  text-align: center;
}
.code {
  font-size: 5rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--primary);
  margin-bottom: 16px;
}
.card h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
.card p {
  font-size: 0.95rem;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 24px;
}
.actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-block;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  padding: 12px 22px;
  border-radius: 999px;
  text-decoration: none;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: var(--primary);
  color: #101211;
  border: 1px solid var(--primary);
}
.btn.ghost {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
}
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <h1>NPL<span>code</span></h1>
</header>
<main>
  <div class="card">
    <div class="code">404</div>
    <h2>Page not found</h2>
    <p>The page you are looking for doesn't exist or the match link is no longer available.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to matches</a>
      <button class="btn ghost" type="button" onclick="history.length > 1 ? history.back() : location.href = '/'">Go back</button>
    </div>
  </div>
</main>
</body>
</html>
