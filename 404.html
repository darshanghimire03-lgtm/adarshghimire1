<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Durbar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0d0d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #redirecting, #genericNotFound {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    text-align: center; padding: 32px;
  }
  #redirecting.show, #genericNotFound.show { display: flex; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #redirecting p { opacity: 0.75; font-size: 14px; }
  #redirecting a, #genericNotFound a {
    color: #fff; font-size: 14px; text-decoration: underline;
  }
  #genericNotFound h1 { font-size: 26px; }
  #genericNotFound p { opacity: 0.7; font-size: 14.5px; }
</style>
</head>
<body>

<div id="redirecting">
  <div class="spinner"></div>
  <p>Opening short…</p>
  <a id="manualLink" href="#">Tap here if not redirected</a>
</div>

<div id="genericNotFound">
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist.</p>
  <a href="/">Go to homepage</a>
</div>

<script>
(function () {
  var path = window.location.pathname || "";
  var search = window.location.search || "";

  // Match: /durbar/shorts/<id>  OR  /shorts/<id>  (in case)
  var match = path.match(/\/shorts\/([^\/?#]+)/i);
  var shortId = match ? decodeURIComponent(match[1]) : null;

  // Fallback: ?id=<id>
  if (!shortId) {
    var q = new URLSearchParams(search);
    if (q.get("id")) shortId = q.get("id");
  }

  if (shortId) {
    var target = "/durbar/shorts/?id=" + encodeURIComponent(shortId);

    var redir = document.getElementById("redirecting");
    redir.classList.add("show");
    document.getElementById("manualLink").href = target;

    try {
      window.location.replace(target);
    } catch (e) {
      window.location.href = target;
    }
  } else {
    document.getElementById("genericNotFound").classList.add("show");
  }
})();
</script>

</body>
</html>
