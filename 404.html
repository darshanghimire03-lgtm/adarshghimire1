<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #eef1f6 60%, #e4e8f0 100%);
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Layout ===== */
  .page {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 32px;
    text-align: center;
  }
  .page.show { display: flex; }

  /* ===== Background blobs ===== */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  .blob.one {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #ffd9a8, transparent 70%);
    top: -80px; left: -80px;
    animation: float1 14s ease-in-out infinite;
  }
  .blob.two {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #b8d8ff, transparent 70%);
    bottom: -140px; right: -100px;
    animation: float2 16s ease-in-out infinite;
  }
  .blob.three {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #ffc9e0, transparent 70%);
    top: 45%; right: 18%;
    animation: float3 18s ease-in-out infinite;
  }
  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px, 40px) scale(1.1); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-40px, -30px) scale(1.08); }
  }
  @keyframes float3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-20px, 30px) scale(1.15); }
  }

  /* ===== Content ===== */
  .content {
    position: relative;
    z-index: 2;
    max-width: 460px;
    width: 100%;
  }

  /* ===== 404 STAGE ===== */
  .stage {
    position: relative;
    width: 100%;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  /* Shockwave rings */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px solid rgba(245, 158, 11, 0.55);
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    animation: blastRing 3s ease-out infinite;
    pointer-events: none;
  }
  .ring.delay1 { animation-delay: 0.6s; border-color: rgba(239, 68, 68, 0.45); }
  .ring.delay2 { animation-delay: 1.2s; border-color: rgba(59, 130, 246, 0.4); }
  .ring.delay3 { animation-delay: 1.8s; border-color: rgba(168, 85, 247, 0.4); }

  @keyframes blastRing {
    0% {
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
      border-width: 4px;
    }
    15% { opacity: 1; }
    100% {
      transform: translate(-50%, -50%) scale(2.6);
      opacity: 0;
      border-width: 1px;
    }
  }

  /* Glow orb */
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 260px; height: 260px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 200, 100, 0.45) 0%, rgba(255, 120, 120, 0.25) 40%, transparent 70%);
    filter: blur(30px);
    animation: pulseGlow 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulseGlow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.75; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  /* ===== BIG 404 ===== */
  .big-404 {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: clamp(96px, 30vw, 156px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
    animation: magicIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }

  .big-404 .digit {
    display: inline-block;
    background: linear-gradient(135deg, #111 0%, #555 45%, #111 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out 1s infinite;
  }

  .big-404 .zero {
    background: conic-gradient(from 0deg, #f59e0b, #ef4444, #a855f7, #3b82f6, #f59e0b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: spinZero 4s linear infinite;
    transform-origin: center;
    will-change: transform;
  }

  @keyframes magicIn {
    0% { opacity: 0; transform: scale(0.4) rotate(-8deg); filter: blur(14px); }
    60% { opacity: 1; transform: scale(1.12) rotate(2deg); filter: blur(0); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes spinZero {
    to { transform: rotate(360deg); }
  }

  /* Sparks */
  .spark {
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.9);
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: sparkFly 2.8s ease-out infinite;
    pointer-events: none;
  }
  .spark:nth-child(2n) { background: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,0.9); animation-delay: 0.15s; }
  .spark:nth-child(3n) { background: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.9); animation-delay: 0.3s; }
  .spark:nth-child(5n) { background: #3b82f6; box-shadow: 0 0 12px rgba(59,130,246,0.9); animation-delay: 0.5s; }

  @keyframes sparkFly {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(0, 0) scale(0.4); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.2); }
  }

  /* Twinkles */
  .twinkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff, 0 0 16px #f59e0b;
    opacity: 0;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* ===== Title + text ===== */
  .title {
    font-size: 24px;
    font-weight: 800;
    color: #111;
    margin: 8px 0 10px;
    letter-spacing: -0.4px;
    animation: fadeUp 0.7s ease 0.5s both;
  }
  .subtitle {
    font-size: 15px;
    color: #666;
    line-height: 1.55;
    margin-bottom: 26px;
    animation: fadeUp 0.7s ease 0.65s both;
  }

  /* ===== Button ===== */
  .home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    animation: fadeUp 0.7s ease 0.8s both;
    position: relative;
    overflow: hidden;
  }
  .home-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -150%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: sweep 3s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 60% { left: -150%; }
    100% { left: 150%; }
  }
  .home-btn:hover {
    background: #000;
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.22);
  }
  .home-btn:active {
    transform: translateY(0) scale(0.98);
  }
  .home-btn svg { width: 16px; height: 16px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Redirecting view ===== */
  .spinner {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.08);
    border-top-color: #f59e0b;
    border-right-color: #ef4444;
    border-bottom-color: #a855f7;
    animation: spin 0.9s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .redirecting-text {
    font-size: 15px;
    color: #555;
    margin-bottom: 6px;
  }
  .manual-link {
    font-size: 13px;
    color: #999;
    text-decoration: underline;
    margin-top: 10px;
    display: inline-block;
  }
  .manual-link:hover { color: #111; }

  /* ===== Wand sparkles ===== */
  .wand {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(245,158,11,0.9), transparent 60%),
      radial-gradient(2px 2px at 80% 20%, rgba(239,68,68,0.8), transparent 60%),
      radial-gradient(2px 2px at 65% 75%, rgba(59,130,246,0.8), transparent 60%),
      radial-gradient(2px 2px at 35% 85%, rgba(168,85,247,0.8), transparent 60%),
      radial-gradient(1.5px 1.5px at 10% 60%, rgba(245,158,11,0.7), transparent 60%),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(239,68,68,0.7), transparent 60%);
    animation: wandTwinkle 4s ease-in-out infinite;
    opacity: 0.9;
  }
  @keyframes wandTwinkle {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }
</style>
</head>
<body>

<!-- Soft background blobs -->
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<!-- Wand sparkles -->
<div class="wand"></div>

<!-- Redirecting view -->
<div id="redirecting" class="page">
  <div class="content">
    <div class="spinner"></div>
    <div class="redirecting-text">Opening short…</div>
    <a id="manualLink" class="manual-link" href="#">Tap here if not redirected</a>
  </div>
</div>

<!-- 404 view -->
<div id="genericNotFound" class="page">
  <div class="content">
    <div class="stage">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="ring delay1"></div>
      <div class="ring delay2"></div>
      <div class="ring delay3"></div>

      <!-- Clean 404: each digit is its own span so no extra "0" appears -->
      <div class="big-404">
        <span class="digit">4</span>
        <span class="digit zero">0</span>
        <span class="digit">4</span>
      </div>

      <!-- Sparks -->
      <div class="spark" style="--tx:-160px; --ty:-40px;"></div>
      <div class="spark" style="--tx:160px;  --ty:-40px;"></div>
      <div class="spark" style="--tx:-140px; --ty:60px;"></div>
      <div class="spark" style="--tx:140px;  --ty:60px;"></div>
      <div class="spark" style="--tx:0px;    --ty:-140px;"></div>
      <div class="spark" style="--tx:0px;    --ty:140px;"></div>
      <div class="spark" style="--tx:-120px; --ty:-120px;"></div>
      <div class="spark" style="--tx:120px;  --ty:-120px;"></div>
      <div class="spark" style="--tx:-120px; --ty:120px;"></div>
      <div class="spark" style="--tx:120px;  --ty:120px;"></div>
      <div class="spark" style="--tx:-180px; --ty:0px;"></div>
      <div class="spark" style="--tx:180px;  --ty:0px;"></div>

      <!-- Twinkles -->
      <div class="twinkle" style="top:10%; left:15%; animation-delay:0s;"></div>
      <div class="twinkle" style="top:80%; left:20%; animation-delay:0.6s;"></div>
      <div class="twinkle" style="top:20%; left:85%; animation-delay:1.2s;"></div>
      <div class="twinkle" style="top:75%; left:80%; animation-delay:1.8s;"></div>
      <div class="twinkle" style="top:50%; left:5%;  animation-delay:0.9s;"></div>
      <div class="twinkle" style="top:50%; left:95%; animation-delay:1.5s;"></div>
    </div>

    <h1 class="title">Lost in the spell</h1>
    <p class="subtitle">
      This page vanished in a puff of magic — it may have moved or never existed.
    </p>

    <a href="/" class="home-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12l9-9 9 9"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      Take me home
    </a>
  </div>
</div>

<script>
(function () {
  var path = window.location.pathname || "";
  var search = window.location.search || "";

  // Match: /durbar/shorts/<id>  OR  /shorts/<id>
  var match = path.match(/\/shorts\/([^\/?#]+)/i);
  var shortId = match ? decodeURIComponent(match[1]) : null;

  // Fallback: ?id=<id>
  if (!shortId) {
    var q = new URLSearchParams(search);
    if (q.get("id")) shortId = q.get("id");
  }

  if (shortId) {
    var target = "/durbar/shorts/?id=" + encodeURIComponent(shortId);

    document.getElementById("redirecting").classList.add("show");
    document.getElementById("manualLink").href = target;

    try {
      window.location.replace(target);
    } catch (e) {
      window.location.href = target;
    }
  } else {
    document.getElementById("genericNotFound").classList.add("show");
  }
})();
</script>

</body>
</html>
