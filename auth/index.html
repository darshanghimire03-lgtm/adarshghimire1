<meta charset="UTF-8" />

<title>Multi-Stream Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #0f0f13; color: #e8e8ee;
  }
  header {
    padding: 12px 16px; background: #16161d; border-bottom: 1px solid #24242e;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  select, button {
    background: #22222b; color: #e8e8ee; border: 1px solid #333;
    padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #2c2c38; }
  #status { font-size: 12px; color: #9aa; margin-left: auto; }
  .player-wrap {
    position: relative; width: 100%; max-width: 1100px; margin: 16px auto;
    aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden;
    border: 1px solid #24242e;
  }
  .player-wrap iframe, .player-wrap video {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .links {
    max-width: 1100px; margin: 0 auto 40px; padding: 0 16px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .links a {
    background: #1c1c25; color: #9ecbff; text-decoration: none;
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    border: 1px solid #2a2a36; word-break: break-all;
  }
  .links a:hover { background: #262633; }
  .err {
    padding: 20px; color: #ff8a8a; font-family: monospace; font-size: 13px;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>

<header>
  <h1>Stream Player</h1>
  <select id="eventSel"></select>
  <select id="linkSel"></select>
  <button id="loadBtn">▶ Load</button>
  <button id="extractBtn">⤓ Extract iframe</button>
  <span id="status">Ready</span>
</header>

<div class="player-wrap" id="playerWrap">
  <div class="err" id="playerMsg">Select an event and a link, then press Load.</div>
</div>

<div class="links" id="linksBox"></div>

    "link4": { "type": "hls", "url": "https://live05.miekgo.app/live/18812304.m3u8" },
    "link5": { "type": "hls", "url": "https://live05.miekgo.app/live/18812304.m3u8" },
    "link6": null, "link7": null
  }
};

/* =========================================================
   DOM refs
   ========================================================= */
const eventSel  = document.getElementById('eventSel');
const linkSel   = document.getElementById('linkSel');
const loadBtn   = document.getElementById('loadBtn');
const extractBtn= document.getElementById('extractBtn');
const wrap      = document.getElementById('playerWrap');
const statusEl  = document.getElementById('status');
const linksBox  = document.getElementById('linksBox');

let currentPlayer = null; // { destroy() } — dash or hls instance

/* =========================================================
   Populate event selector
   ========================================================= */
Object.keys(DATA).sort().forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = key;
  eventSel.appendChild(opt);
});

function populateLinks() {
  const ev = eventSel.value;
  const entry = DATA[ev] || {};
  linkSel.innerHTML = '';

  // if there's a "common", always add it as the top option
  if (entry.common) {
    const opt = document.createElement('option');
    opt.value = 'common';
    opt.textContent = `common (${entry.common.type})`;
    linkSel.appendChild(opt);
  }

  for (let i = 1; i <= 7; i++) {
    const k = 'link' + i;
    if (entry[k]) {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = `${k} (${entry[k].type})`;
      linkSel.appendChild(opt);
    }
  }
  // If no options, add a placeholder
  if (!linkSel.options.length) {
    const opt = document.createElement('option');
    opt.textContent = '(no streams)';
    opt.disabled = true;
    linkSel.appendChild(opt);
  }
}

eventSel.addEventListener('change', populateLinks);
populateLinks();

/* =========================================================
   iframe-URL extractor
   For URLs like:
     https://npl-tv.pages.dev/mdpplyrr?manifest=<MPD>&keyid=<KID>&key=<KEY>
   returns:
     { manifest: "...", keyid: "...", key: "..." }
   For plain embed URLs (taifood-blog.asia etc.):
   returns:
     { embed: "<full url>" }
   ========================================================= */
function extractIframe(url) {
  try {
    const u = new URL(url);
    const manifest = u.searchParams.get('manifest');
    const keyid    = u.searchParams.get('keyid');
    const key      = u.searchParams.get('key');

    if (manifest) {
      return { manifest, keyid, key };
    }
    // If it's an /iplyrr?...src=... wrapper, expose the inner src
    const src = u.searchParams.get('src');
    if (src) return { embed: src };

    return { embed: url };
  } catch {
    return { embed: url };
  }
}

/* =========================================================
   Player renderer
   ========================================================= */
function clearPlayer() {
  if (currentPlayer && typeof currentPlayer.destroy === 'function') {
    try { currentPlayer.destroy(); } catch {}
  }
  currentPlayer = null;
  wrap.innerHTML = '';
}

function setMsg(text) {
  const d = document.createElement('div');
  d.className = 'err';
  d.textContent = text;
  wrap.appendChild(d);
}

function renderHls(url) {
  clearPlayer();
  const video = document.createElement('video');
  video.controls = true;
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  wrap.appendChild(video);

  if (window.Hls && window.Hls.isSupported()) {
    const hls = new Hls({ lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        setMsg('HLS fatal error: ' + data.type + '\n' + (data.details || ''));
      }
    });
    currentPlayer = hls;
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    currentPlayer = { destroy: () => { video.pause(); video.src = ''; } };
  } else {
    setMsg('HLS not supported by this browser.');
  }
  statusEl.textContent = 'HLS: ' + url.slice(0, 70) + '…';
}

function renderDash(manifest, keyid, key) {
  clearPlayer();
  const video = document.createElement('video');
  video.controls = true;
  video.autoplay = true;
  video.muted = true;
  wrap.appendChild(video);

  const player = dashjs.MediaPlayer().create();

  // if DRM key is provided (Widevine CENC)
  if (keyid && key) {
    player.setProtectionData({
      'com.widevine.alpha': {
        serverURL: undefined, // offline key — no license server
        httpRequestHeaders: {},
        // Static CLEARKEY-style key: dash.js accepts 'clearkey'
        // For Widevine CENC with static key, you'd normally need
        // a license server. We try clearkey fallback.
      },
      'org.w3.clearkey': {
        // 'key' must be JSON stringified { kids: [ kid_b64 ], key: key_b64 }
        // Convert hex → base64url
        serverURL: 'data:application/json;base64,' + btoa(JSON.stringify({
          keys: [{ kty: 'oct', kid: b64urlFromHex(keyid), k: b64urlFromHex(key) }],
          type: 'temporary'
        }))
      }
    });
  }

  player.initialize(video, manifest, true);
  player.on('error', (e) => {
    setMsg('DASH error: ' + (e.error ? e.error.message : JSON.stringify(e)));
  });
  currentPlayer = { destroy: () => player.reset() };
  statusEl.textContent = 'DASH: ' + manifest.slice(0, 70) + '…';
}

function b64urlFromHex(hex) {
  try {
    const bytes = hex.match(/.{1,2}/g).map(h => parseInt(h, 16));
    const bin   = String.fromCharCode(...bytes);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch {
    return hex;
  }
}

function renderIframe(url) {
  clearPlayer();
  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  iframe.allowFullscreen = true;
  wrap.appendChild(iframe);
  statusEl.textContent = 'Iframe: ' + url.slice(0, 70) + '…';
}

/* =========================================================
   Load button
   ========================================================= */
loadBtn.addEventListener('click', () => {
  const ev  = eventSel.value;
  const lk  = linkSel.value;
  const entry = DATA[ev] && DATA[ev][lk];

  // rebuild links box
  linksBox.innerHTML = '';
  if (entry && entry.url) {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = '🔗 ' + entry.type + ': ' + entry.url;
    a.addEventListener('click', e => {
      e.preventDefault();
      // copy to clipboard
      navigator.clipboard.writeText(entry.url).then(() => {
        statusEl.textContent = 'Copied URL to clipboard.';
      });
    });
    linksBox.appendChild(a);
  }

  if (!entry) {
    clearPlayer();
    setMsg('No stream defined for ' + ev + ' / ' + lk);
    statusEl.textContent = 'Empty entry';
    return;
  }

  switch (entry.type) {
    case 'hls':
      renderHls(entry.url);
      break;
    case 'iframe':
      renderIframe(entry.url);
      break;
    case 'redirect':
      // Redirect to the URL directly
      statusEl.textContent = 'Redirecting…';
      window.location.href = entry.url;
      break;
    case 'dash':
      renderDash(entry.url);
      break;
    default:
      setMsg('Unknown type: ' + entry.type);
  }
});

/* =========================================================
   Extract iframe button
   ========================================================= */
extractBtn.addEventListener('click', () => {
  const ev = eventSel.value;
  const lk = linkSel.value;
  const entry = DATA[ev] && DATA[ev][lk];
  if (!entry) {
    statusEl.textContent = 'Nothing to extract.';
    return;
  }
  const result = extractIframe(entry.url);
  statusEl.textContent = 'Extracted. Opening in console & clipboard.';
  console.log('Extracted from', entry.url, '→', result);
  navigator.clipboard.writeText(JSON.stringify(result, null, 2)).catch(()=>{});
  // Also show a quick preview
  alert('Extracted:\n\n' + JSON.stringify(result, null, 2));
});

/* =========================================================
   Auto-load first option for convenience
   ========================================================= */
if (Object.keys(DATA).length) {
  eventSel.value = Object.keys(DATA).sort()[0];
  populateLinks();
  setTimeout(() => loadBtn.click(), 200);
}
</script>
</body>
</html>
