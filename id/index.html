<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Binary Long Division Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #f0ede3;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    background: #fffdf7;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  h2 {
    text-align: center;
    color: #333;
    margin-top: 0;
  }
  .inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .inputs > div {
    flex: 1;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    border: 2px solid #ccc;
    border-radius: 6px;
    text-align: center;
    letter-spacing: 2px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #7b3fa0;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  button:hover { background: #612f80; }
  .error {
    color: #c0392b;
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    display: none;
  }
  .paper {
    margin-top: 24px;
    background: repeating-linear-gradient(
      #fffef9,
      #fffef9 27px,
      #cfd9e8 28px
    );
    background-position: 0 8px;
    border-left: 3px solid #d88;
    padding: 20px 20px 20px 30px;
    font-size: 20px;
    line-height: 28px;
    overflow-x: auto;
    display: none;
    white-space: pre;
    position: relative;
  }
  .division-svg {
    display: block;
  }
  .quotient-label {
    fill: #7b3fa0;
    font-style: italic;
    font-size: 16px;
  }
  .remainder-label {
    fill: #7b3fa0;
    font-style: italic;
    font-size: 16px;
  }
  .digit { fill: #1a1a1a; }
  .minus { fill: #1a1a1a; }
  .line { stroke: #1a1a1a; stroke-width: 1.5; }
  .arrow { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
  .bracket { stroke: #1a1a1a; stroke-width: 1.8; fill: none; }
  .result-box {
    margin-top: 16px;
    text-align: center;
    font-size: 15px;
    color: #333;
    display: none;
  }
  .result-box b { color: #7b3fa0; }
</style>
</head>
<body>

<div class="container">
  <h2>Binary Long Division</h2>
  <div class="inputs">
    <div>
      <label>Dividend</label>
      <input type="text" id="dividend" placeholder="e.g. 101101" value="101101">
    </div>
    <div>
      <label>Divisor</label>
      <input type="text" id="divisor" placeholder="e.g. 101" value="101">
    </div>
  </div>
  <button onclick="runDivision()">DIVIDE</button>
  <div class="error" id="errorMsg">Please enter valid binary numbers (0 and 1 only).</div>

  <div class="paper" id="paperOutput">
    <svg id="svgCanvas" class="division-svg"></svg>
  </div>

  <div class="result-box" id="resultBox"></div>
</div>

<script>
function isBinary(str) {
  return /^[01]+$/.test(str);
}

function runDivision() {
  const dividendStr = document.getElementById('dividend').value.trim();
  const divisorStr = document.getElementById('divisor').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const paper = document.getElementById('paperOutput');
  const resultBox = document.getElementById('resultBox');

  if (!isBinary(dividendStr) || !isBinary(divisorStr) || divisorStr.replace(/0/g,'') === '') {
    errorMsg.style.display = 'block';
    paper.style.display = 'none';
    resultBox.style.display = 'none';
    return;
  }
  errorMsg.style.display = 'none';

  const steps = computeSteps(dividendStr, divisorStr);
  drawDivision(dividendStr, divisorStr, steps);

  paper.style.display = 'block';

  const quotientDec = parseInt(steps.quotient, 2);
  const remainderDec = parseInt(steps.remainder, 2);
  resultBox.innerHTML =
    'Quotient = <b>' + steps.quotient + '</b> (decimal ' + quotientDec + ')<br>' +
    'Remainder = <b>' + steps.remainder + '</b> (decimal ' + remainderDec + ')';
  resultBox.style.display = 'block';
}

function computeSteps(dividend, divisor) {
  const n = dividend.length;
  const m = divisor.length;
  let quotientBits = '';
  let remainder = '';
  const rows = [];

  for (let i = 0; i < n; i++) {
    remainder += dividend[i];
    remainder = remainder.replace(/^0+(?=.)/, '');
    let qbit = '0';
    let sub = null;
    let remAfter = remainder;

    if (remainder.length > m || (remainder.length === m && compareBin(remainder, divisor) >= 0)) {
      qbit = '1';
      remAfter = subtractBin(remainder, divisor);
      sub = divisor;
    } else {
      qbit = '0';
      sub = '0'.repeat(remainder.length);
      remAfter = remainder;
    }
    quotientBits += qbit;
    rows.push({
      bit: dividend[i],
      qbit: qbit,
      remBefore: remainder,
      sub: sub,
      remAfter: remAfter
    });
    remainder = remAfter;
  }

  let q = quotientBits.replace(/^0+(?=.)/, '');
  let r = remainder === '' ? '0' : remainder;

  return { quotient: q, remainder: r, rows: rows };
}

function compareBin(a, b) {
  a = a.replace(/^0+(?=.)/, '');
  b = b.replace(/^0+(?=.)/, '');
  if (a.length !== b.length) return a.length - b.length;
  return a < b ? -1 : (a > b ? 1 : 0);
}

function subtractBin(a, b) {
  let aArr = a.split('').map(Number);
  let bArr = b.split('').map(Number);
  while (bArr.length < aArr.length) bArr.unshift(0);
  let result = [];
  let borrow = 0;
  for (let i = aArr.length - 1; i >= 0; i--) {
    let d = aArr[i] - bArr[i] - borrow;
    if (d < 0) { d += 2; borrow = 1; } else { borrow = 0; }
    result.unshift(d);
  }
  let res = result.join('').replace(/^0+(?=.)/, '');
  return res;
}

function drawDivision(dividend, divisor, steps) {
  const charW = 16;
  const rowH = 30;
  const fontSize = 20;
  const dividendStartX = 130;
  const topY = 40;

  const svg = document.getElementById('svgCanvas');
  svg.innerHTML = '';

  let elements = [];

  const quotient = steps.quotient;
  let qX = dividendStartX;
  elements.push(textEl(qX, topY - 15, quotient, fontSize, 'digit', 3));

  elements.push(textEl(10, topY + 15, divisor, fontSize, 'digit', 3));

  const bracketX = dividendStartX - 12;
  const bracketTopY = topY - 5;
  const bracketBotY = topY + rowH * (steps.rows.length + 1) + 10;
  elements.push(
    '<path class="bracket" d="M ' + bracketX + ' ' + bracketTopY +
    ' Q ' + (bracketX - 8) + ' ' + (topY + 10) + ' ' + bracketX + ' ' + (topY + 20) +
    ' L ' + bracketX + ' ' + bracketBotY + '" />'
  );
  const dividendWidth = dividend.length * charW;
  elements.push(lineEl(bracketX, bracketTopY, bracketX + dividendWidth + 20, bracketTopY));

  elements.push(textEl(dividendStartX, topY + 15, dividend, fontSize, 'digit', 3));

  let curY = topY + 25;

  steps.rows.forEach((row, idx) => {
    curY += rowH;
    const remLen = row.remBefore.length;
    const endColIndex = idx;
    const remEndX = dividendStartX + (endColIndex + 1) * (charW + 3);
    const remStartX = remEndX - remLen * (charW + 3);

    elements.push(textEl(remStartX - 20, curY, '-', fontSize, 'minus', 0));
    elements.push(textEl(remStartX, curY, row.sub, fontSize, 'digit', 3));

    curY += 8;
    elements.push(lineEl(remStartX - 22, curY, remEndX + 5, curY));

    curY += 22;
    const remAfterStr = row.remAfter === '' ? '0' : row.remAfter;
    const remAfterStartX = remEndX - remAfterStr.length * (charW + 3);
    elements.push(textEl(remAfterStartX, curY, remAfterStr, fontSize, 'digit', 3));

    curY += 4;
  });

  const finalY = curY;
  elements.push(lineEl(dividendStartX - 15, finalY + 6, dividendStartX + dividend.length*(charW+3), finalY + 6));
  elements.push(textEl(dividendStartX + dividend.length*(charW+3) + 15, finalY + 2, '— R', 16, 'remainder-label', 0));

  elements.push(textEl(qX + quotient.length*(charW+3) + 15, topY - 10, '— Q', 16, 'quotient-label', 0));

  svg.innerHTML = elements.join('');
  svg.setAttribute('width', Math.max(500, dividendStartX + dividend.length*(charW+3) + 150));
  svg.setAttribute('height', finalY + 40);
}

function textEl(x, y, str, size, cls, letterSpacing) {
  return '<text x="' + x + '" y="' + y + '" font-size="' + size +
    '" font-family="Courier New, monospace" letter-spacing="' + letterSpacing +
    '" class="' + cls + '">' + str + '</text>';
}

function lineEl(x1, y1, x2, y2) {
  return '<line class="line" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" />';
}

window.onload = runDivision;
</script>

</body>
</html>
