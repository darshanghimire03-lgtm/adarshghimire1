<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Shortcut Key · pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #f0f4f9;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #0b1a2b;
    }
    .card {
      max-width: 1150px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.18);
      padding: 2.2rem 2.5rem 2.8rem;
      transition: box-shadow 0.2s;
    }
    @media (max-width: 640px) {
      .card { padding: 1.5rem 1rem; border-radius: 1.8rem; }
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .logo-icon {
      background: #1e2a3a;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
    }
    .logo-text {
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0b1a2b, #2c3e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .badge {
      background: #e6edf5;
      color: #1e3a5f;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border: 1px solid #b8ccdd;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0.3rem 0 0.8rem 0;
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #7a8da0;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 3.2rem;
      border: 1.5px solid #d8e2ec;
      border-radius: 60px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background: #f7fafd;
      transition: all 0.15s;
      outline: none;
      color: #0b1a2b;
    }
    #searchInput:focus {
      border-color: #2b6c9e;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(30, 80, 130, 0.14);
    }
    #searchInput::placeholder { color: #8a9db0; font-weight: 400; }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin: 1.5rem 0 1.2rem 0;
      border-bottom: 1px solid #e2eaf2;
      padding-bottom: 0.8rem;
    }
    .result-counter {
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c4a6a;
      background: #eef4fa;
      padding: 0.25rem 1.2rem;
      border-radius: 30px;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: #4f6f8a;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.25rem 1rem;
      border-radius: 30px;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .clear-btn:hover { background: #e6eef7; color: #0b1a2b; }
    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
      margin-top: 0.2rem;
    }
    .shortcut-item {
      background: #fafcff;
      border-radius: 20px;
      padding: 1rem 1.1rem 0.8rem 1.1rem;
      border: 1px solid #e2eaf2;
      transition: all 0.12s;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.01);
    }
    .shortcut-item:hover {
      border-color: #b2c9dd;
      background: #ffffff;
      box-shadow: 0 8px 22px -10px rgba(0, 30, 60, 0.10);
      transform: translateY(-2px);
    }
    .shortcut-keys {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 7px;
      margin-bottom: 2px;
    }
    .key-badge {
      background: #e9eff6;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #102433;
      border: 1px solid #cbd9e6;
      box-shadow: inset 0 1px 0 #ffffff;
      text-transform: uppercase;
      font-family: 'Inter', monospace;
    }
    .key-badge:not(:last-child)::after {
      content: " +";
      font-weight: 400;
      color: #4e6f8a;
      margin-left: 2px;
    }
    .key-badge:last-child::after { content: ""; display: none; }
    .shortcut-action {
      font-weight: 500;
      font-size: 0.95rem;
      color: #0b1a2b;
      word-break: break-word;
    }
    .shortcut-app {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #2c5a7a;
      background: #e3ecf5;
      align-self: flex-start;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      margin-top: 2px;
    }
    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: #4a6a85;
      background: #f4f9ff;
      border-radius: 40px;
      border: 1px dashed #b8ccdd;
      font-size: 1rem;
    }
    .empty-message span { display: block; font-size: 2.2rem; margin-bottom: 0.4rem; }
    .footer-note {
      margin-top: 2.4rem;
      font-size: 0.8rem;
      color: #7a93ac;
      text-align: center;
      border-top: 1px solid #dfe9f2;
      padding-top: 1.4rem;
      letter-spacing: 0.2px;
    }
    .app-tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin: 0.2rem 0 0.6rem 0;
    }
    .app-tag {
      background: #eef4fa;
      padding: 0.15rem 1rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #1f4570;
      border: 1px solid #cbdae9;
    }
    @media (max-width: 480px) {
      .shortcut-grid { grid-template-columns: 1fr; }
      .logo-text { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon">⊞</div>
      <span class="logo-text">WinShortcut</span>
      <span class="badge">windows</span>
    </div>
  </div>

  <div class="search-wrapper">
    <span class="search-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </span>
    <input type="text" id="searchInput" placeholder="Search shortcuts… e.g. copy, excel, word" autofocus>
  </div>

  <div class="stats">
    <span class="result-counter" id="resultCounter">0 shortcuts</span>
    <button class="clear-btn" id="clearBtn">✕ clear</button>
  </div>

  <!-- app filter pills (quick reference) -->
  <div class="app-tag-group" id="appTagGroup">
    <span class="app-tag" data-app="all">all</span>
    <span class="app-tag" data-app="Windows">⊞ Windows</span>
    <span class="app-tag" data-app="PowerPoint">🖼 PowerPoint</span>
    <span class="app-tag" data-app="Word">📄 Word</span>
    <span class="app-tag" data-app="Excel">📊 Excel</span>
    <span class="app-tag" data-app="Control">⚙️ Control</span>
  </div>

  <div class="shortcut-grid" id="shortcutGrid"></div>
  <div class="footer-note">⌨️  Windows‑only · full shortcut database 2026</div>
</div>

<script>
  (function() {
    // ------------------------------------------------------------
    //  JSON  (separate "files" as plain JS objects)
    //  PowerPoint.json , Windows.json , Control.json , Word.json , Excel.json
    // ------------------------------------------------------------
    const WindowsJSON = [
      { keys: ['Win', 'D'], action: 'Show desktop', app: 'Windows' },
      { keys: ['Win', 'E'], action: 'File Explorer', app: 'Windows' },
      { keys: ['Win', 'L'], action: 'Lock PC', app: 'Windows' },
      { keys: ['Win', 'I'], action: 'Settings', app: 'Windows' },
      { keys: ['Win', 'R'], action: 'Run dialog', app: 'Windows' },
      { keys: ['Win', 'S'], action: 'Search', app: 'Windows' },
      { keys: ['Win', 'Tab'], action: 'Task view', app: 'Windows' },
      { keys: ['Alt', 'Tab'], action: 'Switch windows', app: 'Windows' },
      { keys: ['Alt', 'F4'], action: 'Close window', app: 'Windows' },
      { keys: ['Ctrl', 'Shift', 'Esc'], action: 'Task Manager', app: 'Windows' },
      { keys: ['Win', 'P'], action: 'Project / display', app: 'Windows' },
      { keys: ['Win', 'V'], action: 'Clipboard history', app: 'Windows' },
      { keys: ['Win', 'Shift', 'S'], action: 'Snipping tool', app: 'Windows' },
      { keys: ['Win', '.'] , action: 'Emoji picker', app: 'Windows' }
    ];

    const PowerPointJSON = [
      { keys: ['Ctrl', 'N'], action: 'New presentation', app: 'PowerPoint' },
      { keys: ['Ctrl', 'O'], action: 'Open presentation', app: 'PowerPoint' },
      { keys: ['Ctrl', 'S'], action: 'Save', app: 'PowerPoint' },
      { keys: ['Ctrl', 'P'], action: 'Print', app: 'PowerPoint' },
      { keys: ['Ctrl', 'Z'], action: 'Undo', app: 'PowerPoint' },
      { keys: ['Ctrl', 'Y'], action: 'Redo', app: 'PowerPoint' },
      { keys: ['Ctrl', 'C'], action: 'Copy', app: 'PowerPoint' },
      { keys: ['Ctrl', 'V'], action: 'Paste', app: 'PowerPoint' },
      { keys: ['Ctrl', 'X'], action: 'Cut', app: 'PowerPoint' },
      { keys: ['Ctrl', 'A'], action: 'Select all', app: 'PowerPoint' },
      { keys: ['Ctrl', 'G'], action: 'Group objects', app: 'PowerPoint' },
      { keys: ['Ctrl', 'Shift', 'G'], action: 'Ungroup', app: 'PowerPoint' },
      { keys: ['F5'], action: 'Start slideshow', app: 'PowerPoint' },
      { keys: ['Shift', 'F5'], action: 'From current slide', app: 'PowerPoint' },
      { keys: ['Ctrl', 'D'], action: 'Duplicate slide', app: 'PowerPoint' }
    ];

    const WordJSON = [
      { keys: ['Ctrl', 'N'], action: 'New document', app: 'Word' },
      { keys: ['Ctrl', 'O'], action: 'Open document', app: 'Word' },
      { keys: ['Ctrl', 'S'], action: 'Save', app: 'Word' },
      { keys: ['Ctrl', 'P'], action: 'Print', app: 'Word' },
      { keys: ['Ctrl', 'Z'], action: 'Undo', app: 'Word' },
      { keys: ['Ctrl', 'Y'], action: 'Redo', app: 'Word' },
      { keys: ['Ctrl', 'C'], action: 'Copy', app: 'Word' },
      { keys: ['Ctrl', 'V'], action: 'Paste', app: 'Word' },
      { keys: ['Ctrl', 'X'], action: 'Cut', app: 'Word' },
      { keys: ['Ctrl', 'A'], action: 'Select all', app: 'Word' },
      { keys: ['Ctrl', 'B'], action: 'Bold', app: 'Word' },
      { keys: ['Ctrl', 'I'], action: 'Italic', app: 'Word' },
      { keys: ['Ctrl', 'U'], action: 'Underline', app: 'Word' },
      { keys: ['Ctrl', 'E'], action: 'Center align', app: 'Word' },
      { keys: ['Ctrl', 'L'], action: 'Left align', app: 'Word' },
      { keys: ['Ctrl', 'R'], action: 'Right align', app: 'Word' },
      { keys: ['Ctrl', 'J'], action: 'Justify', app: 'Word' },
      { keys: ['Ctrl', 'K'], action: 'Insert hyperlink', app: 'Word' },
      { keys: ['Ctrl', 'F'], action: 'Find', app: 'Word' },
      { keys: ['Ctrl', 'H'], action: 'Replace', app: 'Word' }
    ];

    const ExcelJSON = [
      { keys: ['Ctrl', 'N'], action: 'New workbook', app: 'Excel' },
      { keys: ['Ctrl', 'O'], action: 'Open workbook', app: 'Excel' },
      { keys: ['Ctrl', 'S'], action: 'Save', app: 'Excel' },
      { keys: ['Ctrl', 'P'], action: 'Print', app: 'Excel' },
      { keys: ['Ctrl', 'Z'], action: 'Undo', app: 'Excel' },
      { keys: ['Ctrl', 'Y'], action: 'Redo', app: 'Excel' },
      { keys: ['Ctrl', 'C'], action: 'Copy', app: 'Excel' },
      { keys: ['Ctrl', 'V'], action: 'Paste', app: 'Excel' },
      { keys: ['Ctrl', 'X'], action: 'Cut', app: 'Excel' },
      { keys: ['Ctrl', 'A'], action: 'Select all', app: 'Excel' },
      { keys: ['Ctrl', 'F'], action: 'Find', app: 'Excel' },
      { keys: ['Ctrl', 'H'], action: 'Replace', app: 'Excel' },
      { keys: ['Ctrl', 'Shift', 'L'], action: 'Toggle filters', app: 'Excel' },
      { keys: ['Ctrl', '`'], action: 'Show formulas', app: 'Excel' },
      { keys: ['Ctrl', ';'], action: 'Insert date', app: 'Excel' },
      { keys: ['Ctrl', 'Shift', ';'], action: 'Insert time', app: 'Excel' },
      { keys: ['Ctrl', 'PageUp'], action: 'Previous sheet', app: 'Excel' },
      { keys: ['Ctrl', 'PageDown'], action: 'Next sheet', app: 'Excel' }
    ];

    const ControlJSON = [
      { keys: ['Ctrl', 'C'], action: 'Copy', app: 'Control' },
      { keys: ['Ctrl', 'V'], action: 'Paste', app: 'Control' },
      { keys: ['Ctrl', 'X'], action: 'Cut', app: 'Control' },
      { keys: ['Ctrl', 'Z'], action: 'Undo', app: 'Control' },
      { keys: ['Ctrl', 'Y'], action: 'Redo', app: 'Control' },
      { keys: ['Ctrl', 'A'], action: 'Select all', app: 'Control' },
      { keys: ['Ctrl', 'F'], action: 'Find', app: 'Control' },
      { keys: ['Ctrl', 'S'], action: 'Save', app: 'Control' },
      { keys: ['Ctrl', 'P'], action: 'Print', app: 'Control' },
      { keys: ['Ctrl', 'O'], action: 'Open', app: 'Control' },
      { keys: ['Ctrl', 'N'], action: 'New', app: 'Control' },
      { keys: ['Ctrl', 'W'], action: 'Close', app: 'Control' },
      { keys: ['Ctrl', 'Tab'], action: 'Next tab / pane', app: 'Control' },
      { keys: ['Ctrl', 'Shift', 'Tab'], action: 'Previous tab', app: 'Control' }
    ];

    // ----- combine all shortcuts (Windows-only) -----
    const shortcutData = [
      ...WindowsJSON,
      ...PowerPointJSON,
      ...WordJSON,
      ...ExcelJSON,
      ...ControlJSON
    ];

    // ----- DOM refs -----
    const grid = document.getElementById('shortcutGrid');
    const searchInput = document.getElementById('searchInput');
    const counter = document.getElementById('resultCounter');
    const clearBtn = document.getElementById('clearBtn');
    const appTags = document.querySelectorAll('.app-tag');

    // ----- render function (filter by text & app) -----
    let activeAppFilter = 'all';

    function renderShortcuts(filterText = '', appFilter = 'all') {
      const query = filterText.trim().toLowerCase();
      let filtered = shortcutData;

      // app filter
      if (appFilter !== 'all') {
        filtered = filtered.filter(item => item.app === appFilter);
      }

      // text search
      if (query !== '') {
        filtered = filtered.filter(item => {
          const keysStr = item.keys.join(' ').toLowerCase();
          const actionStr = item.action.toLowerCase();
          const appStr = item.app.toLowerCase();
          return keysStr.includes(query) || actionStr.includes(query) || appStr.includes(query);
        });
      }

      counter.textContent = filtered.length === 1 ? '1 shortcut' : `${filtered.length} shortcuts`;
      grid.innerHTML = '';

      if (filtered.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-message';
        emptyDiv.innerHTML = `<span>⊞</span> No shortcuts found for “${query || 'this app'}”<br><small>try “copy”, “powerpoint”, or “excel”</small>`;
        grid.appendChild(emptyDiv);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'shortcut-item';

        const keysContainer = document.createElement('div');
        keysContainer.className = 'shortcut-keys';
        item.keys.forEach((key) => {
          const badge = document.createElement('span');
          badge.className = 'key-badge';
          badge.textContent = key;
          keysContainer.appendChild(badge);
        });

        const actionSpan = document.createElement('div');
        actionSpan.className = 'shortcut-action';
        actionSpan.textContent = item.action;

        const appSpan = document.createElement('div');
        appSpan.className = 'shortcut-app';
        appSpan.textContent = item.app;

        card.appendChild(keysContainer);
        card.appendChild(actionSpan);
        card.appendChild(appSpan);
        grid.appendChild(card);
      });
    }

    // ----- event handlers -----
    function handleSearch() {
      renderShortcuts(searchInput.value, activeAppFilter);
    }

    searchInput.addEventListener('input', handleSearch);

    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      activeAppFilter = 'all';
      // update pills active style
      appTags.forEach(tag => {
        tag.style.background = tag.dataset.app === 'all' ? '#d4e2f0' : '#eef4fa';
        tag.style.fontWeight = tag.dataset.app === 'all' ? '600' : '500';
      });
      renderShortcuts('', 'all');
      searchInput.focus();
    });

    // app tag filter
    appTags.forEach(tag => {
      tag.addEventListener('click', function() {
        const app = this.dataset.app;
        activeAppFilter = app;
        // update visual
        appTags.forEach(t => {
          t.style.background = '#eef4fa';
          t.style.fontWeight = '500';
        });
        this.style.background = '#d4e2f0';
        this.style.fontWeight = '600';
        renderShortcuts(searchInput.value, app);
      });
    });

    // initial render (all)
    renderShortcuts('', 'all');
    // set default active pill
    document.querySelector('.app-tag[data-app="all"]').style.background = '#d4e2f0';
    document.querySelector('.app-tag[data-app="all"]').style.fontWeight = '600';

    // focus
    setTimeout(() => searchInput.focus(), 100);
  })();
</script>
</body>
</html>
