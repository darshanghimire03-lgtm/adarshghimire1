<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arm Band</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            /* Gradient using colors from the tie: Navy, Light Blue, and Red */
            background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 40%, #60a5fa 70%, #dc2626 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            margin: 30px 0 25px;
            font-size: 32px;
            color: #60a5fa; /* Light blue from the tie */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .photos {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }

        .photos img {
            width: 50%;
            /* Forces the image to be a perfect 1:1 square */
            aspect-ratio: 1 / 1; 
            object-fit: cover;
            border-radius: 14px;
            display: block;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photos img:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        /* Full Screen Lightbox Styles */
        .lightbox {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .photos {
                flex-direction: column;
                align-items: center;
            }

            .photos img {
                width: 100%;
                max-width: 400px; /* Prevents squares from being too huge on mobile */
                aspect-ratio: 1 / 1;
            }

            h1 {
                font-size: 24px;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>Arm Band</h1>

    <div class="photos">
        <!-- Added onclick events to trigger the full screen view -->
        <img src="arm-band-1.png" alt="Arm Band 1" onclick="openLightbox(this.src)">
        <img src="arm-band-2.png" alt="Arm Band 2" onclick="openLightbox(this.src)">
    </div>

    <!-- Full Screen Lightbox Element -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full Screen Image">
    </div>

    <!-- JavaScript to handle the full screen logic -->
    <script>
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = imageSrc;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        // Close lightbox with the Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
