<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shorts — Durbar</title>
<style>
  :root {
    --navy: #16324f;
    --satin-blue: #2e73f2;
    --hint: #9aa5b1;
    --bg: #f4f6f9;
    --white: #ffffff;
    --border: #e3e8ef;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--navy);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .title {
    font-size: 18px;
    font-weight: 800;
    color: var(--navy);
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 820px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  .short-card {
    background: var(--white);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(20,40,80,0.06);
    cursor: pointer;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .play-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .short-info {
    padding: 10px 12px 12px;
  }
  .short-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .short-subject {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--satin-blue);
    background: rgba(46,115,242,0.08);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .short-meta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--hint);
  }
  .state {
    text-align: center;
    padding: 60px 20px;
    color: var(--hint);
    font-size: 14px;
    grid-column: 1 / -1;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--satin-blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Fullscreen player overlay */
  .player-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .player-overlay.open { display: flex; }
  .player-overlay video {
    width: 100%;
    height: 100%;
    max-width: 480px;
    object-fit: contain;
    background: #000;
  }
  .player-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    z-index: 101;
  }
  .player-caption {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 24px;
    color: #fff;
    z-index: 101;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .player-caption .p-title {
    font-size: 15px;
    font-weight: 700;
  }
  .player-caption .p-subject {
    font-size: 12px;
    color: #cfe0ff;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">Shorts</div>
</div>

<div class="container">
  <div class="grid" id="grid">
    <div class="state">
      <div class="spinner"></div>
      Loading shorts…
    </div>
  </div>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-close" id="playerClose">&#10005;</div>
  <video id="playerVideo" playsinline controls autoplay></video>
  <div class="player-caption" id="playerCaption">
    <div class="p-title" id="playerTitle"></div>
    <div class="p-subject" id="playerSubject"></div>
  </div>
</div>

<!-- Firebase (read-only: only used to fetch and display existing shorts) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCyrQUpOlHrY3t7GtxFXD5zCweKtYYX5wI",
    databaseURL: "https://darbarhigh-4c642-default-rtdb.firebaseio.com",
    projectId: "darbarhigh-4c642"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var grid = document.getElementById('grid');
  var overlay = document.getElementById('playerOverlay');
  var playerVideo = document.getElementById('playerVideo');
  var playerTitle = document.getElementById('playerTitle');
  var playerSubject = document.getElementById('playerSubject');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.innerText = str == null ? '' : str;
    return div.innerHTML;
  }

  function timeAgo(ts) {
    if (!ts) { return ''; }
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) { return 'Just now'; }
    if (diff < 3600) { return Math.floor(diff / 60) + 'm ago'; }
    if (diff < 86400) { return Math.floor(diff / 3600) + 'h ago'; }
    if (diff < 604800) { return Math.floor(diff / 86400) + 'd ago'; }
    var d = new Date(ts);
    return d.toLocaleDateString();
  }

  function formatViews(n) {
    n = n || 0;
    if (n >= 1000000) { return (n / 1000000).toFixed(1) + 'M views'; }
    if (n >= 1000) { return (n / 1000).toFixed(1) + 'K views'; }
    return n + ' views';
  }

  function openPlayer(short) {
    playerVideo.pause();
    playerVideo.src = short.videoUrl || '';
    playerTitle.innerText = short.title || '';
    playerSubject.innerText = short.relatedSubject || '';
    overlay.classList.add('open');
    playerVideo.play().catch(function () {});
  }

  function closePlayer() {
    overlay.classList.remove('open');
    playerVideo.pause();
    playerVideo.src = '';
  }

  document.getElementById('playerClose').addEventListener('click', closePlayer);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) { closePlayer(); }
  });

  function renderShorts(shorts) {
    grid.innerHTML = '';

    if (shorts.length === 0) {
      grid.innerHTML = '<div class="state">No shorts yet</div>';
      return;
    }

    shorts.forEach(function (short, index) {
      var card = document.createElement('div');
      card.className = 'short-card';

      var title = escapeHtml(short.title || 'Untitled');
      var subject = escapeHtml(short.relatedSubject || '');

      card.innerHTML =
        '<div class="video-wrap">' +
          '<video src="' + escapeHtml(short.videoUrl || '') + '" preload="metadata" muted playsinline></video>' +
          '<div class="play-badge">&#9654; Play</div>' +
        '</div>' +
        '<div class="short-info">' +
          '<div class="short-title">' + title + '</div>' +
          (subject ? '<span class="short-subject">' + subject + '</span>' : '') +
          '<div class="short-meta">' + formatViews(short.views) + ' &middot; ' + timeAgo(short.uploadedDate) + '</div>' +
        '</div>';

      card.addEventListener('click', function () {
        openPlayer(short);
      });

      grid.appendChild(card);
    });
  }

  db.ref('shorts').on('value', function (snapshot) {
    var raw = snapshot.val();
    if (!raw) {
      renderShorts([]);
      return;
    }

    var shorts = Object.keys(raw).map(function (key) {
      var s = raw[key];
      s.shortId = key;
      return s;
    });

    shorts.sort(function (a, b) {
      return (b.uploadedDate || 0) - (a.uploadedDate || 0);
    });

    renderShorts(shorts);
  }, function (error) {
    grid.innerHTML = '<div class="state">Could not load shorts</div>';
  });
</script>

</body>
</html>
