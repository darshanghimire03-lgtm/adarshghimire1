<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>English Assignment – Direct PDF view</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f1f5f9 0%, #e6ecf4 100%);
      min-height: 100vh;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* Header */
    .header-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      gap: 1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0b1b2f;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      letter-spacing: -0.02em;
    }

    h1 i {
      background: #1e3a8a;
      color: white;
      padding: 0.5rem 0.7rem;
      border-radius: 1.2rem;
      font-size: 1.6rem;
      box-shadow: 0 8px 18px -6px rgba(30, 58, 138, 0.4);
    }

    .subhead {
      font-size: 1rem;
      color: #334155;
      background: rgba(255, 255, 255, 0.75);
      padding: 0.6rem 1.3rem;
      border-radius: 3rem;
      font-weight: 500;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }

    .subhead i {
      color: #2563eb;
      font-size: 0.95rem;
    }

    /* Single PDF card */
    .pdf-card {
      background: #ffffff;
      border-radius: 1.8rem;
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }

    .pdf-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.2);
    }

    /* Card header with title */
    .card-header {
      padding: 1rem 1.5rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-header i {
      color: #dc2626;
      font-size: 1.5rem;
    }

    .card-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    /* PDF embed container */
    .pdf-embed {
      width: 100%;
      background: #1e293b;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pdf-embed iframe {
      width: 100%;
      height: 75vh;          /* tall enough for comfortable reading */
      min-height: 500px;
      border: none;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
    }

    /* Footer note */
    .directory-note {
      margin-top: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: #475569;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.75rem 2rem;
      border-radius: 3rem;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
    }

    .directory-note i {
      color: #2563eb;
    }

    /* Responsive adjustments */
    @media (max-width: 800px) {
      .main-container {
        padding: 1.5rem 1rem 2rem;
        border-radius: 2rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .header-section {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .subhead {
        width: 100%;
        justify-content: center;
        text-align: center;
      }
      .pdf-embed iframe {
        height: 60vh;
        min-height: 400px;
      }
      .card-header h2 {
        font-size: 1.15rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem 0.6rem;
      }
      .main-container {
        padding: 1.2rem 0.8rem 1.8rem;
        border-radius: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      h1 i {
        font-size: 1.2rem;
        padding: 0.4rem 0.6rem;
      }
      .pdf-embed {
        padding: 0.6rem;
      }
      .pdf-embed iframe {
        height: 55vh;
        min-height: 300px;
        border-radius: 0.8rem;
      }
      .card-header {
        padding: 0.8rem 1rem;
      }
      .card-header h2 {
        font-size: 1rem;
      }
      .directory-note {
        font-size: 0.8rem;
        padding: 0.6rem 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Header -->
    <div class="header-section">
      <h1>
        <i class="fas fa-book-open"></i>
        English Assignment
      </h1>
      <div class="subhead">
        <i class="fas fa-file-pdf"></i> PDF displayed directly below
      </div>
    </div>

    <!-- Single PDF Card -->
    <div class="pdf-card">
      <div class="card-header">
        <i class="fas fa-file-pdf"></i>
        <h2>English Assignment</h2>
      </div>
      <div class="pdf-embed">
        <!-- Replace 'assignment.pdf' with your actual PDF filename -->
        <iframe src="assignment.pdf" title="English Assignment PDF"></iframe>
      </div>
    </div>

    <!-- Footer note -->
    <div class="directory-note">
      <i class="fas fa-folder-open"></i>
      PDF should be in the same directory as this HTML file.
    </div>
  </div>
</body>
</html>
