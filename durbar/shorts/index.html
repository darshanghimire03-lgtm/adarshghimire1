<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Durbar Short</title>

<!-- Open Graph tags so the link looks good when shared on WhatsApp, Facebook, etc -->
<meta property="og:type" content="video.other">
<meta id="ogTitle" property="og:title" content="Durbar Short">
<meta id="ogDescription" property="og:description" content="Watch this short on Durbar">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .player-shell {
        position: relative;
        width: 100%;
        max-width: 420px;
        height: 100vh;
        max-height: 900px;
        background: #000;
        overflow: hidden;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
    }

    .overlay-gradient {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 45%;
        background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
        pointer-events: none;
    }

    .bottom-info {
        position: absolute;
        left: 16px;
        right: 76px;
        bottom: 76px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .bottom-info h1 {
        font-size: 16px;
        font-weight: bold;
        margin: 0 0 4px 0;
        line-height: 1.3;
    }

    .bottom-info p {
        font-size: 13px;
        color: #8EC5FF;
        margin: 0;
    }

    .uploader-row {
        position: absolute;
        left: 16px;
        right: 76px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .uploader-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        background: #333 center/cover no-repeat;
        flex-shrink: 0;
    }

    .uploader-name {
        font-size: 14px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .uploader-date {
        font-size: 12px;
        color: #8EC5FF;
        white-space: nowrap;
    }

    .get-app-banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(6px);
        z-index: 5;
    }

    .get-app-banner span {
        font-size: 13px;
        color: #fff;
    }

    .get-app-btn {
        background: #1E3A8A;
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: bold;
        padding: 8px 16px;
        border-radius: 18px;
        white-space: nowrap;
    }

    .center-state {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
    }

    .center-state.hidden { display: none; }

    .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .center-state h2 {
        font-size: 17px;
        margin: 0;
    }

    .center-state p {
        font-size: 14px;
        color: #b0b0b0;
        margin: 0;
        max-width: 300px;
    }

    .primary-btn {
        background: #1E3A8A;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 24px;
        display: inline-block;
    }
</style>
</head>
<body>

<div class="player-shell">

    <div class="get-app-banner" id="getAppBanner" style="display:none;">
        <span>Watch shorts, chat & more in the Durbar app</span>
        <a class="get-app-btn" id="getAppBtn" href="#">Open app</a>
    </div>

    <video id="shortVideo" playsinline webkit-playsinline loop muted controls style="display:none;"></video>
    <div class="overlay-gradient" id="overlayGradient" style="display:none;"></div>

    <div class="bottom-info" id="bottomInfo" style="display:none;">
        <h1 id="shortTitle"></h1>
        <p id="shortSubject"></p>
    </div>

    <div class="uploader-row" id="uploaderRow" style="display:none;">
        <div class="uploader-avatar" id="uploaderAvatar"></div>
        <div>
            <div class="uploader-name" id="uploaderName"></div>
        </div>
        <span class="uploader-date" id="uploaderDate"></span>
    </div>

    <div class="center-state" id="loadingState">
        <div class="spinner"></div>
        <p>Loading short&hellip;</p>
    </div>

    <div class="center-state hidden" id="errorState">
        <h2>Couldn't load this short</h2>
        <p id="errorMessage">This short may have been removed, or the link is invalid.</p>
        <a class="primary-btn" href="https://adarshghimire1.com.np/durbar/">Visit Durbar</a>
    </div>

</div>

<script>
(function () {
    // ---- Configuration: your Firebase Realtime Database REST endpoint ----
    var DATABASE_URL = "https://darbarhigh-4c642-default-rtdb.firebaseio.com";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.doroi.plus2";
    var APP_PACKAGE = "com.doroi.plus2";

    function getShortIdFromPath() {
        var parts = window.location.pathname.split("/").filter(Boolean);
        return parts[parts.length - 1] || null;
    }

    function showError(message) {
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("errorState").classList.remove("hidden");
        if (message) {
            document.getElementById("errorMessage").textContent = message;
        }
    }

    function formatSmartDate(timestamp) {
        if (!timestamp) return "";
        var now = Date.now();
        var diff = now - timestamp;
        if (diff < 0) return "just now";

        var minute = 60 * 1000;
        var hour = 60 * minute;
        var day = 24 * hour;

        var minutes = Math.floor(diff / minute);
        var hours = Math.floor(diff / hour);
        var days = Math.floor(diff / day);

        if (minutes < 1) return "just now";
        if (hours < 1) return minutes + (minutes === 1 ? " minute ago" : " minutes ago");
        if (days < 1) return hours + (hours === 1 ? " hour ago" : " hours ago");
        if (days === 1) return "1 day ago";
        if (days <= 6) return days + " days ago";
        if (days <= 13) return "1 week ago";
        if (days <= 29) return Math.floor(days / 7) + " weeks ago";

        var d = new Date(timestamp);
        var now_d = new Date(now);
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        if (d.getFullYear() === now_d.getFullYear()) {
            return months[d.getMonth()] + " " + d.getDate();
        }
        return d.getFullYear() + " " + months[d.getMonth()] + " " + d.getDate();
    }

    function fetchJson(url) {
        return fetch(url).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        });
    }

    function tryOpenApp(shortId) {
        var deepLink = "https://adarshghimire1.com.np/durbar/shorts/" + shortId;
        var fallbackTimer = setTimeout(function () {
            window.location.href = PLAY_STORE_URL;
        }, 1500);

        document.addEventListener("visibilitychange", function onVis() {
            if (document.hidden) {
                clearTimeout(fallbackTimer);
                document.removeEventListener("visibilitychange", onVis);
            }
        });

        window.location.href = "intent://durbar/shorts/" + shortId +
            "#Intent;scheme=https;package=" + APP_PACKAGE +
            ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) + ";end";
    }

    function render(shortId, shortData, uploaderData) {
        document.getElementById("loadingState").classList.add("hidden");

        var video = document.getElementById("shortVideo");
        video.src = shortData.videoUrl || "";
        video.style.display = "block";
        video.play().catch(function () {
            // Autoplay with sound may be blocked; user can tap controls.
        });

        document.getElementById("overlayGradient").style.display = "block";
        document.getElementById("bottomInfo").style.display = "block";
        document.getElementById("uploaderRow").style.display = "flex";

        document.getElementById("shortTitle").textContent = shortData.title || "";
        document.getElementById("shortSubject").textContent = shortData.relatedSubject || "";
        document.getElementById("uploaderDate").textContent = formatSmartDate(shortData.uploadedDate);

        var uploaderName = (uploaderData && uploaderData.fullName) ? uploaderData.fullName : "Durbar User";
        document.getElementById("uploaderName").textContent = uploaderName;

        if (uploaderData && uploaderData.profileImageUrl) {
            document.getElementById("uploaderAvatar").style.backgroundImage =
                "url('" + uploaderData.profileImageUrl + "')";
        }

        document.title = (shortData.title || "Durbar Short") + " | Durbar";
        document.getElementById("ogTitle").setAttribute("content", shortData.title || "Durbar Short");
        document.getElementById("ogDescription").setAttribute(
            "content", "By " + uploaderName + " on Durbar"
        );

        var banner = document.getElementById("getAppBanner");
        banner.style.display = "flex";
        document.getElementById("getAppBtn").addEventListener("click", function (e) {
            e.preventDefault();
            tryOpenApp(shortId);
        });
    }

    function init() {
        var shortId = getShortIdFromPath();
        if (!shortId) {
            showError("No short specified in this link.");
            return;
        }

        var shortUrl = DATABASE_URL + "/shorts/" + shortId + ".json";

        fetchJson(shortUrl)
            .then(function (shortData) {
                if (!shortData) {
                    showError("This short doesn't exist or was removed.");
                    return null;
                }

                var uploaderUid = shortData.uploaderUid;
                if (!uploaderUid) {
                    render(shortId, shortData, null);
                    return null;
                }

                var userUrl = DATABASE_URL + "/users/" + uploaderUid + ".json";
                return fetchJson(userUrl)
                    .then(function (userData) {
                        render(shortId, shortData, userData);
                    })
                    .catch(function () {
                        render(shortId, shortData, null);
                    });
            })
            .catch(function (err) {
                console.error("Durbar shorts fetch failed:", err);
                showError(
                    "This content couldn't be loaded on the website right now. " +
                    "Please open it in the Durbar app instead."
                );
            });
    }

    init();
})();
</script>

</body>
</html>
