<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Durbar Shorts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #overlay {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 100%);
    color: #fff;
    z-index: 5;
  }
  #title {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #subject {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 14px;
  }
  #openAppBtn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: #ffffff;
    color: #111;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
  }
  #getAppNote {
    display: none;
    margin-top: 10px;
    font-size: 12.5px;
    opacity: 0.75;
    text-align: center;
    line-height: 1.4;
  }
  #topBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #brand {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  #centerState {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    color: #fff;
    text-align: center;
    padding: 32px;
    z-index: 10;
  }
  #centerState.show { display: flex; }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #centerState h2 {
    font-size: 18px;
    font-weight: 700;
  }
  #centerState p {
    font-size: 14px;
    opacity: 0.75;
    max-width: 300px;
    line-height: 1.5;
  }
  #muteHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #muteHint.show { opacity: 1; }
</style>
</head>
<body>

<div id="topBar">
  <span id="brand">Durbar</span>
</div>

<div id="stage">
  <video id="player" playsinline webkit-playsinline muted autoplay loop></video>
</div>

<div id="muteHint">Tap to unmute</div>

<div id="overlay">
  <div id="title"></div>
  <div id="subject"></div>
  <a id="openAppBtn" href="#">Open in Durbar app</a>
  <div id="getAppNote">Don't have Durbar yet? The app isn't published on the Play Store yet — check back soon.</div>
</div>

<div id="centerState">
  <div class="spinner" id="spinner"></div>
  <h2 id="stateTitle">Loading short…</h2>
  <p id="stateMessage"></p>
</div>

<script>
(function () {
  var FIREBASE_DB_URL = "https://darbarhigh-4c642-default-rtdb.firebaseio.com";
  var APP_HOST = "adarshghimire1.com.np";
  var APP_PATH_PREFIX = "/durbar/shorts/";

  function getShortIdFromUrl() {
    var path = window.location.pathname;
    var idx = path.indexOf("/shorts/");
    if (idx === -1) return null;
    var rest = path.substring(idx + "/shorts/".length);
    rest = rest.split("?")[0].split("#")[0];
    var parts = rest.split("/").filter(Boolean);
    return parts.length > 0 ? decodeURIComponent(parts[0]) : null;
  }

  var shortId = getShortIdFromUrl();

  var els = {
    video: document.getElementById("player"),
    title: document.getElementById("title"),
    subject: document.getElementById("subject"),
    overlay: document.getElementById("overlay"),
    openAppBtn: document.getElementById("openAppBtn"),
    getAppNote: document.getElementById("getAppNote"),
    centerState: document.getElementById("centerState"),
    spinner: document.getElementById("spinner"),
    stateTitle: document.getElementById("stateTitle"),
    stateMessage: document.getElementById("stateMessage"),
    muteHint: document.getElementById("muteHint"),
    stage: document.getElementById("stage")
  };

  function showCenterState(title, message, showSpinner) {
    els.centerState.classList.add("show");
    els.stateTitle.textContent = title;
    els.stateMessage.textContent = message || "";
    els.spinner.style.display = showSpinner ? "block" : "none";
    els.overlay.style.display = "none";
    els.stage.style.display = "none";
  }

  function hideCenterState() {
    els.centerState.classList.remove("show");
    els.overlay.style.display = "block";
    els.stage.style.display = "flex";
  }

  if (!shortId) {
    showCenterState("Short not found", "This link is missing a valid short ID.", false);
    return;
  }

  var deepLink = "https://" + APP_HOST + APP_PATH_PREFIX + encodeURIComponent(shortId);
  els.openAppBtn.setAttribute("href", deepLink);
  els.openAppBtn.addEventListener("click", function (e) {
    e.preventDefault();
    attemptOpenApp();
  });

  function attemptOpenApp() {
    var start = Date.now();
    var fallbackTimer = setTimeout(function () {
      if (document.hidden) return;
      var elapsed = Date.now() - start;
      if (elapsed < 3000) {
        els.getAppNote.style.display = "block";
      }
    }, 1500);

    document.addEventListener("visibilitychange", function onVis() {
      if (document.hidden) {
        clearTimeout(fallbackTimer);
        document.removeEventListener("visibilitychange", onVis);
      }
    });

    window.location.href = deepLink;
  }

  function fetchShort(id) {
    var url = FIREBASE_DB_URL + "/shorts/" + encodeURIComponent(id) + ".json";
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("network");
      return res.json();
    });
  }

  function fetchUploader(uid) {
    if (!uid) return Promise.resolve(null);
    var url = FIREBASE_DB_URL + "/users/" + encodeURIComponent(uid) + ".json";
    return fetch(url).then(function (res) {
      if (!res.ok) return null;
      return res.json();
    }).catch(function () { return null; });
  }

  function incrementViews(id, currentViews) {
    var url = FIREBASE_DB_URL + "/shorts/" + encodeURIComponent(id) + "/views.json";
    fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify((currentViews || 0) + 1)
    }).catch(function () {});
  }

  showCenterState("Loading short…", "", true);

  fetchShort(shortId).then(function (data) {
    if (!data) {
      showCenterState("Short not found", "This short may have been removed.", false);
      return;
    }

    hideCenterState();

    els.title.textContent = data.title || "";
    els.subject.textContent = data.relatedSubject || "";
    els.video.src = data.videoUrl || "";

    incrementViews(shortId, data.views);

    els.video.play().catch(function () {
      els.video.muted = true;
      els.video.play().catch(function () {});
    });

    els.video.addEventListener("click", function () {
      els.video.muted = !els.video.muted;
      if (!els.video.muted) {
        els.muteHint.classList.remove("show");
      } else {
        els.muteHint.textContent = "Tap to unmute";
        els.muteHint.classList.add("show");
        setTimeout(function () { els.muteHint.classList.remove("show"); }, 1200);
      }
    });

    if (els.video.muted) {
      els.muteHint.classList.add("show");
      setTimeout(function () { els.muteHint.classList.remove("show"); }, 1600);
    }

    fetchUploader(data.uploaderUid).then(function (user) {
      if (user && user.fullName) {
        els.subject.textContent = (data.relatedSubject ? data.relatedSubject + " · " : "") + user.fullName;
      }
    });

    document.title = (data.title || "Durbar Short") + " — Durbar";

    setTimeout(attemptOpenApp, 400);
  }).catch(function () {
    showCenterState("Couldn't load this short", "Check your connection and try again.", false);
  });
})();
</script>

</body>
</html>
