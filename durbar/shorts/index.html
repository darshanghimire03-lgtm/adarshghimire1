<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durbar Short</title>
    <meta property="og:title" content="Watch this short on Durbar">
    <meta property="og:type" content="video.other">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 360px;
        }
        .card h1 {
            font-size: 20px;
            margin-bottom: 12px;
        }
        .card p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #1E3A8A;
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Open this short in Durbar</h1>
        <p>This link opens directly in the Durbar app if it's installed on your device.</p>
        <a class="btn" id="openAppBtn" href="#">Open in Durbar</a>
    </div>

    <script>
        var shortId = window.location.pathname.split('/').filter(Boolean).pop();
        var appLink = 'https://adarshghimire1.com.np/durbar/shorts/' + shortId;
        document.getElementById('openAppBtn').setAttribute('href', appLink);

        window.location.href = appLink;
    </script>
</body>
</html>
