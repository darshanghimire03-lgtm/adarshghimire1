<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durbar - Photos</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    .photo-navbar {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .photo-navbar .nav-left {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .photo-navbar .nav-left .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.4rem 1.2rem 0.4rem 1rem;
      border-radius: 40px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .photo-navbar .nav-left .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transform: translateX(-3px);
    }
    .photo-navbar .nav-left .back-btn i {
      font-size: 0.9rem;
    }

    .photo-navbar .nav-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
    }

    .photo-navbar .nav-info .photo-counter {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-weight: 500;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .photo-navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .photo-navbar .nav-right .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .photo-navbar .nav-right .tool-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    .photo-navbar .nav-right .tool-btn i {
      font-size: 0.9rem;
    }

    /* Photo Grid */
    .photo-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .photo-grid .photo-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
      transition: all 0.3s;
      aspect-ratio: 4/3;
    }

    .photo-grid .photo-item:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .photo-grid .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-grid .photo-item .photo-number {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .photo-grid .photo-item .photo-number i {
      font-size: 0.6rem;
    }

    /* Lightbox Overlay */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: pointer;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-overlay .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    .lightbox-overlay .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.8);
    }

    .lightbox-overlay .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.5rem;
      padding: 0.8rem 1rem;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    .lightbox-overlay .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .lightbox-overlay .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.8rem;
      padding: 1rem 1.2rem;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    .lightbox-overlay .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .lightbox-overlay .lightbox-nav.prev {
      left: 1.5rem;
    }
    .lightbox-overlay .lightbox-nav.next {
      right: 1.5rem;
    }

    .lightbox-overlay .lightbox-counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Empty State */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .photo-navbar {
        padding: 0.6rem 1rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      
      .photo-navbar .nav-left .back-btn span {
        display: none;
      }
      
      .photo-navbar .nav-info .photo-counter {
        font-size: 0.7rem;
        padding: 0.15rem 0.6rem;
      }

      .photo-grid-container {
        padding: 1rem;
      }

      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.8rem;
      }

      .lightbox-overlay .lightbox-nav {
        padding: 0.6rem 0.8rem;
        font-size: 1.2rem;
      }
      .lightbox-overlay .lightbox-nav.prev { left: 0.5rem; }
      .lightbox-overlay .lightbox-nav.next { right: 0.5rem; }
      .lightbox-overlay .lightbox-close {
        top: 0.8rem;
        right: 0.8rem;
        font-size: 1.2rem;
        padding: 0.6rem 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="photo-navbar">
  <div class="nav-left">
    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </button>
    <div class="nav-info">
      <span id="noteTitle">Photos</span>
      <span class="photo-counter" id="photoCounter">0 photos</span>
    </div>
  </div>
  <div class="nav-right">
    <button class="tool-btn" onclick="toggleGrid()">
      <i class="fas fa-th"></i>
      <span>Grid</span>
    </button>
  </div>
</nav>

<!-- Photo Grid -->
<div class="photo-grid-container">
  <div id="photoGrid" class="photo-grid"></div>
  <div id="emptyState" class="empty-state">
    <i class="fas fa-images"></i>
    <h3>No photos found</h3>
    <p>This note doesn't have any photos yet.</p>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)"><i class="fas fa-times"></i></button>
  <button class="lightbox-nav prev" onclick="navigateLightbox(-1, event)"><i class="fas fa-chevron-left"></i></button>
  <button class="lightbox-nav next" onclick="navigateLightbox(1, event)"><i class="fas fa-chevron-right"></i></button>
  <div class="lightbox-content" id="lightboxContent">
    <img id="lightboxImage" src="" alt="Photo">
  </div>
  <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
</div>

<script>
  (function() {
    // Get photos from URL
    const params = new URLSearchParams(window.location.search);
    const photosParam = params.get('photos') || '';
    const noteTitle = params.get('note') || 'Photos';
    const position = params.get('position') || '';

    // Parse photos
    let photos = [];
    if (photosParam) {
      photos = photosParam.split('||').map(url => decodeURIComponent(url));
    }

    // Update UI
    document.getElementById('noteTitle').textContent = noteTitle || 'Photos';
    document.getElementById('photoCounter').textContent = photos.length + ' photos';

    const grid = document.getElementById('photoGrid');
    const emptyState = document.getElementById('emptyState');

    if (photos.length === 0) {
      grid.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }

    // Render photos
    photos.forEach((url, index) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Photo ' + (index + 1);
      img.loading = 'lazy';
      
      const number = document.createElement('div');
      number.className = 'photo-number';
      number.innerHTML = '<i class="fas fa-camera"></i> ' + (index + 1);
      
      item.appendChild(img);
      item.appendChild(number);
      
      item.addEventListener('click', function() {
        openLightbox(index);
      });
      
      grid.appendChild(item);
    });

    // Lightbox functionality
    let currentIndex = 0;
    let isLightboxOpen = false;

    window.openLightbox = function(index) {
      currentIndex = index;
      isLightboxOpen = true;
      const overlay = document.getElementById('lightboxOverlay');
      const image = document.getElementById('lightboxImage');
      const counter = document.getElementById('lightboxCounter');
      
      overlay.classList.add('active');
      image.src = photos[currentIndex];
      counter.textContent = (currentIndex + 1) + ' / ' + photos.length;
      
      document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function(e) {
      if (e && e.target !== e.currentTarget && e.target.className !== 'lightbox-close') return;
      
      const overlay = document.getElementById('lightboxOverlay');
      overlay.classList.remove('active');
      isLightboxOpen = false;
      document.body.style.overflow = '';
    };

    window.navigateLightbox = function(direction, e) {
      if (e) {
        e.stopPropagation();
      }
      
      currentIndex = (currentIndex + direction + photos.length) % photos.length;
      const image = document.getElementById('lightboxImage');
      const counter = document.getElementById('lightboxCounter');
      
      image.src = photos[currentIndex];
      counter.textContent = (currentIndex + 1) + ' / ' + photos.length;
    };

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (!isLightboxOpen) return;
      
      if (e.key === 'Escape') {
        closeLightbox(e);
      } else if (e.key === 'ArrowLeft') {
        navigateLightbox(-1, e);
      } else if (e.key === 'ArrowRight') {
        navigateLightbox(1, e);
      }
    });

    // Grid toggle
    let isCompact = false;
    window.toggleGrid = function() {
      isCompact = !isCompact;
      const grid = document.getElementById('photoGrid');
      if (isCompact) {
        grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(160px, 1fr))';
        grid.style.gap = '0.6rem';
      } else {
        grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(280px, 1fr))';
        grid.style.gap = '1.5rem';
      }
    };

    // Go back function
    window.goBack = function() {
      if (document.referrer && document.referrer.includes(window.location.hostname)) {
        window.history.back();
      } else {
        window.location.href = 'notes.html';
      }
    };

  })();
</script>

</body>
</html>
